<title>Méré Kitchen Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  /* ---- tokens: complete light palette on bare :root ---- */
  :root {
    --paper:      #F4F6F1;
    --card:       #FFFFFF;
    --card-sunk:  #FAFBF8;
    --ink:        #1B211A;
    --ink-2:      #56604F;
    --ink-3:      #8A9284;
    --rule:       #DCE2D5;
    --rule-soft:  #E9EDE4;
    --herb:       #40602A;
    --herb-soft:  #E6EEDA;
    --yuzu:       #9C6E04;
    --yuzu-soft:  #F8EFD6;
    --clay:       #8F4429;
    --clay-soft:  #F6E5DE;
    --shadow:     0 1px 2px rgba(27,33,26,.05), 0 8px 24px -16px rgba(27,33,26,.22);
    --focus:      #2F6F3E;

    --f-display: "Fraunces", "Iowan Old Style", Georgia, serif;
    --f-body:    "Archivo", "Helvetica Neue", Arial, sans-serif;
    --f-mono:    "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:     #14180F;
      --card:      #1D2218;
      --card-sunk: #191E14;
      --ink:       #E9EDE3;
      --ink-2:     #A7B29D;
      --ink-3:     #77826D;
      --rule:      #2F3728;
      --rule-soft: #262D20;
      --herb:      #9CC072;
      --herb-soft: #26311B;
      --yuzu:      #E0B24C;
      --yuzu-soft: #322913;
      --clay:      #D08768;
      --clay-soft: #35211A;
      --shadow:    0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
      --focus:     #9CC072;
    }
  }
  :root[data-theme="dark"] {
    --paper:     #14180F;
    --card:      #1D2218;
    --card-sunk: #191E14;
    --ink:       #E9EDE3;
    --ink-2:     #A7B29D;
    --ink-3:     #77826D;
    --rule:      #2F3728;
    --rule-soft: #262D20;
    --herb:      #9CC072;
    --herb-soft: #26311B;
    --yuzu:      #E0B24C;
    --yuzu-soft: #322913;
    --clay:      #D08768;
    --clay-soft: #35211A;
    --shadow:    0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
    --focus:     #9CC072;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 16px/1.55 var(--f-body);
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 42rem; margin: 0 auto; padding: 0 1.15rem 4rem; }

  /* ---- masthead ---- */
  .masthead { padding: 2.1rem 0 1.15rem; }
  .eyebrow {
    font: 500 .68rem/1 var(--f-mono);
    letter-spacing: .13em; text-transform: uppercase;
    color: var(--herb);
  }
  h1 {
    font: 700 clamp(2rem, 8vw, 2.9rem)/1.05 var(--f-display);
    font-variation-settings: "opsz" 120;
    margin: .5rem 0 0; letter-spacing: -.015em; text-wrap: balance;
  }
  .strapline { color: var(--ink-2); margin: .5rem 0 0; max-width: 34rem; }

  /* the receipt tally under the title */
  .tally {
    display: flex; flex-wrap: wrap; gap: .35rem 1.4rem;
    margin-top: 1.1rem; padding-top: .85rem;
    border-top: 1.5px solid var(--ink);
    font: 500 .8rem/1.4 var(--f-mono);
    font-variant-numeric: tabular-nums;
  }
  .tally b { color: var(--ink); font-weight: 600; }
  .tally-pair { white-space: nowrap; }
  .tally span { color: var(--ink-3); }

  /* ---- tabs ---- */
  .tabs {
    position: sticky; top: 0; z-index: 20;
    display: flex; gap: .1rem;
    margin: 1.4rem 0 0;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    padding-top: .3rem;
  }
  .tab {
    flex: 1; appearance: none; border: 0; background: none; cursor: pointer;
    padding: .8rem .3rem .65rem;
    font: 500 .78rem/1 var(--f-mono);
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-3);
    border-bottom: 2.5px solid transparent;
    margin-bottom: -1px;
    transition: color .15s;
  }
  .tab:hover { color: var(--ink-2); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--herb); }

  /* ---- controls ---- */
  .controls { padding: 1.25rem 0 .3rem; display: flex; flex-direction: column; gap: .95rem; }
  .ctl-label {
    font: 500 .66rem/1 var(--f-mono);
    letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
    display: block; margin-bottom: .45rem;
  }
  .seg { display: flex; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
  .seg button {
    flex: 1; appearance: none; border: 0; cursor: pointer;
    background: var(--card); color: var(--ink-2);
    padding: .55rem .4rem;
    font: 500 .78rem/1.2 var(--f-body);
    border-right: 1px solid var(--rule);
    transition: background .15s, color .15s;
  }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { background: var(--card-sunk); }
  .seg button[aria-pressed="true"] { background: var(--herb); color: var(--card); }

  .slider-row { display: flex; align-items: center; gap: .8rem; }
  input[type=range] { flex: 1; accent-color: var(--herb); height: 1.6rem; }
  .slider-val {
    font: 600 .82rem/1 var(--f-mono); color: var(--ink);
    font-variant-numeric: tabular-nums; min-width: 5.4rem; text-align: right;
  }

  details.chipbox { border: 1px solid var(--rule); border-radius: 3px; background: var(--card); }
  details.chipbox > summary {
    cursor: pointer; list-style: none; padding: .6rem .75rem;
    font: 500 .78rem/1.2 var(--f-body); color: var(--ink-2);
    display: flex; justify-content: space-between; align-items: center; gap: .5rem;
  }
  details.chipbox > summary::-webkit-details-marker { display: none; }
  details.chipbox > summary::after { content: "+"; font: 500 1rem/1 var(--f-mono); color: var(--ink-3); }
  details.chipbox[open] > summary::after { content: "–"; }
  .chips { display: flex; flex-wrap: wrap; gap: .35rem; padding: 0 .75rem .75rem; }
  .chip {
    appearance: none; cursor: pointer;
    border: 1px solid var(--rule); border-radius: 100px; background: var(--card-sunk);
    color: var(--ink-2); padding: .32rem .68rem;
    font: 400 .78rem/1.3 var(--f-body);
    transition: background .12s, color .12s, border-color .12s;
  }
  .chip:hover { border-color: var(--ink-3); }
  .chip[aria-pressed="true"] {
    background: var(--herb-soft); border-color: var(--herb); color: var(--herb); font-weight: 500;
  }

  .active-filters {
    display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
    font: 400 .8rem/1.4 var(--f-body); color: var(--ink-2);
    padding: .1rem 0 .2rem;
  }
  .linkbtn {
    appearance: none; border: 0; background: none; cursor: pointer; padding: 0;
    font: 500 .8rem/1.4 var(--f-body); color: var(--herb);
    text-decoration: underline; text-underline-offset: 2px;
  }

  /* ---- group headings ---- */
  .group-head {
    display: flex; align-items: baseline; gap: .6rem;
    margin: 1.9rem 0 .7rem;
  }
  .group-head:first-of-type { margin-top: 1.1rem; }
  .group-head h2 {
    margin: 0;
    font: 500 .72rem/1 var(--f-mono);
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
    white-space: nowrap;
  }
  .leader { flex: 1; border-bottom: 1px dotted var(--rule); transform: translateY(-.22em); }
  .group-count { font: 400 .72rem/1 var(--f-mono); color: var(--ink-3); }

  /* one drawn icon per shopping section, so the list scans as a basket rather
     than a ledger. Tinted from the existing palette, never a flat emoji. */
  /* the heading row is baseline-aligned, which would hang the badge below the
     cap height; centring the row instead puts it beside the words. */
  .group-head.has-icon { align-items: center; }
  .sec-icon {
    flex: none;
    width: 1.6rem; height: 1.6rem; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--herb-soft); color: var(--herb);
  }
  .sec-icon svg { width: 1rem; height: 1rem; display: block; }
  .sec-icon.is-clay  { background: var(--clay-soft); color: var(--clay); }
  .sec-icon.is-yuzu  { background: var(--yuzu-soft); color: var(--yuzu); }
  .sec-icon.is-quiet { background: var(--rule-soft); color: var(--ink-3); }

  /* ---- meal / recipe cards ---- */
  .cards { display: flex; flex-direction: column; gap: .7rem; }
  .card {
    background: var(--card); border: 1px solid var(--rule); border-radius: 4px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .card.is-lunch { background: var(--card-sunk); }
  .card-top {
    display: flex; align-items: baseline; gap: .55rem;
    padding: .8rem .95rem .1rem;
    font: 500 .7rem/1.2 var(--f-mono);
    letter-spacing: .1em; text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }
  .card-day { color: var(--herb); white-space: nowrap; }
  .card-slot { color: var(--ink-3); }
  .card-time { color: var(--yuzu); white-space: nowrap; }
  .card-body { padding: .1rem .95rem 1rem; }
  .card h3 {
    margin: .3rem 0 .1rem;
    font: 600 1.28rem/1.2 var(--f-display);
    font-variation-settings: "opsz" 36;
    letter-spacing: -.01em; text-wrap: balance;
  }
  .card-meta {
    font: 400 .76rem/1.4 var(--f-mono); color: var(--ink-3);
    margin-bottom: .5rem;
  }
  .card-short { margin: 0 0 .7rem; color: var(--ink-2); font-size: .93rem; }
  .card-note {
    margin: 0 0 .7rem; padding: .5rem .65rem;
    background: var(--herb-soft); border-radius: 3px;
    font-size: .86rem; color: var(--ink-2);
  }
  .tags { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: .75rem; }
  .tag {
    font: 500 .68rem/1 var(--f-mono); letter-spacing: .05em;
    padding: .3rem .5rem; border-radius: 2px;
    background: var(--rule-soft); color: var(--ink-2);
  }
  .tag.is-batch { background: var(--herb-soft); color: var(--herb); }
  .tag.is-fast  { background: var(--yuzu-soft); color: var(--yuzu); }

  .expand {
    appearance: none; width: 100%; cursor: pointer; text-align: left;
    border: 1px solid var(--rule); border-radius: 3px; background: var(--card-sunk);
    color: var(--ink-2); padding: .52rem .7rem;
    font: 500 .8rem/1.2 var(--f-body);
    display: flex; justify-content: space-between; align-items: center;
    transition: background .13s;
  }
  .expand:hover { background: var(--rule-soft); }
  .expand .caret { font: 400 .8rem/1 var(--f-mono); color: var(--ink-3); }

  .drawer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s ease; }
  .drawer > div { overflow: hidden; }
  .card.open .drawer { grid-template-rows: 1fr; }
  @media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }

  .drawer-inner { padding-top: 1rem; }
  .sub {
    font: 500 .66rem/1 var(--f-mono); letter-spacing: .13em; text-transform: uppercase;
    color: var(--ink-3); margin: 0 0 .55rem;
  }
  .ing { list-style: none; margin: 0 0 1.2rem; padding: 0; }
  .ing li { padding: .3rem 0; border-bottom: 1px dotted var(--rule); }
  .ing li:last-child { border-bottom: 0; }
  .ing-row { display: flex; align-items: baseline; gap: .5rem; }
  .ing-name { font-size: .92rem; }
  .ing-qty {
    font: 500 .8rem/1.4 var(--f-mono); color: var(--ink-2);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .ing-product { font: 400 .72rem/1.4 var(--f-mono); color: var(--ink-3); margin-top: .05rem; }
  .flag {
    font: 500 .62rem/1 var(--f-mono); letter-spacing: .07em; text-transform: uppercase;
    padding: .2rem .35rem; border-radius: 2px; margin-left: .35rem;
    background: var(--yuzu-soft); color: var(--yuzu); white-space: nowrap;
  }
  .flag.pantry { background: var(--rule-soft); color: var(--ink-3); }

  ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  ol.steps li {
    counter-increment: s; position: relative;
    padding: 0 0 .85rem 2.1rem; font-size: .93rem; color: var(--ink-2);
  }
  ol.steps li::before {
    content: counter(s); position: absolute; left: 0; top: .05rem;
    font: 600 .72rem/1.55rem var(--f-mono); color: var(--herb);
    width: 1.55rem; height: 1.55rem; text-align: center;
    background: var(--herb-soft); border-radius: 100px;
  }
  ol.steps li:last-child { padding-bottom: 0; }

  /* ---- shopping ---- */
  .meter { margin: 1.3rem 0 .4rem; }
  .meter-bar {
    height: 8px; border-radius: 100px; background: var(--rule-soft);
    overflow: hidden; border: 1px solid var(--rule);
  }
  .meter-fill { height: 100%; background: var(--herb); }
  .meter-fill.over { background: var(--clay); }
  .meter-row {
    display: flex; justify-content: space-between; gap: 1rem; margin-top: .5rem;
    font: 500 .78rem/1.4 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink-2);
  }
  .shop-sec { margin-top: 1.7rem; }
  .shop-list { list-style: none; margin: .55rem 0 0; padding: 0; }
  .shop-list li { padding: .5rem 0; border-bottom: 1px dotted var(--rule); }
  .shop-line { display: flex; align-items: baseline; gap: .45rem; }
  .shop-name { font-size: .9rem; }
  .shop-dots { flex: 1; border-bottom: 1px dotted var(--rule); transform: translateY(-.25em); min-width: 1rem; }
  .shop-cost {
    font: 600 .84rem/1.4 var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .shop-sub {
    font: 400 .73rem/1.45 var(--f-mono); color: var(--ink-3); margin-top: .1rem;
    display: flex; flex-wrap: wrap; gap: .1rem .6rem;
  }
  .shop-total {
    display: flex; justify-content: space-between; gap: 1rem;
    margin-top: 1.5rem; padding-top: .8rem; border-top: 1.5px solid var(--ink);
    font: 600 1rem/1.3 var(--f-mono); font-variant-numeric: tabular-nums;
  }

  .search {
    width: 100%; padding: .6rem .75rem;
    border: 1px solid var(--rule); border-radius: 3px;
    background: var(--card); color: var(--ink);
    font: 400 .92rem/1.3 var(--f-body);
  }
  .search::placeholder { color: var(--ink-3); }

  .served { font: 400 .73rem/1.4 var(--f-mono); color: var(--ink-3); margin-top: .5rem; }
  .empty {
    text-align: center; padding: 3rem 1rem; color: var(--ink-3);
    font-size: .95rem; border: 1px dashed var(--rule); border-radius: 4px; margin-top: 1.2rem;
  }
  .foot {
    margin-top: 2.8rem; padding-top: 1rem; border-top: 1px solid var(--rule);
    font: 400 .74rem/1.6 var(--f-mono); color: var(--ink-3);
  }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
</style>
<style>
  /* ---- additions for the app: sync, swap, toolbar ---- */
  .syncline {
    display: flex; align-items: center; gap: .45rem;
    font: 400 .72rem/1.4 var(--f-mono); color: var(--ink-3);
    margin-top: .6rem;
  }
  .dot { width: .5rem; height: .5rem; border-radius: 100px; background: var(--ink-3); flex: none; }
  .dot.live { background: var(--herb); }
  .dot.off  { background: var(--yuzu); }

  .toolbar { display: flex; gap: .4rem; flex-wrap: wrap; }
  .btn {
    appearance: none; cursor: pointer;
    border: 1px solid var(--rule); border-radius: 3px; background: var(--card);
    color: var(--ink-2); padding: .5rem .7rem;
    font: 500 .78rem/1.2 var(--f-body);
    transition: background .13s, border-color .13s;
  }
  .btn:hover { background: var(--card-sunk); border-color: var(--ink-3); }
  .btn.primary { background: var(--herb); border-color: var(--herb); color: var(--card); }
  .btn.primary:hover { filter: brightness(1.08); background: var(--herb); }
  .btn:disabled { opacity: .5; cursor: default; }

  .card-actions { display: flex; gap: .4rem; margin-top: .1rem; }
  .card-actions .expand { flex: 1; }
  .swapbtn { white-space: nowrap; }

  .tag.is-pack { background: var(--clay-soft); color: var(--clay); }
  .packnote {
    margin: 0 0 .7rem; padding: .5rem .65rem;
    background: var(--clay-soft); border-radius: 3px;
    font-size: .86rem; color: var(--ink-2);
  }
  .swapped {
    font: 500 .66rem/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase;
    color: var(--yuzu);
  }

  /* ---- swap sheet ---- */
  dialog.sheet {
    border: 0; padding: 0; background: transparent;
    width: min(34rem, 100vw); max-width: 100vw;
    margin: auto auto 0; /* bottom sheet on phones */
  }
  dialog.sheet::backdrop { background: rgba(10, 14, 8, .55); }
  .sheet-inner {
    background: var(--card); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 8px 8px 0 0;
    padding: 1.1rem 1.1rem 1.4rem;
    max-height: 86vh; overflow-y: auto;
  }
  @media (min-width: 40rem) {
    dialog.sheet { margin: auto; }
    .sheet-inner { border-radius: 6px; }
  }
  .sheet-head { display: flex; align-items: baseline; gap: .6rem; margin-bottom: .3rem; }
  .sheet-head h2 {
    margin: 0; font: 600 1.15rem/1.2 var(--f-display); font-variation-settings: "opsz" 36;
  }
  .sheet-sub { font: 400 .78rem/1.4 var(--f-mono); color: var(--ink-3); margin-bottom: .9rem; }
  .alts { display: flex; flex-direction: column; gap: .35rem; margin-bottom: .9rem; }
  .alt {
    appearance: none; cursor: pointer; text-align: left; width: 100%;
    border: 1px solid var(--rule); border-radius: 3px; background: var(--card-sunk);
    padding: .6rem .7rem; color: var(--ink);
    display: flex; align-items: baseline; gap: .5rem;
    transition: border-color .12s, background .12s;
  }
  .alt:hover { border-color: var(--herb); background: var(--herb-soft); }
  .alt-name { font: 500 .93rem/1.3 var(--f-body); }
  .alt-meta { font: 400 .74rem/1.3 var(--f-mono); color: var(--ink-3); white-space: nowrap; }
  .sheet-foot { display: flex; gap: .4rem; flex-wrap: wrap; }
  .genstate {
    font: 400 .8rem/1.5 var(--f-body); color: var(--ink-2);
    padding: .7rem; background: var(--herb-soft); border-radius: 3px; margin-bottom: .7rem;
  }
  .genstate.err { background: var(--clay-soft); color: var(--clay); }

  /* ---- the ingredient layer: per-line controls on the shopping list ---- */
  .savedline {
    margin-top: .8rem; padding: .6rem .7rem;
    background: var(--herb-soft); border-radius: 3px;
    font: 400 .85rem/1.45 var(--f-body); color: var(--ink-2);
  }

  .line-ctl { display: flex; flex-wrap: wrap; gap: .3rem; align-items: center; margin-top: .45rem; }

  .step { display: inline-flex; align-items: stretch; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
  .stepbtn {
    appearance: none; border: 0; cursor: pointer; background: var(--card);
    color: var(--ink-2); padding: .2rem .5rem; min-width: 1.9rem;
    font: 500 .95rem/1.4 var(--f-mono);
  }
  .stepbtn:hover { background: var(--rule-soft); color: var(--ink); }
  .stepval {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 3.1rem; padding: .2rem .25rem;
    border-left: 1px solid var(--rule); border-right: 1px solid var(--rule);
    background: var(--card-sunk);
    font: 500 .76rem/1.4 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink);
  }
  /* nothing held yet — present, but not competing with the numbers that matter */
  .step.is-zero .stepval { color: var(--ink-3); }

  .minibtn {
    appearance: none; cursor: pointer;
    border: 1px solid var(--rule); border-radius: 3px; background: var(--card);
    color: var(--ink-2); padding: .25rem .55rem;
    font: 500 .74rem/1.45 var(--f-body);
    transition: background .12s, border-color .12s, color .12s;
  }
  .minibtn:hover { background: var(--card-sunk); border-color: var(--ink-3); color: var(--ink); }
  .minibtn.danger:hover { border-color: var(--clay); color: var(--clay); background: var(--clay-soft); }

  /* struck through, but still legible — this is the audit trail, not a bin */
  .shop-list li.is-kitchen .shop-name { text-decoration: line-through; text-decoration-color: var(--ink-3); }
  .shop-list li.is-kitchen .shop-name,
  .shop-list li.is-kitchen .shop-cost { color: var(--ink-3); }

  details.kitchenbox { margin-top: 1.8rem; }
  details.kitchenbox > summary { font: 500 .82rem/1.3 var(--f-body); color: var(--ink); }
  .kitchen-body { padding: 0 .75rem .8rem; }

<script>
const DATA = /*__DATA__*/ null;
const LIB = DATA.recipes, PRICES = DATA.pricebook, STAPLES = DATA.staples, CONF = DATA.config;
const ONHAND = DATA.onHand || { from: null, items: [] };
const EQUIV = DATA.equivalents || [];
const plan = [...DATA.plans].sort((a, b) => b.weekOf.localeCompare(a.weekOf))[0];

/* ---------- helpers ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = (n) => n.toFixed(2).replace(".", ",") + " €";
const cap = (s) => String(s).charAt(0).toUpperCase() + String(s).slice(1);
const DAYS = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];

/* ---------- state ----------
   `baseline` is what the build shipped. `picks` is what is on the menu now.
   `extra` holds dishes generated at runtime — they live in the shared document
   too, or a swap would render as a blank card on the other person's phone. */
const baseline = Object.fromEntries(plan.meals.map((m) => [m.id, m.recipe]));
let picks = { ...baseline };
let extra = {};
let db = null, weekRef = null, sample = null;

/* The ingredient layer. The dishes decide what the week *needs*; these five
   decide what actually has to be bought, and every one of them is hers to set
   from the Shopping tab. They ride in the same shared document as `picks`, so
   both phones agree on the basket as well as the menu. */
const haveSeed = Object.fromEntries(ONHAND.items.map((i) => [i.product, i.quantity]));
let have    = { ...haveSeed };  // product -> how much is already in the kitchen
let qtyAdj  = {};               // product -> override what the recipes asked for
let subs    = {};               // product -> buy this one instead
let dropped = {};               // product -> struck off by hand
let added   = {};               // key -> { name, qty, section } she added herself

const all = () => ({ ...LIB, ...extra });
const dishFor = (mealId) => all()[picks[mealId]];
const mealById = (id) => plan.meals.find((m) => m.id === id);
const minutesOf = (m, r) => m.minutesOverride ?? (r.prepMinutes + r.cookMinutes);
const changed = () => Object.keys(picks).filter((k) => picks[k] !== baseline[k]);
const sameHave = () => Object.keys({ ...have, ...haveSeed })
  .every((k) => (have[k] || 0) === (haveSeed[k] || 0));
/* Anything at all touched on the Shopping tab, so the reset button knows to
   show itself. */
const shopEdited = () => !sameHave() ||
  [qtyAdj, subs, dropped, added].some((o) => Object.keys(o).length > 0);

/* Every meal, resolved. Skips a pick whose dish has gone missing. */
function meals() {
  return plan.meals.map((m) => {
    const r = dishFor(m.id);
    if (!r) return null;
    return { ...m, r, minutes: minutesOf(m, r), leftovers: !!m.leftovers,
             ingredients: (r.ingredients || []).map((i) => i.item.toLowerCase()),
             isSwapped: picks[m.id] !== baseline[m.id] };
  }).filter(Boolean);
}

/* ---------- equivalences ----------
   A curated map, shipped from data/equivalents.json. It exists so that the
   Jean Rozé pork chops on Saturday's receipt count against a recipe that names
   the Terroirs ones. Every match it makes is printed on the line that it
   covered — an equivalence is reported, never silent, because quietly swapping
   one product for another is exactly the thing this app must not do. */
const GROUP_OF = {};
for (const g of EQUIV) for (const m of g.members || []) GROUP_OF[m.name] = g;

const unitOf = (product) => (PRICES[product] ? PRICES[product].unit : "unit");
const memberIn = (g, name) => (g.members || []).find((m) => m.name === name);

/* How much of `want` a quantity of `holding` is worth. Within a group priced
   the same way this is one-for-one; where a group mixes a per-kilo product with
   a tray sold by the unit, the tray's `kg` weight converts between them. */
function convert(qty, holding, want) {
  if (holding === want) return qty;
  const g = GROUP_OF[holding];
  if (!g || g !== GROUP_OF[want]) return 0;
  const from = unitOf(holding), to = unitOf(want);
  if (from === to) return qty;
  const w = memberIn(g, from === "kg" ? want : holding).kg;
  if (!w) return 0;                       // build validation should prevent this
  return to === "kg" ? qty * w : qty / w;
}

/* The kitchen as a pool, so two dishes reaching for the same chicken cannot
   both be told it is already covered. Drawn down line by line. */
function pool() {
  const p = new Map();
  for (const [product, qty] of Object.entries(have)) {
    if (qty > 0) p.set(product, qty);
  }
  return p;
}

/* Take up to `need` of `want` out of the pool, preferring an exact name match
   before reaching for an equivalent. Returns what it took and what covered it. */
function draw(p, want, need) {
  let got = 0;
  const from = [];
  const order = [want, ...[...p.keys()].filter((k) => k !== want)];
  for (const holding of order) {
    if (got >= need - 1e-9) break;
    const stock = p.get(holding);
    if (!stock) continue;
    const worth = convert(stock, holding, want);
    if (worth <= 0) continue;
    const take = Math.min(worth, need - got);
    got += take;
    p.set(holding, stock - convert(take, want, holding));
    if (p.get(holding) <= 1e-9) p.delete(holding);
    from.push({ product: holding, exact: holding === want });
  }
  return { got, from };
}

/* ---------- the basket, derived from whatever is on the menu ---------- */
function basket() {
  const acc = new Map();
  // A batch dish is cooked once and eaten three times. Counting its ingredients
  // per serving bought six tins of coconut milk for one pot, so a meal flagged
  // as leftovers eats from a pot already paid for and buys nothing. A dish
  // genuinely cooked twice in a week is not flagged, and does count twice.
  const cooked = meals().filter((m) => !m.leftovers);
  for (const m of cooked) {
    for (const i of m.r.ingredients || []) {
      if (!i.buy) continue;
      let e = acc.get(i.product);
      if (!e) acc.set(i.product, (e = {
        product: i.product, amount: 0, mode: i.buy.mode, section: i.buy.section,
        guess: !!i.guess, guessPrice: i.buy.price, dishes: new Set(),
      }));
      // "sum" adds up across dishes (produce, meat); "once" is a bottle or a bag
      // that covers the week however many dishes reach for it.
      e.amount = e.mode === "sum" ? e.amount + i.buy.amount : Math.max(e.amount, i.buy.amount);
      e.dishes.add(m.r.title);
    }
  }

  // Everything the week asks for, before a word about what is in the kitchen.
  const wanted = [];
  for (const e of acc.values()) {
    wanted.push({ key: e.product, section: e.section, guess: e.guess,
                  guessPrice: e.guessPrice, required: e.amount,
                  for: [...e.dishes].join(", "), kind: "dish" });
  }
  for (const s of STAPLES) {
    wanted.push({ key: s.name, section: "Standing order", guess: false,
                  required: s.quantity, for: s.note || "always on the order",
                  kind: "staple" });
  }
  for (const [key, a] of Object.entries(added)) {
    wanted.push({ key, section: "Added by you", guess: !PRICES[a.name],
                  guessPrice: 3, required: a.qty, name: a.name,
                  for: "you added this", kind: "added" });
  }

  const order = ["Proteins", "Vegetables", "Store cupboard", "Bread and cheese",
                 "Standing order", "Best guesses", "Added by you"];
  wanted.sort((a, b) => (order.indexOf(a.section) - order.indexOf(b.section)) ||
                        a.key.localeCompare(b.key));

  // Now the kitchen. One pool, drawn down in list order, so the same half-kilo
  // of chicken cannot be counted against two different dinners.
  const p = pool();
  const lines = [];
  for (const w of wanted) {
    const name = w.name || subs[w.key] || w.key;
    const pb = PRICES[name];
    const unit = w.guess || !pb ? "unit" : pb.unit;
    const price = w.guess || !pb ? (w.guessPrice ?? 3) : pb.price;

    let required = qtyAdj[w.key] != null ? qtyAdj[w.key] : w.required;
    if (unit !== "kg") required = Math.max(1, Math.ceil(required));  // you cannot buy 1.4 jars

    const struck = !!dropped[w.key];
    const { got, from } = struck ? { got: 0, from: [] } : draw(p, name, required);
    let toBuy = Math.max(0, required - got);
    if (unit !== "kg") toBuy = Math.ceil(toBuy - 1e-9);
    if (struck) toBuy = 0;

    const fmt = (n) => unit === "kg" ? n.toFixed(2).replace(".", ",") + " kg" : "x" + Math.round(n);
    lines.push({
      key: w.key, name, section: w.section, kind: w.kind, guess: w.guess || !pb,
      unit, price, required, covered: Math.min(got, required), toBuy, struck,
      renamed: name !== w.key ? w.key : null,
      coveredBy: from, for: w.for,
      cost: price * toBuy, fullCost: price * required,
      amount: fmt(toBuy), requiredLabel: fmt(required), coveredLabel: fmt(Math.min(got, required)),
    });
  }

  const buy = lines.filter((l) => l.toBuy > 0);
  const kitchen = lines.filter((l) => l.toBuy <= 0);
  return {
    lines: buy, kitchen,
    total: buy.reduce((t, l) => t + l.cost, 0),
    saved: kitchen.reduce((t, l) => t + l.fullCost, 0) +
           lines.filter((l) => l.toBuy > 0).reduce((t, l) => t + (l.fullCost - l.cost), 0),
  };
}

/* ---------- shared state ---------- */
function setSync(kind, text) {
  const d = $("#sync-dot");
  d.className = "dot" + (kind === "live" ? " live" : kind === "off" ? " off" : "");
  $("#sync-text").textContent = text;
}

async function persist() {
  if (!weekRef) return;
  const diff = {};
  for (const k of changed()) diff[k] = picks[k];
  // Only the corrections travel, not the whole kitchen. A quantity she never
  // touched stays whatever the newest receipt says, so a fresh receipt is not
  // overwritten by a stale copy of the old one sitting in the document.
  const haveDiff = {};
  for (const k of new Set([...Object.keys(have), ...Object.keys(haveSeed)])) {
    if ((have[k] || 0) !== (haveSeed[k] || 0)) haveDiff[k] = have[k] || 0;
  }
  try {
    await weekRef.set({
      picks: diff, extra, have: haveDiff, qtyAdj, subs, dropped, added,
      seededFrom: ONHAND.from ? ONHAND.from.order : null,
      updatedAt: Date.now(),
    });
  } catch (e) {
    setSync("off", "Change saved on this phone only — " + (e && e.code ? e.code : "not saved"));
  }
}

function applyRemote(d) {
  if (!d) return;
  extra = { ...extra, ...(d.extra || {}) };
  picks = { ...baseline, ...(d.picks || {}) };
  // A document written against an older receipt keeps its hand corrections, but
  // the receipt underneath it is the new one.
  have = { ...haveSeed, ...(d.have || {}) };
  qtyAdj = d.qtyAdj || {};
  subs = d.subs || {};
  dropped = d.dropped || {};
  added = d.added || {};
  renderAll();
}

(async () => {
  // Never available on the first synchronous run — render first, light up after.
  if (!(window.claude && typeof window.claude.use === "function")) {
    return setSync("off", "Preview — changes are not shared");
  }
  db = await claude.use("db");
  if (!db) return setSync("off", "Changes stay on this phone");
  weekRef = db.doc("weeks/" + plan.weekOf);
  weekRef.onSnapshot(
    (snap) => { applyRemote(snap.data()); setSync("live", "Shared — you and your partner see the same week"); },
    (err) => setSync("off", "Sync stopped (" + err.code + ") — changes stay on this phone"),
  );
  setSync("live", "Shared — you and your partner see the same week");
})();

(async () => {
  if (!(window.claude && typeof window.claude.use === "function")) return;
  sample = await claude.use("sample");
  if (sample) $("#gen-btn").hidden = false;
})();

/* ---------- cards ---------- */
const tagClass = (t) =>
  t === "batch cook" ? " is-batch"
  : t === "fast" || t === "make ahead" || t === "no cook" ? " is-fast"
  : t === "from the freezer" ? " is-pack" : "";

function ingredientList(r) {
  return `<p class="sub">Ingredients &middot; serves ${r.serves}</p>
    <ul class="ing">${(r.ingredients || []).map((i) => `
      <li><div class="ing-row">
        <span class="ing-name">${esc(cap(i.item))}${i.guess ? '<span class="flag">guess</span>' : ""}${i.pantry ? '<span class="flag pantry">have it</span>' : ""}</span>
        <span class="leader"></span><span class="ing-qty">${esc(i.qty)}</span>
      </div><div class="ing-product">${esc(i.product)}</div></li>`).join("")}</ul>`;
}

function card(o) {
  const r = o.r;
  const isPack = r.kind === "assembly";
  return `<article class="card${o.slot === "lunch" ? " is-lunch" : ""}" data-card="${esc(o.key)}">
    <div class="card-top">
      <span class="card-day">${esc(o.day ? cap(o.day) : cap(r.cuisine))}</span>
      <span class="card-slot">${esc(o.slot)}</span>
      ${o.isSwapped ? '<span class="swapped">swapped</span>' : ""}
      <span class="leader"></span>
      <span class="card-time">${o.minutes} min</span>
    </div>
    <div class="card-body">
      <h3>${esc(r.title)}</h3>
      <div class="card-meta">${esc(cap(r.cuisine))} &middot; serves ${r.serves} &middot; ${r.prepMinutes} prep + ${r.cookMinutes} cook</div>
      ${o.leftovers ? '<div class="tags"><span class="tag is-batch">from an earlier pot &middot; nothing to buy</span></div>' : ""}
      ${o.note ? `<p class="card-note">${esc(o.note)}</p>` : ""}
      ${isPack ? `<p class="packnote">${esc(r.packNote)}</p>` : ""}
      <p class="card-short">${esc(r.short)}</p>
      <div class="tags">${(r.tags || []).map((t) => `<span class="tag${tagClass(t)}">${esc(t)}</span>`).join("")}</div>
      ${o.served ? `<div class="served">Served: ${esc(o.served)}</div>` : ""}
      <div class="card-actions">
        <button class="expand" type="button" aria-expanded="false">
          <span>${isPack ? "What you actually cook" : "Ingredients &amp; method"}</span><span class="caret">▾</span>
        </button>
        ${o.mealId ? `<button class="btn swapbtn" type="button" data-swap="${esc(o.mealId)}">Swap</button>` : ""}
      </div>
      <div class="drawer"><div><div class="drawer-inner">
        ${ingredientList(r)}
        <p class="sub">${isPack ? "The part you cook" : "Method"}</p>
        <ol class="steps">${(r.steps || []).map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
      </div></div></div>
    </div>
  </article>`;
}

const groupBlock = (title, count, inner) =>
  `<div class="group-head"><h2>${esc(title)}</h2><span class="leader"></span><span class="group-count">${count}</span></div>
   <div class="cards">${inner}</div>`;

/* ---------- week tab ---------- */
const state = { order: "day", slot: "all", maxTime: 60, ings: new Set() };

function renderIngChips() {
  const list = [...new Set(meals().flatMap((m) => m.ingredients))].sort();
  $("#ingchips").innerHTML = list.map((i) =>
    `<button class="chip" type="button" data-ing="${esc(i)}" aria-pressed="${state.ings.has(i)}">${esc(cap(i))}</button>`).join("");
}

function renderWeek() {
  const list = meals().filter((m) =>
    (state.slot === "all" || m.slot === state.slot) &&
    (state.maxTime >= 60 || m.minutes <= state.maxTime) &&
    (state.ings.size === 0 || m.ingredients.some((i) => state.ings.has(i))));

  const filtered = state.slot !== "all" || state.maxTime < 60 || state.ings.size > 0;
  $("#week-count").textContent = filtered
    ? `${list.length} of ${meals().length} meals`
    : `${meals().length} meals this week`;
  $("#week-clear").hidden = !filtered;
  $("#resetweek").hidden = changed().length === 0;

  if (!list.length) {
    $("#week-out").innerHTML = `<div class="empty">Nothing this week matches that. Try a longer time, or clear the ingredient filters.</div>`;
    return;
  }

  const asCard = (m) => card({
    key: m.id, mealId: m.id, r: m.r, slot: m.slot, minutes: m.minutes,
    note: m.note, isSwapped: m.isSwapped, leftovers: m.leftovers,
    day: state.order === "day" ? null : m.day,
  });

  let html = "";
  if (state.order === "day") {
    for (const d of DAYS) {
      const g = list.filter((m) => m.day === d)
                    .sort((a, b) => (a.slot === "lunch" ? 0 : 1) - (b.slot === "lunch" ? 0 : 1));
      if (g.length) html += groupBlock(cap(d), g.length + (g.length > 1 ? " meals" : " meal"), g.map(asCard).join(""));
    }
  } else if (state.order === "time") {
    const g = [...list].sort((a, b) => a.minutes - b.minutes);
    html += groupBlock("Quickest first", g[0].minutes + "–" + g[g.length - 1].minutes + " min", g.map(asCard).join(""));
  } else {
    for (const c of [...new Set(list.map((m) => m.r.cuisine))].sort()) {
      const g = list.filter((m) => m.r.cuisine === c);
      html += groupBlock(cap(c), g.length, g.map(asCard).join(""));
    }
  }
  $("#week-out").innerHTML = html;
}

/* ---------- recipes tab ---------- */
const rstate = { q: "", slot: "all", cuisines: new Set() };

function renderCuisineChips() {
  const cs = [...new Set(Object.values(all()).map((r) => r.cuisine))].sort();
  $("#rcuisine").innerHTML = cs.map((c) =>
    `<button class="chip" type="button" data-cuisine="${esc(c)}" aria-pressed="${rstate.cuisines.has(c)}">${esc(cap(c))}</button>`).join("");
}

function renderRecipes() {
  const lib = all();
  const servedIn = {};
  for (const p of DATA.plans) for (const m of p.meals) (servedIn[m.recipe] ??= []).push(p.label || p.weekOf);
  for (const [id, slug] of Object.entries(picks)) {
    if (slug !== baseline[id]) (servedIn[slug] ??= []).push(plan.label || plan.weekOf);
  }

  const q = rstate.q.trim().toLowerCase();
  const list = Object.entries(lib).filter(([, r]) =>
    (rstate.slot === "all" || r.slot === rstate.slot) &&
    (rstate.cuisines.size === 0 || rstate.cuisines.has(r.cuisine)) &&
    (!q || (r.title + " " + r.short + " " + r.cuisine + " " + (r.tags || []).join(" ") + " " +
            (r.ingredients || []).map((i) => i.item).join(" ") + " " + (r.steps || []).join(" ")).toLowerCase().includes(q)))
    .sort((a, b) => a[1].title.localeCompare(b[1].title));

  const total = Object.keys(lib).length;
  const filtered = !!q || rstate.slot !== "all" || rstate.cuisines.size > 0;
  $("#rec-count").textContent = filtered ? `${list.length} of ${total} dishes` : `${total} dishes in the library`;
  $("#rec-clear").hidden = !filtered;

  if (!list.length) {
    $("#rec-out").innerHTML = `<div class="empty">No dish matches that yet. The library grows every week.</div>`;
    return;
  }
  const inner = list.map(([k, r]) => {
    const uniq = [...new Set(servedIn[k] || [])];
    return card({ key: "r-" + k, r, day: null, slot: r.slot,
                  minutes: r.prepMinutes + r.cookMinutes,
                  served: uniq.length ? uniq.join(", ") : null });
  }).join("");
  $("#rec-out").innerHTML = `<div class="cards" style="margin-top:1.2rem">${inner}</div>`;
}

const sectionIcon = (name) => {
  const i = SECTION_ICONS[name] || SECTION_ICONS._default;
  return `<span class="sec-icon${i.tint ? " " + i.tint : ""}" aria-hidden="true">${i.svg}</span>`;

/* The receipt date, for the line that explains where "already here" came from. */
const onHandDate = () => {
  const f = ONHAND.from;
  if (!f) return "";
  const d = new Date(Date.UTC(f.date.year, f.date.month - 1, f.date.day));
  return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
};

const andList = (xs) => xs.length < 2 ? (xs[0] || "") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];

/* Why a line is not being bought, in her words rather than the model's. */
function coverReason(l) {
  if (l.struck) return "you struck this off";
  const exact = l.coveredBy.some((c) => c.exact);
  const others = l.coveredBy.filter((c) => !c.exact).map((c) => c.product);
  const bits = [];
  if (exact) bits.push("already here");
  // The whole point of the equivalents file: say which product stood in.
  if (others.length) bits.push("covered by " + andList(others));
  return bits.join(", ") || "already here";
}

/* Which product the stepper actually adjusts. Normally the line's own, but a
   line covered by an equivalent holds none of itself — pressing − on the
   Terroirs pork chops must change the count of the Jean Rozé ones she has, or
   the button would appear to do nothing. */
function stepTarget(l) {
  if (have[l.key]) return l.key;
  const other = l.coveredBy.find((c) => !c.exact);
  return other ? other.product : l.key;
}

/* The − n + stepper. `have` is what she is setting; the label carries the unit
   so a kilo of onions does not read as one onion. */
function stepper(l) {
  const key = stepTarget(l);
  const held = have[key] || 0;
  const unit = key === l.key ? l.unit : unitOf(key);
  const label = unit === "kg" ? held.toFixed(2).replace(".", ",") + " kg" : String(Math.round(held));
  return `<span class="step${held ? "" : " is-zero"}" role="group" aria-label="How much ${esc(key)} you already have">
      <button class="stepbtn" type="button" data-have="${esc(key)}" data-dir="-1" aria-label="Less ${esc(key)}">−</button>
      <span class="stepval">${esc(label)}</span>
      <button class="stepbtn" type="button" data-have="${esc(key)}" data-dir="1" aria-label="More ${esc(key)}">+</button>
    </span>`;
}

function shopLine(l, inKitchen) {
  const partly = !inKitchen && l.covered > 0;
  const sub = [];
  sub.push(inKitchen ? esc(l.requiredLabel) + " needed" : esc(l.amount) + " to buy");
  if (partly) sub.push(esc(l.requiredLabel) + " needed, " + esc(l.coveredLabel) + " already here");
  if (inKitchen || partly) sub.push(esc(coverReason(l)));
  if (l.renamed) sub.push("instead of " + esc(l.renamed));
  sub.push(esc(l.for));

  // Striking off a line that is not being bought anyway would say nothing, so
  // the ✕ only appears where there is something to strike.
  const strike = l.struck
    ? `<button class="minibtn" type="button" data-strike="${esc(l.key)}">Put it back</button>`
    : inKitchen ? ""
    : `<button class="minibtn danger" type="button" data-strike="${esc(l.key)}" aria-label="Strike ${esc(l.name)} off the list">✕</button>`;

  return `<li class="${inKitchen ? "is-kitchen" : ""}">
    <div class="shop-line">
      <span class="shop-name">${esc(l.name)}${l.guess ? '<span class="flag">guess</span>' : ""}</span>
      <span class="shop-dots"></span>
      <span class="shop-cost">${inKitchen ? "—" : eur(l.cost)}</span>
    </div>
    <div class="shop-sub">${sub.map((s) => `<span>${s}</span>`).join("")}</div>
    <div class="line-ctl">
      ${stepper(l)}
      <button class="minibtn" type="button" data-allof="${esc(l.key)}">${inKitchen ? "Need it after all" : "I have it"}</button>
      ${l.kind === "added" ? "" : `<button class="minibtn" type="button" data-subswap="${esc(l.key)}">Swap</button>`}
      ${strike}
    </div>
  </li>`;
}

function renderShop() {
  const { lines, kitchen, total, saved } = basket();
  const ceiling = CONF.budgetCeiling;
  const pct = Math.min(100, (total / ceiling) * 100);
  const over = total > ceiling;

  let html = `<div class="meter">
      <div class="meter-bar"><div class="meter-fill${over ? " over" : ""}" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="meter-row"><span>${eur(total)} to buy</span><span>${eur(ceiling)} ceiling</span></div>
    </div>`;
  if (saved > 0.005) {
    html += `<div class="savedline">${eur(saved)} of this week's cooking is already in the kitchen and has been taken off the list.</div>`;
  }
  if (over) html += `<div class="empty" style="margin-top:.9rem;border-color:var(--clay);color:var(--clay)">Over the ceiling by ${eur(total - ceiling)}. Swap something out, or raise it.</div>`;

  html += `<div class="toolbar" style="margin-top:1.1rem">
      <button class="btn" id="additem">Add something</button>
      <button class="btn" id="resetshop"${shopEdited() ? "" : " hidden"}>Back to what the receipt says</button>
    </div>`;

  const secs = [];
  for (const l of lines) {
    let s = secs.find((x) => x.name === l.section);
    if (!s) secs.push((s = { name: l.section, lines: [] }));
    s.lines.push(l);
  }
  for (const s of secs) {
    const sub = s.lines.reduce((a, b) => a + b.cost, 0);
    html += `<div class="shop-sec">
      <div class="group-head has-icon" style="margin:0">${sectionIcon(s.name)}<h2>${esc(s.name)}</h2><span class="leader"></span><span class="group-count">${eur(sub)}</span></div>
      <ul class="shop-list">${s.lines.map((l) => shopLine(l, false)).join("")}</ul>
    </div>`;
  }
  if (!lines.length) {
    html += `<div class="empty" style="margin-top:1.2rem">Nothing left to buy — the kitchen already covers every dish on the menu.</div>`;
  }
  html += `<div class="shop-total"><span>Estimated total</span><span>${eur(total)}</span></div>`;

  // Nothing disappears silently. Everything the week needs but is not being
  // bought is listed here with the reason, so the list still traces back.
  if (kitchen.length) {
    html += `<details class="chipbox kitchenbox">
      <summary>Already in the kitchen — ${kitchen.length} ${kitchen.length === 1 ? "item" : "items"}, ${eur(saved)} not spent</summary>
      <div class="kitchen-body">
        <p class="kitchen-note">From the Drive order collected ${esc(onHandDate())}${ONHAND.from ? ", plus anything you have corrected by hand" : ""}. Tap “Need it after all” to put one back on the list.</p>
        <ul class="shop-list">${kitchen.map((l) => shopLine(l, true)).join("")}</ul>
      </div>
    </details>`;
  }

  const cookCount = meals().filter((m) => !m.leftovers).length;
  html += `<div class="foot" style="margin-top:1.6rem">Rebuilt from the ${cookCount} meals actually cooked this week — ${meals().length - cookCount} more come out of an earlier pot and cost nothing extra. Follows every swap, and every quantity you correct.<br>${(plan.notes || []).map(esc).join("<br>")}</div>`;
  $("#shop-out").innerHTML = html;
}

function setPick(mealId, slug) {

/* ---------- the same sheet, for products rather than dishes ----------
   One dialog, three jobs, so there is a single thing to close and a single set
   of open/close wiring. `sheetMode` says which. */
let sheetMode = "dish";
let productTarget = null;

const priceLabel = (name) => {
  const pb = PRICES[name];
  return pb ? eur(pb.price) + (pb.unit === "kg" ? " / kg" : "") : "no price on file";
};

/* Which aisle a product belongs to, learnt from the recipes that name it. The
   pricebook itself has no sections — it is only names and prices — so this is
   what lets the swap sheet open on something useful instead of a blank search. */
const SECTION_OF = {};
for (const r of Object.values(LIB)) {
  for (const i of r.ingredients || []) {
    if (i.buy && i.buy.section && !SECTION_OF[i.product]) SECTION_OF[i.product] = i.buy.section;
  }
}

/* "beurre" should find the butter, not a shampoo that happens to contain
   "beurre de karité". Rank a name that starts with the query first, then one
   where a word starts with it, then anything containing it. */
function search(query, exclude = []) {
  const q = query.trim().toLowerCase();
  if (q.length < 2) return [];
  const scored = [];
  for (const name of Object.keys(PRICES)) {
    if (exclude.includes(name)) continue;
    const low = name.toLowerCase();
    const at = low.indexOf(q);
    if (at < 0) continue;
    const wordStart = at === 0 || /[^a-z0-9àâäçéèêëîïôöùûü]/.test(low[at - 1]);
    scored.push([at === 0 ? 0 : wordStart ? 1 : 2, at, name]);
  }
  return scored
    .sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2].localeCompare(b[2]))
    .slice(0, 40)
    .map(([, , name]) => name);
}

/* Products offered as a stand-in: the rest of the equivalence group first,
   because those are already known to be the same thing; then, with nothing
   typed, the other products this household buys from the same aisle. */
function productOptions(current, q) {
  const g = GROUP_OF[current];
  const groupNames = g ? (g.members || []).map((m) => m.name).filter((n) => n !== current) : [];
  const head = groupNames.map((n) => ({ name: n, why: g.label }));
  const sec = SECTION_OF[current];
  const rest = q.trim().length >= 2
    ? search(q, [current, ...groupNames]).map((n) => ({ name: n, why: null }))
    : Object.keys(PRICES)
        .filter((n) => n !== current && !groupNames.includes(n) && SECTION_OF[n] === sec)
        .sort((a, b) => a.localeCompare(b))
        .slice(0, 30)
        .map((n) => ({ name: n, why: sec }));
  return [...head, ...rest];
}

function renderProductAlts() {
  const q = $("#sheet-search").value;
  const current = sheetMode === "product" ? (subs[productTarget] || productTarget) : null;
  const opts = sheetMode === "product"
    ? productOptions(current, q)
    : search(q).map((n) => ({ name: n, why: SECTION_OF[n] || null }));

  if (!opts.length) {
    $("#sheet-alts").innerHTML = `<div class="empty" style="padding:1.4rem 1rem">${
      q.trim().length >= 2 ? "Nothing in your receipts matches that." : "Type at least two letters to search."
    }</div>`;
    return;
  }
  const attr = sheetMode === "product" ? "data-pick-product" : "data-add-product";
  $("#sheet-alts").innerHTML = opts.map((o) =>
    `<button class="alt" type="button" ${attr}="${esc(o.name)}">
       <span class="alt-name">${esc(o.name)}${o.why ? ` <span class="flag pantry">${esc(o.why)}</span>` : ""}</span>
       <span class="leader"></span>
       <span class="alt-meta">${esc(priceLabel(o.name))}</span>
     </button>`).join("");
}

function openProductSwap(key) {

  $("#gen-state").innerHTML = "";

function openAddItem() {

/* ---------- the ingredient controls ---------- */
function commitShop() { renderAll(); persist(); }

function bumpHave(key, dir) {
  // Weighed goods move in 100 g steps, everything else one packet at a time.
  const step = unitOf(key) === "kg" ? 0.1 : 1;
  const next = Math.max(0, Math.round(((have[key] || 0) + dir * step) * 100) / 100);
  if (next === 0) delete have[key]; else have[key] = next;
  commitShop();
}

/* "I have it" means all of it — enough that nothing needs buying. Pressed again
   from the kitchen list it means the opposite: none of it. */
function toggleAllOf(key) {
  const b = basket();
  const inKitchen = b.kitchen.some((x) => x.key === key);
  const l = [...b.lines, ...b.kitchen].find((x) => x.key === key);
  if (!l) return;
  if (inKitchen) {
    delete have[key];
    delete dropped[key];
  } else {
    have[key] = (have[key] || 0) + l.toBuy;
  }
  commitShop();
}

function toggleStrike(key) {
  if (dropped[key]) delete dropped[key];
  else if (added[key]) delete added[key];
  else dropped[key] = true;
  commitShop();
}

function addProduct(name) {
  const key = "added:" + name;
  added[key] = { name, qty: (added[key]?.qty || 0) + 1 };
  commitShop();
}

function resetShop() {
  have = { ...haveSeed };
  qtyAdj = {}; subs = {}; dropped = {}; added = {};
  commitShop();
}

/* ---------- generating a new dish ---------- */
function generatePrompt(meal) {
  const c = CONF.constraints;
  const products = Object.keys(PRICES).join("\n");
  const already = Object.values(all()).map((r) => r.title).join("; ");
  return `Invent one ${meal.slot} dish for a household of two in France who shop at Intermarché.

HARD RULES, no exceptions:
- No chilli, no capsaicin, nothing hot. ${c.bannedReason}
- Minimise ${c.limited.join(", ")}. ${c.limitedReason} Cheese is fine. Coconut milk is fine.
- It must be a dish that is genuinely COOKED. Never a recipe for reheating a ready-made or frozen product.
- Total time at most ${meal.slot === "dinner" ? c.maxWeeknightMinutes + 15 : 20} minutes.
- Do not repeat any of these existing dishes: ${already}

Every ingredient that must be bought needs a "product" chosen EXACTLY, character for character, from this list of things they actually buy. If nothing in the list fits, set "guess": true and give buy.price as a euro estimate.

${products}

Reply with JSON only, this exact shape:
{"title":"","cuisine":"italian|french|spanish|greek|japanese|chinese|thai|vietnamese|indian",
 "slot":"${meal.slot}","kind":"recipe","prepMinutes":0,"cookMinutes":0,"serves":${meal.slot === "dinner" ? 2 : 1},
 "tags":["no chilli"],"short":"one sentence a cook can read at the hob",
 "ingredients":[{"item":"plain name","qty":"how much","product":"exact name from the list",
   "buy":{"amount":0.3,"mode":"sum","section":"Proteins|Vegetables|Store cupboard|Bread and cheese"}}],
 "steps":["numbered method, 4 to 7 steps, specific about heat and timing"]}

buy.mode is "sum" for produce and meat, "once" for a bottle or bag that lasts the week. Omit "buy" entirely for salt, pepper, oil or eggs.`;
}

function sanitise(r, slot) {
  if (!r || typeof r !== "object" || !r.title || !Array.isArray(r.steps)) throw new Error("shape");
  r.slot = slot;
  r.kind = "recipe";
  r.serves = r.serves || (slot === "dinner" ? 2 : 1);
  r.prepMinutes = +r.prepMinutes || 10;
  r.cookMinutes = +r.cookMinutes || 15;
  r.tags = Array.isArray(r.tags) ? r.tags : [];
  if (!r.tags.includes("no chilli")) r.tags.push("no chilli");
  r.tags.push("invented");
  r.short = r.short || "";
  r.ingredients = (r.ingredients || []).map((i) => {
    const o = { item: String(i.item || "something"), qty: String(i.qty || ""), product: String(i.product || "") };
    if (i.buy && i.buy.amount != null) {
      const known = !!PRICES[o.product];
      o.guess = !known;
      o.buy = {
        amount: +i.buy.amount || 1,
        mode: i.buy.mode === "once" ? "once" : "sum",
        section: i.buy.section || (known ? "Store cupboard" : "Best guesses"),
      };
      // A product the pricebook has never seen still has to cost something, or
      // the basket would quietly under-report.
      if (!known) { o.buy.price = +i.buy.price || 3; o.buy.section = "Best guesses"; }
    } else o.pantry = true;
    return o;
  });
  return r;
}

async function generate() {
  if (!sample || !swapTarget) return;
  const meal = mealById(swapTarget);
  const btn = $("#gen-btn");
  btn.disabled = true;
  $("#gen-state").innerHTML = `<div class="genstate">Asking Claude for something new… this takes a few seconds.</div>`;
  try {
    const raw = await sample.json(generatePrompt(meal), { modelTier: "default" });
    const r = sanitise(raw, meal.slot);
    const slug = "new-" + r.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) + "-" + Date.now().toString(36).slice(-4);
    extra[slug] = r;
    $("#sheet").close();
    setPick(swapTarget, slug);
  } catch (e) {
    const code = e && e.code ? e.code : "failed";
    $("#gen-state").innerHTML = `<div class="genstate err">${esc(
      code === "not_granted" ? "Claude isn't available on this view — pick from the list instead."
      : code === "rate_limited" ? "Too many requests just now. Try again in a minute."
      : "That didn't come back usable. Try again, or pick from the list.")}</div>`;
  } finally {
    btn.disabled = false;
  }
}

    `${d} dinners and ${l} lunches. Swap a dish you don't fancy, or tell the Shopping tab what you already have — the basket follows both. No chilli anywhere.`;
  $("#tally").innerHTML = [
    ["Meals", plan.meals.length],
    ["Library", Object.keys(all()).length],
    ["To buy", eur(total)],
    ["Already here", eur(saved)],
    ["Ceiling", eur(CONF.budgetCeiling)],
    // One element per pair, or the flex row wraps a label away from its number.
  ].map(([k, v]) => `<span class="tally-pair"><span>${k}</span>&nbsp;<b>${v}</b></span>`).join("");
  $("#foot").innerHTML =
    `${Object.keys(all()).length} dishes, ${Object.keys(PRICES).length} products priced from a year of your own receipts. ` +
    `Estimates, not quotes.<br>Product names are the exact Intermarché ones, so each resolves to a single search result at the Drive.`;
}

/* ---------- wiring ---------- */
function segment(sel, onchange) {
  $(sel).addEventListener("click", (e) => {
    const b = e.target.closest("button[data-v]");
    if (!b) return;
    $$("button", $(sel)).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    onchange(b.dataset.v);
  });
}
segment("#orderby", (v) => { state.order = v; renderWeek(); });
segment("#slotfilter", (v) => { state.slot = v; renderWeek(); });
segment("#rslot", (v) => { rstate.slot = v; renderRecipes(); });

$("#timemax").addEventListener("input", (e) => {
  state.maxTime = +e.target.value;
  $("#timeval").textContent = state.maxTime >= 60 ? "any" : "≤ " + state.maxTime + " min";
  renderWeek();
});
$("#ingchips").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-ing]"); if (!b) return;
  const v = b.dataset.ing;
  state.ings.has(v) ? state.ings.delete(v) : state.ings.add(v);
  b.setAttribute("aria-pressed", String(state.ings.has(v)));
  renderWeek();
});
$("#rcuisine").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-cuisine]"); if (!b) return;
  const v = b.dataset.cuisine;
  rstate.cuisines.has(v) ? rstate.cuisines.delete(v) : rstate.cuisines.add(v);
  b.setAttribute("aria-pressed", String(rstate.cuisines.has(v)));
  renderRecipes();
});
$("#rsearch").addEventListener("input", (e) => { rstate.q = e.target.value; renderRecipes(); });

$("#week-clear").addEventListener("click", () => {
  state.slot = "all"; state.maxTime = 60; state.ings.clear();
  $$("#slotfilter button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === "all")));
  $("#timemax").value = 60; $("#timeval").textContent = "any";
  renderIngChips(); renderWeek();
});
$("#rec-clear").addEventListener("click", () => {
  rstate.q = ""; rstate.slot = "all"; rstate.cuisines.clear();
  $("#rsearch").value = "";
  $$("#rslot button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === "all")));
  renderCuisineChips(); renderRecipes();
});

$("#shuffle").addEventListener("click", () => {
  const lib = all();
  const used = new Set();
  for (const m of plan.meals) {
    const opts = Object.entries(lib).filter(([s, r]) => r.slot === m.slot && !used.has(s));
    if (!opts.length) continue;
    const [slug] = opts[Math.floor(Math.random() * opts.length)];
    picks[m.id] = slug;
    used.add(slug);
  }
  renderAll(); persist();
});
$("#resetweek").addEventListener("click", () => { picks = { ...baseline }; renderAll(); persist(); });

document.addEventListener("click", (e) => {
  const sw = e.target.closest("button[data-swap]");
  if (sw) return openSwap(sw.dataset.swap);
  const alt = e.target.closest("button[data-pick]");
  if (alt) { $("#sheet").close(); return setPick(swapTarget, alt.dataset.pick); }

  // the ingredient layer
  const step = e.target.closest("button[data-have]");
  if (step) return bumpHave(step.dataset.have, Number(step.dataset.dir));
  const allof = e.target.closest("button[data-allof]");
  if (allof) return toggleAllOf(allof.dataset.allof);
  const strike = e.target.closest("button[data-strike]");
  if (strike) return toggleStrike(strike.dataset.strike);
  const subsw = e.target.closest("button[data-subswap]");
  if (subsw) return openProductSwap(subsw.dataset.subswap);
  const pp = e.target.closest("button[data-pick-product]");
  if (pp) {
    const name = pp.dataset.pickProduct;
    if (name === productTarget) delete subs[productTarget]; else subs[productTarget] = name;
    $("#sheet").close();
    return commitShop();
  }
  const ap = e.target.closest("button[data-add-product]");
  if (ap) { $("#sheet").close(); return addProduct(ap.dataset.addProduct); }
  if (e.target.closest("#additem")) return openAddItem();
  if (e.target.closest("#resetshop")) return resetShop();

  const btn = e.target.closest(".expand");
  if (!btn) return;
  const c = btn.closest(".card");
  const open = c.classList.toggle("open");
  btn.setAttribute("aria-expanded", String(open));
  btn.querySelector(".caret").textContent = open ? "▴" : "▾";
});

$("#gen-btn").addEventListener("click", generate);
$("#sheet-close").addEventListener("click", () => $("#sheet").close());
$("#sheet-restore").addEventListener("click", () => {
  $("#sheet").close();
  if (sheetMode === "product") { delete subs[productTarget]; return commitShop(); }
  setPick(swapTarget, baseline[swapTarget]);
});
$("#sheet-search").addEventListener("input", renderProductAlts);

const PANELS = { "tab-week": "panel-week", "tab-recipes": "panel-recipes", "tab-shop": "panel-shop" };
$$(".tab").forEach((t) => t.addEventListener("click", () => {
  $$(".tab").forEach((x) => {
    const on = x === t;
    x.setAttribute("aria-selected", String(on));
    $("#" + PANELS[x.id]).hidden = !on;
  });
  window.scrollTo({ top: 0, behavior: "instant" });
}));

setSync("", "Checking for your partner's changes…");
renderAll();
</script>
