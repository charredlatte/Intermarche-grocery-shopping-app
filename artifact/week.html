   packs state the same kind of measure — a receipt cut off mid-word ("la
   plaquette de 5...") says nothing and converts nothing. */
function packRatio(receiptPack, sitePack) {
  if (!receiptPack || !sitePack || /\.\.\.$|…$/.test(receiptPack)) return 1;
  const r = packMeasure(receiptPack), s = packMeasure(sitePack);
  return r && s && r.kind === s.kind && s.qty > 0 ? r.qty / s.qty : 1;
}

/* ---------- the basket, derived from whatever is on the menu ---------- */
function basket() {
  const acc = new Map();
  // A batch dish is cooked once and eaten three times. Counting its ingredients
  // per serving bought six tins of coconut milk for one pot, so a meal flagged
  // as leftovers eats from a pot already paid for and buys nothing. A dish
  // genuinely cooked twice in a week is not flagged, and does count twice.
  const cooked = meals().filter((m) => !m.leftovers);
  for (const m of cooked) {
    for (const i of m.r.ingredients || []) {
      if (!i.buy) continue;
      let e = acc.get(i.product);
      if (!e) acc.set(i.product, (e = {
        product: i.product, amount: 0, mode: i.buy.mode, section: i.buy.section,
        guess: !!i.guess, guessPrice: i.buy.price, dishes: new Set(),
      }));
      // "sum" adds up across dishes (produce, meat); "once" is a bottle or a bag
      // that covers the week however many dishes reach for it.
      e.amount = e.mode === "sum" ? e.amount + i.buy.amount : Math.max(e.amount, i.buy.amount);
      e.dishes.add(m.r.title);
    }
  }

  // Everything the week asks for, before a word about what is in the kitchen.
  const wanted = [];
  for (const e of acc.values()) {
    wanted.push({ key: e.product, section: e.section, guess: e.guess,
                  guessPrice: e.guessPrice, required: e.amount,
                  for: [...e.dishes].join(", "), kind: "dish" });
  }
  for (const s of STAPLES) {
    wanted.push({ key: s.name, section: "Standing order", guess: !!s.guess,
                  guessPrice: s.price, required: s.quantity,
                  for: s.note || "always on the order", kind: "staple" });
  }
  for (const [key, a] of Object.entries(added)) {
    wanted.push({ key, section: "Added by you", guess: !PRICES[a.name],
                  guessPrice: 3, required: a.qty, name: a.name,
                  for: "you added this", kind: "added" });
  }

  const order = ["Proteins", "Vegetables", "Store cupboard", "Bread and cheese",
                 "Standing order", "New to you", "Best guesses", "Added by you"];
  wanted.sort((a, b) => (order.indexOf(a.section) - order.indexOf(b.section)) ||
                        a.key.localeCompare(b.key));

  // Now the kitchen. One pool, drawn down in list order, so the same half-kilo
  // of chicken cannot be counted against two different dinners.
  const p = pool();
  const lines = [];
  for (const w of wanted) {
    const name = w.name || subs[w.key] || w.key;
    const pb = PRICES[name];
    const cat = CATALOGUE[name] || null;

    // Which Méré listing this line will be pushed as. Anything the site sells
    // under another name or pack, or not at all, has no listing until she picks
    // one here — that decision is never made for her.
    const needsDecision = !!cat && (cat.status === "check" || cat.status === "missing");
    const choice = needsDecision ? choices[w.key] || null : null;
    const skipped = !!choice && choice.pick === "skip";
    const site = choice
      ? (skipped ? null : choice.pick === "listing" ? cat.listing : (cat.alternatives || [])[choice.pick] || null)
      : cat && cat.status !== "missing" ? cat.listing : null;
    const pending = needsDecision && !choice;
    const sitePrice = site && site.price != null ? site.price : null;

    const guess = (w.guess || !pb) && !site;
    const unit = guess || !pb ? "unit" : pb.unit;
    const receiptPrice = guess ? (w.guessPrice ?? 3) : pb ? pb.price : (w.guessPrice ?? 3);
    const section = w.section === "Best guesses" && !guess ? "New to you" : w.section;

    let required = qtyAdj[w.key] != null ? qtyAdj[w.key] : w.required;
    if (unit !== "kg") required = Math.max(1, Math.ceil(required));  // you cannot buy 1.4 jars

    const struck = !!dropped[w.key] || skipped;
    const { got, from } = struck ? { got: 0, from: [] } : draw(p, name, required);
    let toBuy = Math.max(0, required - got);
    if (unit !== "kg") toBuy = Math.ceil(toBuy - 1e-9);
    if (struck) toBuy = 0;

    const fmt = (n) => unit === "kg" ? n.toFixed(2).replace(".", ",") + " kg" : "x" + Math.round(n);
    // The Drive sells weighed goods by the piece or the tray, so a kilo figure
    // becomes a count of what to add. A pack with no weight on it counts as one.
    // She can change the count; that count is what gets pushed.
    // A pack that changed size is converted, so a smaller pack means more of them.
    const pk = unit === "kg" && site ? packKg(site.packaging) : null;
    const ratio = unit !== "kg" && site && pb ? packRatio(pb.pack, site.packaging) : 1;
    const addDefault = toBuy <= 0 ? 0
      : unit === "kg" ? Math.max(1, Math.round(toBuy / (pk || toBuy)))
      : Math.max(1, Math.ceil(toBuy * ratio - 0.1));
    const add = toBuy > 0 && addAdj[w.key] != null ? addAdj[w.key] : addDefault;

    // Priced the way Méré charges it — the listing's price per pack, times the
    // packs added. Only a line with no listing falls back to the receipt. Weighed
    // goods are charged on the exact weight at collection, so they stay approximate.
    const weighed = unit === "kg" || (!!site && /vrac|environ|à la coupe/i.test(site.packaging));
    const cost = toBuy <= 0 ? 0 : sitePrice != null ? sitePrice * add : receiptPrice * toBuy;
    const unitValue = unit === "kg" ? receiptPrice : (sitePrice ?? receiptPrice);
    const covered = Math.min(got, required);
    lines.push({
      key: w.key, name, section, kind: w.kind, guess, cat, site, choice, pending, skipped,
      replaces: ratio !== 1 ? pb.pack : null,
      add, addDefault, unit, price: sitePrice ?? receiptPrice, priced: sitePrice != null ? "site" : guess ? "guess" : "receipt",
      approx: sitePrice == null || weighed,
      required, covered, toBuy, struck,
      renamed: name !== w.key ? w.key : null,
      coveredBy: from, for: w.for,
      cost, coveredValue: struck ? 0 : unitValue * covered,
      amount: fmt(toBuy), requiredLabel: fmt(required), coveredLabel: fmt(covered),
    });
  }

  // Re-sorted because a guess the site has named only changes section here.
  lines.sort((a, b) => (order.indexOf(a.section) - order.indexOf(b.section)) || a.key.localeCompare(b.key));
  const buy = lines.filter((l) => l.toBuy > 0);
  const kitchen = lines.filter((l) => l.toBuy <= 0);
  return {
    lines: buy, kitchen,
    pending: buy.filter((l) => l.pending),
    total: buy.reduce((t, l) => t + l.cost, 0),
    saved: lines.reduce((t, l) => t + l.coveredValue, 0),
  };
}

/* ---------- shared state ---------- */
function setSync(kind, text) {
  const d = $("#sync-dot");
  d.className = "dot" + (kind === "live" ? " live" : kind === "off" ? " off" : "");
  $("#sync-text").textContent = text;
}

async function persist() {
  if (!weekRef) return;
  const diff = {};
  for (const k of changed()) diff[k] = picks[k];
  // Only the corrections travel, not the whole kitchen. A quantity she never
  // touched stays whatever the newest receipt says, so a fresh receipt is not
  // overwritten by a stale copy of the old one sitting in the document.
  const haveDiff = {};
  for (const k of new Set([...Object.keys(have), ...Object.keys(haveSeed)])) {
    if ((have[k] || 0) !== (haveSeed[k] || 0)) haveDiff[k] = have[k] || 0;
  }
  try {
    await weekRef.set({
      picks: diff, extra, have: haveDiff, qtyAdj, subs, dropped, added, addAdj, choices,
      approved, inBasket,
      seededFrom: ONHAND.from ? ONHAND.from.order : null,
      updatedAt: Date.now(),
    });
  } catch (e) {
    setSync("off", "Change saved on this phone only — " + (e && e.code ? e.code : "not saved"));
  }
}

function applyRemote(d) {
  if (!d) return;
  extra = { ...extra, ...(d.extra || {}) };
  picks = { ...baseline, ...(d.picks || {}) };
  // A document written against an older receipt keeps its hand corrections, but
  // the receipt underneath it is the new one.
  have = { ...haveSeed, ...(d.have || {}) };
  qtyAdj = d.qtyAdj || {};
  subs = d.subs || {};
  dropped = d.dropped || {};
  added = d.added || {};
  addAdj = d.addAdj || {};
  choices = d.choices || {};
  approved = d.approved || null;
  inBasket = d.inBasket || {};
  renderAll();
}

(async () => {
  // Never available on the first synchronous run — render first, light up after.
  if (!(window.claude && typeof window.claude.use === "function")) {
    return setSync("off", "Preview — changes are not shared");
  }
  db = await claude.use("db");
  if (!db) return setSync("off", "Changes stay on this phone");
  weekRef = db.doc("weeks/" + plan.weekOf);
  favRef = db.doc("library/favourites");
  favRef.onSnapshot(
    (snap) => { favs = new Set((snap.data() || {}).slugs || []); renderAll(); },
    () => { /* the week's own sync line already reports a failure */ },
  );
  weekRef.onSnapshot(
    (snap) => { applyRemote(snap.data()); setSync("live", "Shared — you and your partner see the same week"); },
    (err) => setSync("off", "Sync stopped (" + err.code + ") — changes stay on this phone"),
  );
  // Its own document, so Claude's progress writes and her list edits can never
  // overwrite each other.
  pushRef = db.doc("push/" + plan.weekOf);
  pushRef.onSnapshot(
    (snap) => { push = snap.exists ? snap.data() : null; renderAll(); },
    (err) => { pushError = err.code || "unavailable"; renderAll(); },
  );
  db.collection("push/" + plan.weekOf + "/progress").onSnapshot(
    (qs) => { progress = qs.docs.map((d) => d.data()); renderAll(); },
    (err) => { pushError = err.code || "unavailable"; renderAll(); },
  );
  setSync("live", "Shared — you and your partner see the same week");
})();

(async () => {
  if (!(window.claude && typeof window.claude.use === "function")) return;
  sample = await claude.use("sample");
  if (sample) $("#gen-open").hidden = false;
})();

/* ---------- cards ---------- */
/* Which appliance a dish needs. She has an air fryer, an oven, muffin tins and
   casserole dishes, so the library says which of them each dish wants. */
const KIT_ICON = {
  "air fryer": "◉", "oven": "▣", "muffin tin": "⁘",
  "casserole dish": "▭", "hob": "◍", "blender": "▽",
};

const tagClass = (t) =>
  t === "batch cook" ? " is-batch"
  : t === "fast" || t === "make ahead" || t === "no cook" ? " is-fast"
  : t === "from the freezer" ? " is-pack" : "";

function ingredientList(r) {
  return `<p class="sub">Ingredients &middot; serves ${r.serves}</p>
    <ul class="ing">${(r.ingredients || []).map((i) => `
      <li><div class="ing-row">
        <span class="ing-name">${esc(cap(i.item))}${i.guess && !(CATALOGUE[i.product] && CATALOGUE[i.product].listing) ? '<span class="flag">guess</span>' : ""}${i.pantry ? '<span class="flag pantry">have it</span>' : ""}</span>
        <span class="leader"></span><span class="ing-qty">${esc(i.qty)}</span>
      </div><div class="ing-product">${esc(i.product)}</div></li>`).join("")}</ul>`;
}

function card(o) {
  const r = o.r;
  const isPack = r.kind === "assembly";
  return `<article class="card${o.slot === "dinner" ? "" : " is-lunch"}" data-card="${esc(o.key)}">
    <div class="card-top">
      <span class="card-day">${esc(o.day ? cap(o.day) : cap(r.cuisine))}</span>
      <span class="card-slot">${esc(o.slot)}</span>
      ${o.isSwapped ? '<span class="swapped">swapped</span>' : ""}
      <span class="leader"></span>
      <span class="card-time">${o.minutes} min</span>
      <button class="fav" type="button" data-fav="${esc(o.slug)}"
              aria-pressed="${isFav(o.slug)}"
              aria-label="${isFav(o.slug) ? "Remove" : "Add"} ${esc(r.title)} ${isFav(o.slug) ? "from" : "to"} favourites"
              title="${isFav(o.slug) ? "One of your favourites" : "Save to favourites"}">${isFav(o.slug) ? "★" : "☆"}</button>
    </div>
    <div class="card-body">
      <h3>${esc(r.title)}</h3>
      <div class="card-meta">${esc(cap(r.cuisine))}${r.protein ? " &middot; " + esc(cap(r.protein)) : ""} &middot; serves ${r.serves} &middot; ${r.prepMinutes} prep + ${r.cookMinutes} cook</div>
      ${(r.equipment || []).length ? `<div class="kit">${(r.equipment).map((e) => `<span class="kit-item">${KIT_ICON[e] || ""} ${esc(e)}</span>`).join("")}</div>` : ""}
      ${o.leftovers ? '<div class="tags"><span class="tag is-batch">from an earlier pot &middot; nothing to buy</span></div>' : ""}
      ${o.note ? `<p class="card-note">${esc(o.note)}</p>` : ""}
      ${isPack ? `<p class="packnote">${esc(r.packNote)}</p>` : ""}
      <p class="card-short">${esc(r.short)}</p>
      <div class="tags">${(r.tags || []).map((t) => `<span class="tag${tagClass(t)}">${esc(t)}</span>`).join("")}</div>
      ${o.served ? `<div class="served">Served: ${esc(o.served)}</div>` : ""}
      <div class="card-actions">
        <button class="expand" type="button" aria-expanded="false">
          <span>${isPack ? "What you actually cook" : "Ingredients &amp; method"}</span><span class="caret">▾</span>
        </button>
        ${o.assign ? `<button class="btn swapbtn" type="button" data-assign="${esc(o.slug)}">Cook this on&hellip;</button>` : ""}
      </div>
      <div class="drawer"><div><div class="drawer-inner">
        ${ingredientList(r)}
        <p class="sub">${isPack ? "The part you cook" : "Method"}</p>
        <ol class="steps">${(r.steps || []).map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
      </div></div></div>
    </div>
  </article>`;
}

const groupBlock = (title, count, inner) =>
  `<div class="group-head"><h2>${esc(title)}</h2><span class="leader"></span><span class="group-count">${count}</span></div>
   <div class="cards">${inner}</div>`;

/* ---------- week tab ----------
   A plain view of the week and nothing else: seven days, each meal in the order
   it is eaten. The controls that used to sit above it — order by, slot filter,
   time slider, ingredient chips, shuffle — are gone by Charlotte's decision on
   2026-09-15. Changing what is on the menu happens on the Recipes tab now, so a
   week card carries no Swap button; it keeps the star and the drawer. */
function renderWeek() {
  const list = meals();
  if (!list.length) {
    $("#week-out").innerHTML = `<div class="empty">No meals in this week's plan yet.</div>`;
    return;
  }

  let html = "";
  for (const d of DAYS) {
    const g = list.filter((m) => m.day === d)
                  .sort((a, b) => SLOT_ORDER.indexOf(a.slot) - SLOT_ORDER.indexOf(b.slot));
    if (!g.length) continue;
    html += groupBlock(cap(d), g.length + (g.length > 1 ? " meals" : " meal"), g.map((m) => card({
      key: m.id, slug: picks[m.id], r: m.r, slot: m.slot, minutes: m.minutes,
      note: m.note, isSwapped: m.isSwapped, leftovers: m.leftovers, day: null,
    })).join(""));
  }
  // The undo lives under the week rather than over it — it is not a filter, and
  // nothing should sit between her and Sunday.
  if (changed().length) {
    html += `<div class="weekfoot"><button class="btn" id="resetweek">Back to the planned week</button></div>`;
  }
  $("#week-out").innerHTML = html;
}

/* ---------- recipes tab ----------
   The library, grouped the way she thinks about it: by what protein is in the
   dish, or by cuisine. This is also the only place the week changes — every
   card can be dropped onto a day. */
const rstate = { q: "", slot: "all", kit: new Set(), favsOnly: false, groupBy: "protein" };

/* Shipped from build-week so the page and the library cannot disagree about
   either the spelling or the order. */
const PROTEINS = CONF.proteins || ["chicken", "turkey", "pork", "charcuterie", "beef", "fish", "eggs", "vegetarian"];

function renderRecipeChips() {
  const ks = [...new Set(Object.values(all()).flatMap((r) => r.equipment || []))].sort();
  $("#rkit").innerHTML = ks.map((k) =>
    `<button class="chip" type="button" data-kit="${esc(k)}" aria-pressed="${rstate.kit.has(k)}">${KIT_ICON[k] || ""} ${esc(cap(k))}</button>`).join("");
  const fo = $("#favonly");
  fo.setAttribute("aria-pressed", String(rstate.favsOnly));
  fo.textContent = (rstate.favsOnly ? "★" : "☆") + ` Favourites only${favs.size ? " (" + favs.size + ")" : ""}`;
}

function renderRecipes() {
  const lib = all();
  const servedIn = {};
  for (const p of DATA.plans) for (const m of p.meals) (servedIn[m.recipe] ??= []).push(p.label || p.weekOf);
  for (const [id, slug] of Object.entries(picks)) {
    if (slug !== baseline[id]) (servedIn[slug] ??= []).push(plan.label || plan.weekOf);
  }

  const q = rstate.q.trim().toLowerCase();
  const list = Object.entries(lib).filter(([slug, r]) =>
    (rstate.slot === "all" || r.slot === rstate.slot) &&
    (!rstate.favsOnly || favs.has(slug)) &&
    // any ticked appliance, not all of them. Ticking the air fryer and the
    // muffin tin means "show me either", not "needs both".
    (rstate.kit.size === 0 || [...rstate.kit].some((k) => (r.equipment || []).includes(k))) &&
    (!q || (r.title + " " + r.short + " " + r.cuisine + " " + (r.protein || "") + " " + (r.tags || []).join(" ") + " " +
            (r.ingredients || []).map((i) => i.item + " " + i.product).join(" ") + " " +
            (r.steps || []).join(" ")).toLowerCase().includes(q)))
    .sort((a, b) => (favs.has(b[0]) - favs.has(a[0])) || a[1].title.localeCompare(b[1].title));

  const total = Object.keys(lib).length;
  const filtered = !!q || rstate.slot !== "all" || rstate.kit.size > 0 || rstate.favsOnly;
  $("#rec-count").textContent = filtered ? `${list.length} of ${total} dishes` : `${total} dishes in the library`;
  $("#rec-clear").hidden = !filtered;

  if (!list.length) {
    $("#rec-out").innerHTML = `<div class="empty">${rstate.favsOnly && !favs.size
      ? "No favourites yet — tap the star on any dish to keep it here."
      : "No dish matches that yet. The library grows every week."}</div>`;
    return;
  }

  const asCard = ([k, r]) => {
    const uniq = [...new Set(servedIn[k] || [])];
    return card({ key: "r-" + k, slug: k, r, day: null, slot: r.slot, assign: true,
                  minutes: r.prepMinutes + r.cookMinutes,
                  served: uniq.length ? uniq.join(", ") : null });
  };

  // A dish the generator invented has no protein of its own; it groups under
  // whatever sanitise() worked out, and falls back rather than vanishing.
  const keyOf = (r) => rstate.groupBy === "cuisine" ? r.cuisine : (r.protein || "vegetarian");
  const order = rstate.groupBy === "cuisine"
    ? [...new Set(Object.values(lib).map((r) => r.cuisine))].sort()
    : PROTEINS;
  const seen = new Set(order);

  let html = "";
  for (const g of [...order, ...[...new Set(list.map(([, r]) => keyOf(r)))].filter((g) => !seen.has(g))]) {
    const inGroup = list.filter(([, r]) => keyOf(r) === g);
    if (!inGroup.length) continue;
    html += groupBlock(cap(g), inGroup.length, inGroup.map(asCard).join(""));
  }
  $("#rec-out").innerHTML = html;
}

  // anything a newly generated dish invents
  _default: { tint: "is-quiet", svg: ico(
    `<path d="M5.6 8.6h12.8l.9 10.6a2 2 0 0 1-2 2.2H6.7a2 2 0 0 1-2-2.2l.9-10.6Z"/>
     <path d="M9 8.6V7a3 3 0 0 1 6 0v1.6"/>`) },
};

const sectionIcon = (name) => {
  const i = SECTION_ICONS[name] || SECTION_ICONS._default;
  return `<span class="sec-icon${i.tint ? " " + i.tint : ""}" aria-hidden="true">${i.svg}</span>`;
};

/* The receipt date, for the line that explains where "already here" came from. */
const onHandDate = () => {
  const f = ONHAND.from;
  if (!f) return "";
  const d = new Date(Date.UTC(f.date.year, f.date.month - 1, f.date.day));
  return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
};

const andList = (xs) => xs.length < 2 ? (xs[0] || "") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];

/* Why a line is not being bought, in her words rather than the model's. */
function coverReason(l) {
  if (l.skipped) return "skipped — Méré doesn't sell it as named";
  if (l.struck) return "you struck this off";
  const exact = l.coveredBy.some((c) => c.exact);
  const others = l.coveredBy.filter((c) => !c.exact).map((c) => c.product);
  const bits = [];
  if (exact) bits.push("already here");
  // The whole point of the equivalents file: say which product stood in.
  if (others.length) bits.push("covered by " + andList(others));
  return bits.join(", ") || "already here";
}

/* What the Drive site had to say about a product, the last time anyone looked. */
const checkedOn = (iso) => new Date(iso + "T12:00:00Z")
  .toLocaleDateString("en-GB", { day: "numeric", month: "long", timeZone: "UTC" });
const siteHref = (listing) => SITE + encodeURI(decodeURI(listing.url));
// Méré's produce titles carry an EU grading suffix ("- CAT. 1") that says nothing here.
const cleanTitle = (t) => String(t).replace(/\s*-\s*CAT\.\s*(?:\d|EXTRA)\s*$/i, "");
const listingName = (listing) => listing.brand.replace(/, une marque Intermarché$/, "") + " · " + cleanTitle(listing.title);

function siteFlag(cat) {
  if (!cat) return { cls: "", text: "not checked at Méré" };
  if (cat.status === "missing") return { cls: "warn", text: "not at Méré" };
  if (cat.listing && cat.listing.available === false) return { cls: "warn", text: "out of stock " + checkedOn(cat.checked) };
  if (cat.status === "check") return { cls: "", text: "check at Méré" };
  return null;
}
const flagHtml = (f) => f ? `<span class="flag${f.cls ? " " + f.cls : ""}">${esc(f.text)}</span>` : "";

const round2 = (n) => Math.round(n * 100) / 100;
const money = (l) => (l.approx ? "≈ " : "") + eur(l.cost);

/* What a line still needs before it can be pushed, or what it is known to be. */
function lineFlag(l) {
  if (l.pending) return { cls: "warn", text: l.cat.status === "missing" ? "not at Méré" : "changed at Méré" };
  if (l.site && l.site.available === false) return { cls: "warn", text: "out of stock " + checkedOn(l.cat.checked) };
  if (l.choice) return { cls: "ok", text: "your pick" };
  if (!l.cat) return { cls: "", text: l.guess ? "guess — Claude asks at push" : "not checked — Claude asks at push" };
  return null;
}

function decisionBlock(l) {
  const c = l.cat;
  const opts = [];
  if (c.status === "check" && c.listing) opts.push({ pick: "listing", li: c.listing });
  (c.alternatives || []).forEach((a, i) => opts.push({ pick: i, li: a }));
  return `<div class="decide">
      ${c.note ? `<p class="decide-note">${esc(c.note)}</p>` : ""}
      <div class="decide-opts" role="group" aria-label="What to buy for ${esc(l.name)}">
        ${opts.map((o) => {
          const out = o.li.available === false || o.li.price == null;
          return `<button class="opt" type="button" data-choice="${esc(l.key)}" data-option="${o.pick}">
            <span class="opt-name">${esc(listingName(o.li))}</span>
            <span class="opt-meta">${esc(o.li.packaging)} · ${out ? "out of stock " + esc(checkedOn(c.checked)) : eur(o.li.price)}</span>
          </button>`;
        }).join("")}
        <button class="opt opt-skip" type="button" data-choice="${esc(l.key)}" data-option="skip">
          <span class="opt-name">Skip it this week</span>
          <span class="opt-meta">nothing bought</span>
        </button>
      </div>
    </div>`;
}

function addStepper(l) {
  return `<span class="step" role="group" aria-label="How many to add at Méré">
      <button class="stepbtn" type="button" data-addstep="${esc(l.key)}" data-dir="-1" aria-label="One fewer"${l.add <= 1 ? " disabled" : ""}>−</button>
      <span class="stepval">${l.add}</span>
      <button class="stepbtn" type="button" data-addstep="${esc(l.key)}" data-dir="1" aria-label="One more">+</button>
    </span>`;
}

/* One line of the basket as it will be pushed: Méré's own name and pack first,
   because that is what lands in the real basket; the recipe's name underneath. */
function basketLine(l) {
  // Undecided, a line keeps the recipe's name: showing Méré's proposal as its
  // title would read as a choice already made.
  const li = l.pending ? null : l.site;
  const title = li ? listingName(li) : l.name;
  const meta = [];
  if (li) meta.push(esc(li.packaging) + (li.price != null ? " · " + eur(li.price) + " each" : ""));
  if (li && !l.name.toLowerCase().includes(li.title.toLowerCase())) meta.push("for " + esc(l.name));
  if (l.renamed) meta.push("instead of " + esc(l.renamed));
  if (l.replaces) meta.push(`for the recipes' ${l.toBuy} × ${esc(l.replaces.toLowerCase())}`);
  if (l.unit === "kg") meta.push("recipes need " + esc(l.amount));
  if (l.covered > 0) meta.push(esc(l.coveredLabel) + " " + esc(coverReason(l)));
  const dishes = `<div class="bl-for">${esc(l.for)}</div>`;

  return `<li class="bl${l.pending ? " is-pending" : ""}" id="line-${esc(l.key.replace(/[^\w-]/g, "_"))}">
      <div class="bl-row">
        <div class="bl-main">
          <div class="bl-name">${esc(title)}${flagHtml(lineFlag(l))}</div>
          ${meta.length ? `<div class="bl-meta">${meta.map((m) => `<span>${m}</span>`).join("")}</div>` : ""}
          ${dishes}
        </div>
        <div class="bl-cost">${money(l)}</div>
      </div>
      ${l.pending ? decisionBlock(l) : `<div class="line-ctl">
          ${addStepper(l)}
          <button class="minibtn" type="button" data-allof="${esc(l.key)}">I have it</button>
          ${l.choice ? `<button class="minibtn" type="button" data-unchoose="${esc(l.key)}">Choose again</button>` : ""}
          ${l.kind === "added" ? "" : `<button class="minibtn" type="button" data-subswap="${esc(l.key)}">Swap</button>`}
          <button class="minibtn danger" type="button" data-strike="${esc(l.key)}" aria-label="Strike ${esc(title)} off the list">✕</button>
        </div>`}
    </li>`;
}

function kitchenLine(l) {
  const action = l.skipped
    ? `<button class="minibtn" type="button" data-unchoose="${esc(l.key)}">Choose again</button>`
    : l.struck
      ? `<button class="minibtn" type="button" data-strike="${esc(l.key)}">Put it back</button>`
      : `<button class="minibtn" type="button" data-allof="${esc(l.key)}">Need it after all</button>`;
  return `<li class="bl is-kitchen">
      <div class="bl-row">
        <div class="bl-main">
          <div class="bl-name">${esc(l.name)}</div>
          <div class="bl-meta"><span>${esc(l.requiredLabel)} needed</span><span>${esc(coverReason(l))}</span></div>
        </div>
        <div class="bl-cost">—</div>
      </div>
      <div class="line-ctl">${action}</div>
    </li>`;
}

const groupBySection = (lines) => {
  const secs = [];
  for (const l of lines) {
    let s = secs.find((x) => x.name === l.section);
    if (!s) secs.push((s = { name: l.section, lines: [] }));
    s.lines.push(l);
  }
  return secs;
};

function renderShop() {
  if (approved) return renderApproved();
  const { lines, kitchen, pending, total, saved } = basket();
  const ceiling = CONF.budgetCeiling;
  const over = total > ceiling;
  const ready = lines.filter((l) => !l.pending);
  const approxCount = lines.filter((l) => l.approx).length;
  const asks = lines.filter((l) => !l.cat).length;

  let html = `<section class="hero">
      <div class="hero-top">
        <div>
          <div class="eyebrow">To add at ${esc(CONF.store || "the Drive")}</div>
          <div class="hero-total">${eur(total)}</div>
          <div class="hero-sub">${lines.length} ${lines.length === 1 ? "line" : "lines"} · ${over ? `<b class="over">${eur(total - ceiling)} over</b> your ${eur(ceiling)} ceiling` : `${eur(ceiling - total)} under your ${eur(ceiling)} ceiling`}</div>
        </div>
        <div class="hero-state${pending.length ? " is-warn" : " is-ok"}">
          <b>${pending.length ? pending.length : "✓"}</b>
          <span>${pending.length ? (pending.length === 1 ? "decision left" : "decisions left") : "ready to approve"}</span>
        </div>
      </div>
      <div class="meter"><div class="meter-bar"><div class="meter-fill${over ? " over" : ""}" style="width:${Math.min(100, (total / ceiling) * 100).toFixed(1)}%"></div></div></div>
      <p class="hero-note">Priced at Méré's current prices${approxCount ? `; ${approxCount} weighed or unpriced ${approxCount === 1 ? "line is" : "lines are"} approximate (≈)` : ""}.
        ${saved > 0.005 ? `${eur(saved)} of the week is already in the kitchen and off the list.` : ""}
        ${asks ? `${asks} ${asks === 1 ? "line has" : "lines have"} not been checked at Méré, so Claude will ask about ${asks === 1 ? "it" : "them"} during the push.` : ""}</p>
      <div class="toolbar">
        <button class="btn" id="additem">Add something</button>
        <button class="btn" id="resetshop"${shopEdited() ? "" : " hidden"}>Undo my changes</button>
      </div>
    </section>`;

  if (pending.length) {
    html += `<div class="shop-sec decide-sec">
        <div class="group-head has-icon" style="margin:0"><span class="sec-icon is-clay" aria-hidden="true">!</span><h2>Decide first</h2><span class="leader"></span><span class="group-count">${pending.length}</span></div>
        <p class="decide-lede">Méré sells these under another name or pack, or not at all. Pick what to buy — nothing is swapped without you.</p>
        <ul class="bl-list">${pending.map(basketLine).join("")}</ul>
      </div>`;
  }

  for (const s of groupBySection(ready)) {
    html += `<div class="shop-sec">
        <div class="group-head has-icon" style="margin:0">${sectionIcon(s.name)}<h2>${esc(s.name)}</h2><span class="leader"></span><span class="group-count">${eur(s.lines.reduce((a, b) => a + b.cost, 0))}</span></div>
        <ul class="bl-list">${s.lines.map(basketLine).join("")}</ul>
      </div>`;
  }
  if (!lines.length) {
    html += `<div class="empty" style="margin-top:1.2rem">Nothing left to buy — the kitchen already covers every dish on the menu.</div>`;
  }
  html += `<div class="shop-total"><span>Estimated total</span><span>${eur(total)}</span></div>`;

  if (kitchen.length) {
    html += `<details class="chipbox kitchenbox">
        <summary>Not buying — ${kitchen.length} ${kitchen.length === 1 ? "item" : "items"} already here, struck off or skipped</summary>
        <div class="kitchen-body">
          <p class="kitchen-note">What is already here comes from the Drive order collected ${esc(onHandDate())}, plus anything you have corrected by hand.</p>
          <ul class="bl-list">${kitchen.map(kitchenLine).join("")}</ul>
        </div>
      </details>`;
  }

  html += `<div class="approvebar">
      <div>
        <div class="approve-title">${pending.length ? `Decide on ${pending.length} ${pending.length === 1 ? "line" : "lines"} first` : "Approve this basket"}</div>
        <div class="approve-sub">${pending.length
          ? "Approving locks the list for pushing, so every line has to say exactly what to buy."
          : `${lines.length} lines, ${eur(total)}${over ? `, ${eur(total - ceiling)} over the ceiling` : ""}. Approving locks it and lets you push it to your Intermarché basket.`}</div>
      </div>
      <button class="btn primary" id="approve"${lines.length && !pending.length ? "" : " disabled"}>Approve</button>
    </div>`;

  const cookCount = meals().filter((m) => !m.leftovers).length;
  html += `<div class="foot" style="margin-top:1.6rem">Built from the ${cookCount} meals actually cooked this week — ${meals().length - cookCount} more come out of an earlier pot and cost nothing extra. Follows every swap and every count you change.<br>${(plan.notes || []).map(esc).join("<br>")}</div>`;
  $("#shop-out").innerHTML = html;
}

/* ---------- approved: the push ---------- */
const PUSH_OPEN = ["requested", "running", "waiting"];
const pushOpen = () => { const s = pushState(); return !!s && PUSH_OPEN.includes(s.status); };
const logFor = (key) => { const s = pushState(); return (s && s.log[key]) || null; };
const LOG_DONE = ["added", "already", "unavailable", "skipped", "mismatch", "not-found"];

function logChip(entry) {
  if (!entry) return "";
  const t = {
    added: ["ok", `in basket ×${entry.qty ?? ""}`], already: ["ok", `in basket ×${entry.qty ?? ""}`],
    unavailable: ["warn", "out of stock"], "not-found": ["warn", "not found"],
    mismatch: ["warn", "didn't match — not added"], skipped: ["", "skipped"],
    asking: ["warn", "Claude is asking you"], adding: ["", "adding…"],
  }[entry.status] || ["", entry.status];
  return `<span class="flag ${t[0]}">${esc(t[1].trim())}</span>`;
}

function pushedRow(l) {
  const entry = logFor(l.key);
  const done = !!inBasket[l.key] || (entry && (entry.status === "added" || entry.status === "already"));
  const title = l.expect ? listingName(l.expect) : l.name;
  return `<li class="${done ? "is-done" : ""}">
      <button class="tickbox" type="button" data-tick="${esc(l.key)}" aria-pressed="${done}"
              aria-label="${done ? "Added" : "Mark added"}: ${esc(title)}">${done ? "✓" : ""}</button>
      <div class="drive-body">
        <div class="drive-name">${esc(title)}</div>
        <div class="drive-meta">
          <span class="drive-qty">add ${l.add}</span>
          ${l.expect ? `<span>${esc(l.expect.packaging)}</span>` : ""}
          <span>${l.approx ? "≈ " : ""}${eur(l.cost)}</span>
          ${entry ? logChip(entry) : l.url ? "" : `<span class="flag">Claude asks before adding</span>`}
        </div>
        ${entry && entry.note ? `<div class="drive-note">${esc(entry.note)}</div>` : ""}
      </div>
      <div class="drive-actions">
        ${l.url ? `<a class="copybtn" href="${esc(siteHref(l))}" target="_blank" rel="noopener" aria-label="Open ${esc(title)} at Méré">Open</a>` : ""}
      </div>
    </li>`;
}

function pushPanel(lines) {
  const push = pushState();
  const s = push ? push.status : null;
  const settled = lines.filter((l) => { const e = logFor(l.key); return e && LOG_DONE.includes(e.status); }).length;
  const pct = lines.length ? (settled / lines.length) * 100 : 0;
  const noDb = !pushRef;
  const cmd = `<div class="cmd"><code>${PUSH_COMMAND}</code><button class="copybtn" type="button" id="copycmd">Copy</button></div>`;
  const meter = `<div class="meter"><div class="meter-bar"><div class="meter-fill" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="meter-row"><span>${settled} of ${lines.length} done</span><span>${eur(approved.total)} estimated</span></div></div>`;

  if (s === "requested") return `<div class="pushpanel is-wait">
      <h3>Waiting for Claude on your PC</h3>
      <p>Open Claude on the PC where Chrome is signed in to Intermarché and run:</p>${cmd}
      <p class="small">It adds each line at Méré, then writes back here as it goes.</p>
      <div class="toolbar"><button class="btn" id="pushcancel">Cancel the push</button></div>
    </div>`;
  if (s === "running") return `<div class="pushpanel is-run">
      <h3>Filling your basket</h3>${meter}
      <p class="small">Claude is adding these at Méré now. Leave this open to follow along.</p>
    </div>`;
  if (s === "waiting") return `<div class="pushpanel is-warn">
      <h3>Claude needs you</h3>
      <p>${esc(push.question || "Answer in Claude on your PC to carry on.")}</p>${meter}
    </div>`;
  if (s === "done") {
    const diff = push.siteTotal != null ? push.siteTotal - approved.total : null;
    const issues = lines.filter((l) => { const e = logFor(l.key); return e && !["added", "already"].includes(e.status); }).length;
    return `<div class="pushpanel is-ok">
      <h3>In your Intermarché basket</h3>
      <p>${push.siteCount != null ? `${push.siteCount} items, ` : ""}${push.siteTotal != null ? `<b>${eur(push.siteTotal)}</b> on the site` : ""}${diff != null ? ` — ${Math.abs(diff) < 0.005 ? "exactly the estimate" : `${eur(Math.abs(diff))} ${diff > 0 ? "above" : "below"} the estimate`}` : ""}.
        ${issues ? `${issues} ${issues === 1 ? "line was" : "lines were"} not added — see below.` : "Every line went in."}</p>
      <p class="small">Claude does not book the slot or pay. Check the basket and confirm it yourself.</p>
      <div class="toolbar">
        <a class="btn primary" href="${esc(SITE)}/commandes/panier" target="_blank" rel="noopener">Open my basket</a>
        <button class="btn" id="pushnow">Push again</button>
      </div>
    </div>`;
  }
  const lead = s === "cancelled" ? "Push cancelled" : s === "failed" ? "The push stopped" : "Push to your Intermarché basket";
  return `<div class="pushpanel">
      <h3>${lead}</h3>
      ${s === "failed" && push.note ? `<p>${esc(push.note)}</p>` : ""}
      <p>Claude on your PC opens each product at Méré in your own Chrome, sets the count shown here, and checks the basket total against the estimate. Pushing twice never doubles anything: each count is set, not added on top. It never books a slot or pays.</p>
      <p class="small">Intermarché replaces out-of-stock items by default. To stop that, switch off “Option de remplacement de produits” on your basket page.</p>
      <div class="toolbar"><button class="btn primary" id="pushnow"${noDb ? " disabled" : ""}>Push to Intermarché</button></div>
      ${noDb ? `<p class="small">Pushing needs the published page — this copy is not connected.</p>` : ""}
      ${pushError ? `<p class="small warn">The push could not be sent (${esc(pushError)}). Try again in a moment.</p>` : ""}
    </div>`;
}

function renderApproved() {
  const lines = approved.lines || [];
  let html = `<div class="drive-head">
      <div class="eyebrow">Approved ${new Date(approved.at).toLocaleDateString("en-GB", { day: "numeric", month: "long" })} · ${lines.length} lines · ${eur(approved.total)}</div>
      ${pushPanel(lines)}
      <div class="toolbar" style="margin-top:.8rem">
        <button class="btn" id="reopen"${pushOpen() ? " disabled" : ""}>Reopen for editing</button>
      </div>
    </div>`;
  for (const sec of groupBySection(lines)) {
    html += `<div class="shop-sec">
        <div class="group-head has-icon" style="margin:0">${sectionIcon(sec.name)}<h2>${esc(sec.name)}</h2><span class="leader"></span>
          <span class="group-count">${eur(sec.lines.reduce((a, b) => a + b.cost, 0))}</span></div>
        <ul class="drive-list">${sec.lines.map(pushedRow).join("")}</ul>
      </div>`;
  }
  html += `<div class="shop-total"><span>Estimated total</span><span>${eur(approved.total)}</span></div>`;
  $("#shop-out").innerHTML = html;
}

/* ---------- the day picker ----------
   The week used to be changed from the week: tap Swap on Thursday, pick a dish.
   It runs the other way now — you find a dish on the Recipes tab and drop it on
   a day — because that is where Charlotte asked for the changing to live. Same
   dialog, same setPick underneath; only the order of the two questions moved.
   `assignSlug` null means the generator is the one asking. */
let swapTarget = null;
let assignSlug = null;

function openAssign(slug) {
  assignSlug = slug;
  sheetMode = "day";
  const r = slug ? all()[slug] : null;
  const rows = meals().filter((m) => !r || m.slot === r.slot);

  $("#sheet-title").textContent = r ? "Cook " + r.title + " on…" : "Something else entirely";
  $("#sheet-sub").textContent = r
    ? "Pick the meal it replaces. " + cap(r.slot) + "s only — a dinner does not fit a breakfast."
    : "Pick a meal and Claude will invent something new for it, to the same rules.";
  $("#gen-state").innerHTML = "";
  $("#sheet-search").hidden = true;
  $("#sheet-restore").hidden = true;

  $("#sheet-alts").innerHTML = rows.map((m) => {
    const here = picks[m.id] === slug;
    // A meal already showing this dish is not a target, but saying so is more
    // use than hiding the day and leaving her to wonder where Tuesday went.
    const row = `<button class="alt" type="button" ${here ? "disabled" : `data-assignday="${esc(m.id)}"`}>
        <span class="alt-name">${esc(cap(m.day))} ${esc(m.slot)}</span><span class="leader"></span>
        <span class="alt-meta">${here ? "already this dish" : esc(m.r.title)}</span>
      </button>`;
    // The per-meal undo the old sheet had as "Put the original back".
    if (!m.isSwapped) return row;
    return row + `<button class="alt" type="button" data-putback="${esc(m.id)}">
        <span class="alt-name">&#8617; Put ${esc(cap(m.day))}'s original back</span><span class="leader"></span>
        <span class="alt-meta">${esc(all()[baseline[m.id]].title)}</span>
      </button>`;
  }).join("");
  $("#sheet").showModal();
}

async function persistFavs() {
  if (!favRef) return;
  try { await favRef.set({ slugs: [...favs], updatedAt: Date.now() }); }
  catch (e) { setSync("off", "Favourite saved on this phone only — " + (e && e.code ? e.code : "not saved")); }
}

function toggleFav(slug) {
  if (favs.has(slug)) favs.delete(slug); else favs.add(slug);
  renderAll();
  persistFavs();
}

function setPick(mealId, slug) {
  picks[mealId] = slug;
  renderAll();
  persist();
}

/* ---------- the same sheet, for products rather than dishes ----------
   One dialog, three jobs, so there is a single thing to close and a single set
   of open/close wiring. `sheetMode` says which. */
let sheetMode = "dish";
let productTarget = null;

const priceLabel = (name) => {
  const pb = PRICES[name];
  return pb ? eur(pb.price) + (pb.unit === "kg" ? " / kg" : "") : "no price on file";
};

/* Which aisle a product belongs to, learnt from the recipes that name it. The
   pricebook itself has no sections — it is only names and prices — so this is
   what lets the swap sheet open on something useful instead of a blank search. */
const SECTION_OF = {};
for (const r of Object.values(LIB)) {
  for (const i of r.ingredients || []) {
    if (i.buy && i.buy.section && !SECTION_OF[i.product]) SECTION_OF[i.product] = i.buy.section;
  }
}

/* "beurre" should find the butter, not a shampoo that happens to contain
   "beurre de karité". Rank a name that starts with the query first, then one
   where a word starts with it, then anything containing it. */
function search(query, exclude = []) {
  const q = query.trim().toLowerCase();
  if (q.length < 2) return [];
  const scored = [];
  for (const name of Object.keys(PRICES)) {
    if (exclude.includes(name)) continue;
    const low = name.toLowerCase();
    const at = low.indexOf(q);
    if (at < 0) continue;
    const wordStart = at === 0 || /[^a-z0-9àâäçéèêëîïôöùûü]/.test(low[at - 1]);
    scored.push([at === 0 ? 0 : wordStart ? 1 : 2, at, name]);
  }
  return scored
    .sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2].localeCompare(b[2]))
    .slice(0, 40)
    .map(([, , name]) => name);
}

/* Products offered as a stand-in: the rest of the equivalence group first,
   because those are already known to be the same thing; then, with nothing
   typed, the other products this household buys from the same aisle. */
function productOptions(current, q) {
  const g = GROUP_OF[current];
  const groupNames = g ? (g.members || []).map((m) => m.name).filter((n) => n !== current) : [];
  const head = groupNames.map((n) => ({ name: n, why: g.label }));
  const sec = SECTION_OF[current];
  const rest = q.trim().length >= 2
    ? search(q, [current, ...groupNames]).map((n) => ({ name: n, why: null }))
    : Object.keys(PRICES)
        .filter((n) => n !== current && !groupNames.includes(n) && SECTION_OF[n] === sec)
        .sort((a, b) => a.localeCompare(b))
        .slice(0, 30)
        .map((n) => ({ name: n, why: sec }));
  return [...head, ...rest];
}

function renderProductAlts() {
  const q = $("#sheet-search").value;
  const current = sheetMode === "product" ? (subs[productTarget] || productTarget) : null;
  const opts = sheetMode === "product"
    ? productOptions(current, q)
    : search(q).map((n) => ({ name: n, why: SECTION_OF[n] || null }));

  if (!opts.length) {
    $("#sheet-alts").innerHTML = `<div class="empty" style="padding:1.4rem 1rem">${
      q.trim().length >= 2 ? "Nothing in your receipts matches that." : "Type at least two letters to search."
    }</div>`;
    return;
  }
  const attr = sheetMode === "product" ? "data-pick-product" : "data-add-product";
  $("#sheet-alts").innerHTML = opts.map((o) =>
    `<button class="alt" type="button" ${attr}="${esc(o.name)}">
       <span class="alt-name">${esc(o.name)}${o.why ? ` <span class="flag pantry">${esc(o.why)}</span>` : ""}</span>
       <span class="leader"></span>
       <span class="alt-meta">${esc(priceLabel(o.name))}</span>
     </button>`).join("");
}

function openProductSwap(key) {
  sheetMode = "product";
  productTarget = key;
  const current = subs[key] || key;
  $("#sheet-title").textContent = "Buy something else instead";
  $("#sheet-sub").textContent = "The recipes ask for " + key + ". Anything you pick here is bought in its place — the dish does not change.";
  $("#gen-state").innerHTML = "";
  $("#sheet-restore").hidden = !subs[key];
  $("#sheet-search").hidden = false;
  $("#sheet-search").value = "";
  renderProductAlts();
  $("#sheet").showModal();
}

function openAddItem() {
  sheetMode = "add";
  productTarget = null;
  $("#sheet-title").textContent = "Add something to the order";
  $("#sheet-sub").textContent = "Anything you add is marked as yours rather than attributed to a dish.";
  $("#gen-state").innerHTML = "";
  $("#sheet-restore").hidden = true;
  $("#sheet-search").hidden = false;
  $("#sheet-search").value = "";
  renderProductAlts();
  $("#sheet").showModal();
}

/* ---------- the ingredient controls ---------- */
function commitShop() { renderAll(); persist(); }

/* "I have it" means all of it — enough that nothing needs buying. Pressed again
   from the kitchen list it means the opposite: none of it. */
function toggleAllOf(key) {
  const b = basket();
  const inKitchen = b.kitchen.some((x) => x.key === key);
  const l = [...b.lines, ...b.kitchen].find((x) => x.key === key);
  if (!l) return;
  if (inKitchen) {
    delete have[key];
    delete dropped[key];
  } else {
    have[key] = (have[key] || 0) + l.toBuy;
  }
  commitShop();
}

function toggleStrike(key) {
  if (dropped[key]) delete dropped[key];
  else if (added[key]) delete added[key];
  else dropped[key] = true;
  commitShop();
}

function addProduct(name) {
  const key = "added:" + name;
  added[key] = { name, qty: (added[key]?.qty || 0) + 1 };
  commitShop();
}

function stepAdd(key, dir) {
  const l = basket().lines.find((x) => x.key === key);
  if (!l) return;
  const next = Math.min(99, Math.max(1, l.add + dir));
  if (next === l.addDefault) delete addAdj[key]; else addAdj[key] = next;
  commitShop();
}

function chooseLine(key, option) {
  choices[key] = { pick: option === "skip" || option === "listing" ? option : Number(option), at: Date.now() };
  delete addAdj[key];
  commitShop();
}

function unchoose(key) {
  delete choices[key];
  delete addAdj[key];
  commitShop();
}

function approveList() {
  const { lines, pending, total } = basket();
  if (pending.length || !lines.length) return;
  // The lines travel with the approval, each resolved to the exact Méré listing
  // and count, so the push works from what she signed off and never re-derives it.
  approved = {
    at: Date.now(), total: round2(total), count: lines.length, weekOf: plan.weekOf,
    lines: lines.map((l) => ({
      key: l.key, name: l.name, section: l.section, for: l.for,
      add: l.add, cost: round2(l.cost), approx: l.approx,
      status: l.choice ? "chosen" : l.cat ? l.cat.status : "unchecked",
      url: l.site ? l.site.url : null,
      expect: l.site ? { brand: l.site.brand, title: l.site.title, packaging: l.site.packaging } : null,
      price: l.site && l.site.price != null ? l.site.price : null,
      search: l.cat ? l.cat.search : l.name,
    })),
  };
  inBasket = {};
  commitShop();
  window.scrollTo({ top: 0, behavior: "instant" });
}

function reopenList() {
  if (pushOpen()) return;
  approved = null;
  commitShop();
}

function toggleInBasket(key) {
  if (inBasket[key]) delete inBasket[key]; else inBasket[key] = true;
  commitShop();
}

async function requestPush() {
  if (!approved || !pushRef) return;
  pushError = null;
  // requestedAt doubles as this push's run id: every report Claude files names it.
  const doc = {
    weekOf: plan.weekOf, status: "requested", requestedAt: Date.now(),
    approvedAt: approved.at, estimate: approved.total, ceiling: CONF.budgetCeiling,
    store: CONF.store || "", lines: approved.lines.map((l, i) => ({ ...l, n: i + 1 })),
  };
  push = doc;
  renderAll();
  try { await pushRef.set(doc); }
  catch (e) { pushError = (e && e.code) || "not saved"; push = null; renderAll(); }
}

async function cancelPush() {
  const s = pushState();
  if (!pushRef || !s || s.status !== "requested") return;
  try { await pushRef.update({ status: "cancelled", cancelledAt: Date.now() }); }
  catch (e) { pushError = (e && e.code) || "not saved"; renderAll(); }
}

async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { /* blocked in some frames */ }
  if (!ok) {
    // Clipboard access is not guaranteed inside the artifact frame; selecting
    // the text still lets her copy it by hand.
    const el = btn.parentElement.querySelector("code");
    const r = document.createRange(); r.selectNodeContents(el);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }
  btn.textContent = ok ? "Copied" : "Selected";
  btn.classList.add("did");
  setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("did"); }, 1600);
}

function resetShop() {
  have = { ...haveSeed };
  qtyAdj = {}; subs = {}; dropped = {}; added = {}; addAdj = {}; choices = {};
  commitShop();
}

/* ---------- generating a new dish ---------- */
function generatePrompt(meal) {
  const c = CONF.constraints;
  const products = Object.keys(PRICES).join("\n");
  const already = Object.values(all()).map((r) => r.title).join("; ");
  return `Invent one ${meal.slot} dish for a household of two in France who shop at Intermarché.

HARD RULES, no exceptions:
- No chilli, no capsaicin, nothing hot. ${c.bannedReason}
- Minimise ${c.limited.join(", ")}. ${c.limitedReason} Cheese is fine. Coconut milk is fine.
- It must be a dish that is genuinely COOKED. Never a recipe for reheating a ready-made or frozen product.
- Total time at most ${meal.slot === "dinner" ? c.maxWeeknightMinutes + 15 : 20} minutes.
- Do not repeat any of these existing dishes: ${already}

Every ingredient that must be bought needs a "product" chosen EXACTLY, character for character, from this list of things they actually buy. If nothing in the list fits, set "guess": true and give buy.price as a euro estimate.

${products}

Reply with JSON only, this exact shape:
{"title":"","cuisine":"italian|french|spanish|greek|japanese|chinese|thai|vietnamese|indian",
 "protein":"${PROTEINS.join("|")}",
 "slot":"${meal.slot}","kind":"recipe","prepMinutes":0,"cookMinutes":0,"serves":${meal.slot === "dinner" ? 2 : 1},
 "tags":["no chilli"],"short":"one sentence a cook can read at the hob",
 "ingredients":[{"item":"plain name","qty":"how much","product":"exact name from the list",
   "buy":{"amount":0.3,"mode":"sum","section":"Proteins|Vegetables|Store cupboard|Bread and cheese"}}],
 "steps":["numbered method, 4 to 7 steps, specific about heat and timing"]}

buy.mode is "sum" for produce and meat, "once" for a bottle or bag that lasts the week. Omit "buy" entirely for salt, pepper, oil or eggs.`;
}

function sanitise(r, slot) {
  if (!r || typeof r !== "object" || !r.title || !Array.isArray(r.steps)) throw new Error("shape");
  r.slot = slot;
  r.kind = "recipe";
  r.serves = r.serves || (slot === "dinner" ? 2 : 1);
  r.prepMinutes = +r.prepMinutes || 10;
  r.cookMinutes = +r.cookMinutes || 15;
  r.tags = Array.isArray(r.tags) ? r.tags : [];
  if (!r.tags.includes("no chilli")) r.tags.push("no chilli");
  // The Recipes tab groups on this, so a dish without one would fall out of
  // every heading. Trust the model only if it answered from the vocabulary.
  if (!PROTEINS.includes(r.protein)) {
    const p = (r.ingredients || []).find((i) => i.buy && i.buy.section === "Proteins");
    const item = p ? String(p.item).toLowerCase() : "";
    r.protein = PROTEINS.find((x) => item.includes(x)) || "vegetarian";
  }
  r.tags.push("invented");
  r.short = r.short || "";
  r.ingredients = (r.ingredients || []).map((i) => {
    const o = { item: String(i.item || "something"), qty: String(i.qty || ""), product: String(i.product || "") };
    if (i.buy && i.buy.amount != null) {
      const known = !!PRICES[o.product];
      o.guess = !known;
      o.buy = {
        amount: +i.buy.amount || 1,
        mode: i.buy.mode === "once" ? "once" : "sum",
        section: i.buy.section || (known ? "Store cupboard" : "Best guesses"),
      };
      // A product the pricebook has never seen still has to cost something, or
      // the basket would quietly under-report.
      if (!known) { o.buy.price = +i.buy.price || 3; o.buy.section = "Best guesses"; }
    } else o.pantry = true;
    return o;
  });
  return r;
}

async function generate() {
  if (!sample || !swapTarget) return;
  const meal = mealById(swapTarget);
  $("#sheet-alts").hidden = true;
  $("#gen-state").innerHTML = `<div class="genstate">Asking Claude for something new… this takes a few seconds.</div>`;
  try {
    const raw = await sample.json(generatePrompt(meal), { modelTier: "default" });
    const r = sanitise(raw, meal.slot);
    const slug = "new-" + r.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) + "-" + Date.now().toString(36).slice(-4);
    extra[slug] = r;
    $("#sheet").close();
    setPick(swapTarget, slug);
  } catch (e) {
    const code = e && e.code ? e.code : "failed";
    $("#gen-state").innerHTML = `<div class="genstate err">${esc(
      code === "not_granted" ? "Claude isn't available on this view — pick from the list instead."
      : code === "rate_limited" ? "Too many requests just now. Try again in a minute."
      : "That didn't come back usable. Try again, or pick from the list.")}</div>`;
  } finally {
    $("#sheet-alts").hidden = false;
  }
}


/* ---------- render all ---------- */
function renderAll() {
  renderRecipeChips();
  renderWeek();
  renderRecipes();
  renderShop();
  renderMasthead();
}

function renderMasthead() {
  const { lines, pending, total } = basket();
  $("#store-line").textContent = CONF.store || plan.store || "";
  $("#week-title").textContent = plan.label || ("Week of " + plan.weekOf);
  const count = (s) => plan.meals.filter((m) => m.slot === s).length;
  const parts = SLOT_ORDER
    .map((s) => [count(s), s])
    .filter(([n]) => n > 0)
    .map(([n, s]) => `${n} ${n > 1 ? PLURAL[s] : s}`);
  const ps = pushState();
  const status = ps && ps.status === "done" ? "In your Intermarché basket"
    : pushOpen() ? "Being pushed to Intermarché"
    : approved ? "Approved — ready to push"
    : pending.length ? `${pending.length} to decide before approving`
    : "Ready to approve";
  $("#strapline").textContent =
    `The basket for ${andList(parts)}. Swap a dish and the basket follows. No chilli anywhere.`;
  $("#tally").innerHTML = [
    ["To buy", eur(approved ? approved.total : total)],
    ["Ceiling", eur(CONF.budgetCeiling)],
    ["Lines", approved ? approved.lines.length : lines.length],
    ["Status", status],
    // One element per pair, or the flex row wraps a label away from its number.
  ].map(([k, v]) => `<span class="tally-pair"><span>${k}</span>&nbsp;<b>${esc(String(v))}</b></span>`).join("");
  const checked = Object.values(CATALOGUE).map((c) => c.checked).sort().pop();
  $("#foot").innerHTML =
    `${Object.keys(all()).length} dishes. Prices and packs as listed at Méré${checked ? " on " + esc(checkedOn(checked)) : ""}; ` +
    `weighed goods are charged on the exact weight at collection, so those lines are approximate.`;
}

/* ---------- wiring ---------- */
function segment(sel, onchange) {
  $(sel).addEventListener("click", (e) => {
    const b = e.target.closest("button[data-v]");
    if (!b) return;
    $$("button", $(sel)).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    onchange(b.dataset.v);
  });
}
segment("#rgroup", (v) => { rstate.groupBy = v; renderRecipes(); });
segment("#rslot", (v) => { rstate.slot = v; renderRecipes(); });

$("#rsearch").addEventListener("input", (e) => { rstate.q = e.target.value; renderRecipes(); });
$("#rec-clear").addEventListener("click", () => {
  rstate.q = ""; rstate.slot = "all";
  $("#rsearch").value = "";
  rstate.kit.clear();
  rstate.favsOnly = false;
  $$("#rslot button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === "all")));
  renderRecipeChips(); renderRecipes();
});
$("#gen-open").addEventListener("click", () => openAssign(null));

document.addEventListener("click", (e) => {
  // ---- the week, changed from the Recipes tab ----
  const as = e.target.closest("button[data-assign]");
  if (as) return openAssign(as.dataset.assign);
  const day = e.target.closest("button[data-assignday]");
  if (day) {
    $("#sheet").close();
    swapTarget = day.dataset.assignday;
    return assignSlug ? setPick(swapTarget, assignSlug) : generate();
  }
  const pb = e.target.closest("button[data-putback]");
  if (pb) {
    $("#sheet").close();
    const id = pb.dataset.putback;
    return setPick(id, baseline[id]);
  }
  // Rendered at the foot of the week rather than bound at load, because the
  // week is drawn from scratch every time anything changes.
  if (e.target.closest("#resetweek")) { picks = { ...baseline }; renderAll(); return persist(); }

  const fav = e.target.closest("button[data-fav]");
  if (fav) return toggleFav(fav.dataset.fav);
  const kit = e.target.closest("button[data-kit]");
  if (kit) {
    const k = kit.dataset.kit;
    rstate.kit.has(k) ? rstate.kit.delete(k) : rstate.kit.add(k);
    renderRecipeChips(); return renderRecipes();
  }
  if (e.target.closest("#favonly")) {
    rstate.favsOnly = !rstate.favsOnly;
    renderRecipeChips(); return renderRecipes();
  }

  // the ingredient layer
  const step = e.target.closest("button[data-addstep]");
  if (step) return stepAdd(step.dataset.addstep, Number(step.dataset.dir));
  const pick = e.target.closest("button[data-choice]");
  if (pick) return chooseLine(pick.dataset.choice, pick.dataset.option);
  const unpick = e.target.closest("button[data-unchoose]");
  if (unpick) return unchoose(unpick.dataset.unchoose);
  const allof = e.target.closest("button[data-allof]");
  if (allof) return toggleAllOf(allof.dataset.allof);
  const strike = e.target.closest("button[data-strike]");
  if (strike) return toggleStrike(strike.dataset.strike);
  const subsw = e.target.closest("button[data-subswap]");
  if (subsw) return openProductSwap(subsw.dataset.subswap);
  const pp = e.target.closest("button[data-pick-product]");
  if (pp) {
    const name = pp.dataset.pickProduct;
    if (name === productTarget) delete subs[productTarget]; else subs[productTarget] = name;
    $("#sheet").close();
    return commitShop();
  }
  const ap = e.target.closest("button[data-add-product]");
  if (ap) { $("#sheet").close(); return addProduct(ap.dataset.addProduct); }
  const tick = e.target.closest("button[data-tick]");
  if (tick) return toggleInBasket(tick.dataset.tick);
  const cmd = e.target.closest("#copycmd");
  if (cmd) return copyText(PUSH_COMMAND, cmd);
  if (e.target.closest("#pushnow")) return requestPush();
  if (e.target.closest("#pushcancel")) return cancelPush();
  if (e.target.closest("#approve")) return approveList();
  if (e.target.closest("#reopen")) return reopenList();
  if (e.target.closest("#additem")) return openAddItem();
  if (e.target.closest("#resetshop")) return resetShop();

  const btn = e.target.closest(".expand");
  if (!btn) return;
  const c = btn.closest(".card");
  const open = c.classList.toggle("open");
  btn.setAttribute("aria-expanded", String(open));
  btn.querySelector(".caret").textContent = open ? "▴" : "▾";
});

$("#sheet-close").addEventListener("click", () => $("#sheet").close());
$("#sheet-restore").addEventListener("click", () => {
  $("#sheet").close();
  delete subs[productTarget];
  commitShop();
});
$("#sheet-search").addEventListener("input", renderProductAlts);

const PANELS = { "tab-week": "panel-week", "tab-recipes": "panel-recipes",
                 "tab-shop": "panel-shop" };
$$(".tab").forEach((t) => t.addEventListener("click", () => {
  $$(".tab").forEach((x) => {
    const on = x === t;
    x.setAttribute("aria-selected", String(on));
    $("#" + PANELS[x.id]).hidden = !on;
  });
  window.scrollTo({ top: 0, behavior: "instant" });
}));

setSync("", "Checking for your partner's changes…");
renderAll();
</script>
