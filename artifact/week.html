x du Primeur Citrons JAUNES","buy":{"amount":0.28,"mode":"once","section":"Vegetables"}},{"item":"broccoli","qty":"half a head, in florets","product":"Le Choix du Primeur Brocolis","buy":{"amount":0.25,"mode":"sum","section":"Vegetables"}},{"item":"garlic","qty":"2 cloves, sliced","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"olive oil, black pepper","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Flatten each escalope with the heel of your hand or the base of a small pan to an even 5 mm, so it cooks through before the pancetta burns.","Pepper them — no salt, the pancetta brings it. Lay a few rosemary needles on each, then wrap each escalope in three slices of pancetta, slightly overlapping, pressing it on.","Put the broccoli on: 2 cm of boiling water in a pan, florets in, lid on, 4 minutes. Drain, then toss for a minute in the same hot pan with a little olive oil and the sliced garlic.","Meanwhile, a spoonful of olive oil in a frying pan over medium-high heat. Turkey in with the side where the pancetta ends meet face down, 3 minutes until crisp, then turn and give it 3 minutes more.","Squeeze in the lemon and add 3 tbsp water. Let it bubble for 30 seconds, scraping up the brown bits, and spoon the sauce over the turkey. Broccoli alongside."],"equipment":["hob"]},"tarte-tomates-brebis":{"title":"Tomato, brebis and rosemary tart","cuisine":"french","slot":"dinner","kind":"recipe","prepMinutes":8,"cookMinutes":22,"serves":2,"tags":["no chilli","vegetarian"],"short":"A flat Provençal tart: shortcrust baked empty for a few minutes, then covered in overlapping tomato slices, crumbled brebis and rosemary, and baked until the tomatoes slump and the border browns. The plain Salakis takes a pinch of sweet paprika for colour. Mâche on the side.","ingredients":[{"item":"shortcrust pastry","qty":"1 roll, 230 g","product":"Pâte brisée prête à dérouler","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":0.65}},{"item":"tomatoes","qty":"2 large, sliced","product":"Le Choix du Primeur Tomates RONDES CHARNUES","buy":{"amount":0.6,"mode":"sum","section":"Vegetables"}},{"item":"brebis","qty":"100 g, crumbled — half the pack","product":"Salakis Fromage 100% brebis","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":2.68}},{"item":"red onion","qty":"half, in thin rings","product":"Le Choix du Primeur Oignons ROUGES","buy":{"amount":0.08,"mode":"sum","section":"Vegetables"}},{"item":"rosemary","qty":"a pinch of needles, chopped","product":"Romarin frais","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.74}},{"item":"sweet paprika","qty":"a pinch","product":"Bouton d’Or, une marque Intermarché Paprika doux moulu","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"mâche","qty":"to serve","product":"Le Choix du Primeur Salade MACHE","buy":{"amount":1,"mode":"once","section":"Vegetables"}},{"item":"olive oil, salt, black pepper","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Heat the oven to 210 °C. Unroll the pastry on its own baking paper onto a tray and prick the base all over with a fork, leaving a 2 cm border untouched.","Bake it empty for 7 minutes, until it has just set and lost its shine. Meanwhile slice the tomatoes 5 mm thick and lay them on a board with a pinch of salt — it draws out the water that would make the base soggy.","Pat the tomatoes dry. Scatter the onion rings over the pastry inside the border, then lay the tomatoes in overlapping rows.","Crumble the brebis over, then the rosemary, a pinch of sweet paprika, black pepper and a thread of olive oil.","Back in the oven for 15 minutes, until the border is deep gold and the tomatoes have softened at the edges. Leave it 3 minutes before cutting. Mâche on the side with a drop of olive oil."],"equipment":["oven"]},"salade-piemontaise":{"title":"Potato salad with cornichons, egg and tomato","cuisine":"french","slot":"lunch","kind":"recipe","prepMinutes":10,"cookMinutes":15,"serves":2,"tags":["make ahead","no chilli","dairy-free","vegetarian","uses eggs"],"short":"Salade piémontaise is the French canteen potato salad, usually bound with mayonnaise and ham. This one uses an olive-oil dressing sharpened with cornichon brine and a little balsamic instead, and lets the cornichons, eggs and tomatoes carry it. Two lunches' worth.","ingredients":[{"item":"potatoes","qty":"500 g, in 2 cm cubes","product":"Le Choix du Primeur Pomme de terre de consommation PRINCESSE AMANDINE à chair ferme avec traitement anti germinatif","buy":{"amount":1,"mode":"sum","section":"Vegetables"}},{"item":"eggs","qty":"2","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"cornichons","qty":"8, sliced, plus 2 tbsp of their brine","product":"Maille Cornichons extra-fins L'Original","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"cherry tomatoes","qty":"a handful, halved","product":"Petit prix Tomates cerises allongées","buy":{"amount":1,"mode":"once","section":"Vegetables"}},{"item":"red onion","qty":"half, finely chopped","product":"Le Choix du Primeur Oignons ROUGES","buy":{"amount":0.08,"mode":"sum","section":"Vegetables"}},{"item":"balsamic vinegar","qty":"1 tsp","product":"Vinaigre balsamique","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.54}},{"item":"olive oil, salt, black pepper","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Potatoes into a pan of cold salted water, bring to the boil and simmer 10 to 12 minutes, until a knife goes in without resistance. Lower the eggs in for the last 9 minutes.","Meanwhile make the dressing in the bowl you will serve from: 3 tbsp olive oil, 2 tbsp cornichon brine, the balsamic, salt and plenty of pepper. Stir in the chopped red onion so it softens in the vinegar.","Drain the potatoes and tip them straight into the dressing while they are hot — warm potatoes drink it, cold ones only get coated. Cool the eggs under cold water.","Once the potatoes are no more than warm, fold in the sliced cornichons and the tomatoes. Peel and quarter the eggs and set them on top.","Split it between two boxes. It is better after an hour and keeps two days in the fridge; take it out a little before eating."],"equipment":["hob"]},"riz-au-lait-amande":{"title":"Almond-milk rice pudding with cinnamon and banana","cuisine":"french","slot":"breakfast","kind":"recipe","prepMinutes":5,"cookMinutes":30,"serves":4,"tags":["batch cook","make ahead","no chilli","dairy-free","vegetarian"],"short":"Riz au lait without the milk: short-grain sushi rice cooked slowly in vanilla almond milk with cinnamon and a little sugar until it turns creamy. Made once, it is breakfast for four mornings, cold from the fridge or warmed through, with banana sliced over.","ingredients":[{"item":"sushi rice","qty":"120 g","product":"Tanoshi Riz pour sushi Japonica","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"almond milk","qty":"800 ml","product":"Bjorg Boisson végétale Lait d'amande vanille BIO","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"sugar","qty":"3 tbsp","product":"Daddy Sucre en poudre","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"cinnamon","qty":"1 tsp, plus more to finish","product":"Bouton d’Or, une marque Intermarché Cannelle moulue","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"banana","qty":"2, sliced over as you serve","product":"Le Choix du Primeur Bananes","buy":{"amount":0.5,"mode":"sum","section":"Vegetables"}},{"item":"salt","qty":"a pinch","product":"already in the cupboard","pantry":true}],"steps":["Don't rinse the rice — the starch you would wash away is what makes it creamy.","Rice, 600 ml of the almond milk, the sugar, the cinnamon and a pinch of salt into a heavy pan. Bring just to a simmer over medium heat, stirring so nothing sticks.","Turn the heat right down. Cook uncovered for 25 to 30 minutes, stirring every few minutes and more often towards the end, adding the rest of the almond milk a splash at a time whenever it looks thick. Almond milk catches more easily than cow's milk, so keep it low.","It is done when the grains are soft right through and it still falls off a spoon — it sets a good deal as it cools.","Eat a bowl warm with sliced banana and a dusting of cinnamon. Cover the rest and keep it in the fridge up to three days; loosen it in the morning with a splash of almond milk."],"equipment":["hob"]}},"plans":[{"weekOf":"2026-09-06","label":"Week of 6 September","store":"Intermarché Drive Méré","notes":["Saturday's Drive run already brought the proteins and the starch — aiguillettes de poulet, viande hachée, côtes de porc, chipolatas, riz basmati, deux pâtes à pizza, pesto, mozzarella, gouda, cheddar. The week is built around them.","The vegetables failed to go through on the Intermarché site, so this order is almost entirely produce. That is the gap, not a new week's shop.","Chinese, Thai and French vegetable-forward, as asked. No chilli anywhere: no piment, harissa, gochujang or sauce piquante."],"meals":[{"id":"sunday-breakfast","day":"sunday","slot":"breakfast","recipe":"roules-cannelle","note":"Uses one of the two pizza doughs. Makes ten — freeze what you won't eat by Tuesday."},{"id":"sunday-dinner","day":"sunday","slot":"dinner","recipe":"curry-coco-poulet","note":"Batch cook, on Saturday's aiguillettes rather than thighs. Makes Tuesday's dinner too."},{"id":"monday-dinner","day":"monday","slot":"dinner","recipe":"boeuf-poivrons","note":"The 350 g of viande hachée from Saturday."},{"id":"tuesday-dinner","day":"tuesday","slot":"dinner","recipe":"curry-coco-poulet","minutesOverride":10,"note":"Sunday's curry, reheated. Cucumber and coriander alongside to freshen it.","leftovers":true},{"id":"wednesday-di    too, or a swap would render as a blank card on the other person's phone. */
const baseline = Object.fromEntries(plan.meals.map((m) => [m.id, m.recipe]));
let picks = { ...baseline };
let extra = {};
let db = null, weekRef = null, sample = null;

/* The ingredient layer. The dishes decide what the week *needs*; these six
   decide what actually has to be bought, and every one of them is hers to set
   from the Shopping tab. They ride in the same shared document as `picks`, so
   both phones agree on the basket as well as the menu. What is already in the
   kitchen used to sit here too; it has its own tab and its own document now. */
const haveSeed = Object.fromEntries(ONHAND.items.map((i) => [i.product, i.quantity]));
let qtyAdj  = {};               // product -> override what the recipes asked for
let subs    = {};               // product -> buy this one instead
let dropped = {};               // product -> struck off by hand
let added   = {};               // key -> { name, qty, section } she added herself
let addAdj  = {};               // key -> how many packs to add at Méré, set by hand
let choices = {};               // key -> { pick: "listing" | <alternative index> | "skip" }

/* ---------- the kitchen, as she reports it ----------
   The receipt is the best *starting* answer to "what do you already have", and
   it is wrong by Wednesday. The order of 5 September was still listed as in the
   kitchen nine days later with not a gram of it left, and the only way to say so
   was to tap twenty lines in a collapsed box on the shopping list. So the
   kitchen is its own tab now, and what is on hand is three layers over each
   other, in this order:

     1. the newest receipt — everything it delivered;
     2. minus whatever the meals she has ticked as cooked used up;
     3. plus or minus anything she has said herself, which outranks both.

   Layer 2 is a guess and never hides: every line it touches says which dish
   took it, and unticking the meal puts the number straight back. Layer 3 is
   hers, dated, and kept in `library/kitchen` rather than in the week — so, like
   favourites, it is still there on next week's page.

   That date is the safety catch. A statement made before the newest receipt is
   not quietly believed: the shop has happened since, so the page asks whether
   it is still true and leaves it out of the count until she answers. The rule
   this app was built on holds — an inventory nobody decrements under-orders,
   and under-ordering ends with no dinner — except that now there is somewhere
   to decrement it, and anything she has not confirmed counts for nothing. */
const SEED_AT = ONHAND.from
  ? Date.UTC(ONHAND.from.date.year, ONHAND.from.date.month - 1, ONHAND.from.date.day, 12)
  : 0;
let kitchen = {};        // product -> { qty, at } — what she has told us is here
let kitchenRef = null;
/* Corrections from a week document written by the older page, which kept them
   under `have`. Read, never written: they sit just above the receipt and below
   anything she says now — but only while they are about the receipt this page
   is seeded from. The week document records the order it was written against,
   so when a newer one has landed since, those corrections are precisely the
   stale statement this page refuses to assume: they move to `legacyOld`, which
   is asked about rather than counted. */
let legacyHave = {};
let legacyOld  = {};
/* The pair exactly as the document had it, written back untouched by `persist`.
   They only mean anything together — a set of corrections, and the receipt they
   were about — so rewriting either would either destroy the questions before
   she has answered them or, worse, restamp her old numbers as being about this
   week's shop. Once she has answered, `toConfirm` skips them and the pair sits
   there inert until next week's page replaces the document. */
let legacyRaw = {};
let legacySeed = null;

const staleSaid = (e) => !!e && !(e.at >= SEED_AT);
const saidNow   = () => Object.entries(kitchen).filter(([, e]) => !staleSaid(e));
const saidStale = () => Object.entries(kitchen).filter(([, e]) => staleSaid(e));

/* Everything this page is holding but will not count until she says so: her own
   statements from before this receipt, and corrections carried over from a page
   seeded from an older one. Same question, same two answers, one list. A
   carried correction the new receipt already speaks to is dropped rather than
   asked about — the receipt is the better answer, and a question she does not
   need to be asked is one more reason to stop reading the list. */
function toConfirm() {
  const out = saidStale().map(([product, e]) => ({ product, qty: e.qty, when: whenSaid(e.at) }));
  for (const [product, qty] of Object.entries(legacyOld)) {
    if (kitchen[product] || haveSeed[product] != null || !(qty > 0)) continue;
    out.push({ product, qty, when: "on last week's page" });
  }
  return out.sort((a, b) => a.product.localeCompare(b.product));
}
const r3 = (n) => Math.round(n * 1000) / 1000;

/* What the meals she has ticked as cooked have taken out of the kitchen. */
function usedByCooked() {
  const out = {};
  for (const m of meals()) {
    if (m.done !== "cooked" || m.leftovers) continue;
    for (const i of m.r.ingredients || []) {
      if (!i.buy) continue;
      const e = out[i.product] || (out[i.product] = { amount: 0, dishes: [] });
      e.amount += i.buy.amount;
      if (!e.dishes.includes(m.r.title)) e.dishes.push(m.r.title);
    }
  }
  return out;
}

/* On hand right now, the three layers resolved. */
function onHandNow() {
  const out = { ...haveSeed, ...legacyHave };
  for (const [product, u] of Object.entries(usedByCooked())) {
    if (out[product] != null) out[product] = Math.max(0, r3(out[product] - u.amount));
  }
  for (const [product, e] of saidNow()) out[product] = Math.max(0, e.qty);
  return out;
}

/* Say how much of something is here. Every statement is stamped, because a
   statement's date is what decides whether next week's page still believes it. */
function say(product, qty) {
  kitchen[product] = { qty: Math.max(0, r3(qty)), at: Date.now() };
  renderAll();
  persistKitchen();
}
function unsay(product) {
  delete kitchen[product];
  renderAll();
  persistKitchen();
}

/* ---------- the week as it is actually lived ----------
   A plan is a proposal. By Thursday something has been cooked, something was
   eaten out, and Saturday has moved to Sunday. These ride in the shared week
   document alongside the swaps, so both phones see the same week. */
let mealDone  = {};   // mealId -> "cooked" | "not-cooked"
let mealMoved = {};   // mealId -> { day, slot }
let mealOff   = {};   // mealId -> true, struck off the week entirely
let mealAdded = {};   // id -> { id, day, slot, recipe } she put on herself

/* Favourites. Not week-scoped like the rest — a dish you love is still a dish
   you love next week — so they live in their own document and survive the plan
   changing underneath them. Shared, like everything else here. */
/* The list is hers to approve, and only once every line says exactly which Méré
   product and how many. Approved, the page stops being an editor and becomes
   the push: what goes to Intermarché and what came back. Reopening it puts the
   editor back. */
let approved = null;        // { at, total, count, lines } once she has signed it off
let inBasket = {};          // product -> already added at the Drive

/* Pushing. The page cannot reach intermarche.com itself, so a push is a request
   written to push/<weekOf>; Claude on her PC picks it up with `/courses push`,
   fills the basket through her own Chrome, and writes each line's outcome back
   into the same document, which this page follows live. */
let push = null;          // push/<weekOf>: the request, written by this page
let pushRef = null;
let pushError = null;
let progress = [];        // push/<weekOf>/progress/*: Claude's reports, append-only

/* The request as it stands now: the request document with every report Claude
   has filed for this push folded over it, oldest first. Reports are new
   documents rather than edits, so they never collide with each other or with
   her own writes; a report from an earlier push of the same week is ignored. */
function pushState() {
  if (!push) return null;
  const s = { ...push, log: {} };
  const mine = progress.filter((p) => p && p.run === push.requestedAt).sort((a, b) => (a.at || 0) - (b.at || 0));
  for (const p of mine) {
    if (p.type === "line" && p.key) s.log[p.key] = p;
    if (p.type === "status" && push.status !== "cancelled") {
      s.status = p.status;
      for (const f of ["question", "note", "siteTotal", "siteCount"]) if (p[f] != null) s[f] = p[f];
    }
  }
  return s;
}
const PUSH_COMMAND = "/courses push";

let favs = new Set();
let favRef = null;
const isFav = (slug) => favs.has(slug);

const all = () => ({ ...LIB, ...extra });
const dishFor = (mealId) => all()[picks[mealId] || (mealAdded[mealId] || {}).recipe];
const mealById = (id) => {
  const m = plan.meals.find((x) => x.id === id) || mealAdded[id] || null;
  return m ? { ...m, ...(mealMoved[id] || {}) } : null;
};
const minutesOf = (m, r) => m.minutesOverride ?? (r.prepMinutes + r.cookMinutes);
const changed = () => Object.keys(picks).filter((k) => picks[k] !== baseline[k]);
/* Anything at all touched on the Shopping tab, so the reset button knows to
   show itself. The kitchen has its own tab and its own undo. */
const shopEdited = () =>
  [qtyAdj, subs, dropped, added, addAdj, choices].some((o) => Object.keys(o).length > 0);
const larderEdited = () => Object.keys(kitchen).length > 0;
/* Anything done to the week beyond the plan as it shipped. */
const weekEdited = () => changed().length > 0 ||
  [mealDone, mealMoved, mealOff, mealAdded].some((o) => Object.keys(o).length > 0);

/* Every meal, resolved: the plan, less anything struck off, plus anything she
   has added, each sitting on whatever day it has been moved to. Skips a pick
   whose dish has gone missing. */
function meals() {
  return [...plan.meals, ...Object.values(mealAdded)]
    .filter((m) => !mealOff[m.id])
    .map((m) => {
      const r = dishFor(m.id);
      if (!r) return null;
      const at = mealMoved[m.id] || m;
      return { ...m, day: at.day, slot: at.slot, r, minutes: minutesOf(m, r),
               leftovers: !!m.leftovers,
               done: mealDone[m.id] || null,
               isAdded: !!mealAdded[m.id],
               isMoved: !!mealMoved[m.id],
               ingredients: (r.ingredients || []).map((i) => i.item.toLowerCase()),
               isSwapped: !!baseline[m.id] && picks[m.id] !== baseline[m.id] };
    }).filter(Boolean);
}

/* The meals struck off, so there is a way back for them. */
const offMeals = () => [...plan.meals, ...Object.values(mealAdded)]
  .filter((m) => mealOff[m.id] && all()[picks[m.id]]);

/* ---------- equivalences ----------
   A curated map, shipped from data/equivalents.json. It exists so that the
   Jean Rozé pork chops on Saturday's receipt count against a recipe that names
   the Terroirs ones. Every match it makes is printed on the line that it
   covered — an equivalence is reported, never silent, because quietly swapping
   one product for another is exactly the thing this app must not do. */
const GROUP_OF = {};
for (const g of EQUIV) for (const m of g.members || []) GROUP_OF[m.name] = g;

const unitOf = (product) => (PRICES[product] ? PRICES[product].unit : "unit");
const memberIn = (g, name) => (g.members || []).find((m) => m.name === name);

/* How much of `want` a quantity of `holding` is worth. Within a group priced
   the same way this is one-for-one; where a group mixes a per-kilo product with
   a tray sold by the unit, the tray's `kg` weight converts between them. */
function convert(qty, holding, want) {
  if (holding === want) return qty;
  const g = GROUP_OF[holding];
  if (!g || g !== GROUP_OF[want]) return 0;
  const from = unitOf(holding), to = unitOf(want);
  if (from === to) return qty;
  const w = memberIn(g, from === "kg" ? want : holding).kg;
  if (!w) return 0;                       // build validation should prevent this
  return to === "kg" ? qty * w : qty / w;
}

/* The kitchen as a pool, so two dishes reaching for the same chicken cannot
   both be told it is already covered. Drawn down line by line. */
function pool() {
  const p = new Map();
  for (const [product, qty] of Object.entries(onHandNow())) {
    if (qty > 0) p.set(product, qty);
  }
  return p;
}

/* Take up to `need` of `want` out of the pool, preferring an exact name match
   before reaching for an equivalent. Returns what it took and what covered it. */
function draw(p, want, need) {
  let got = 0;
  const from = [];
  const order = [want, ...[...p.keys()].filter((k) => k !== want)];
  for (const holding of order) {
    if (got >= need - 1e-9) break;
    const stock = p.get(holding);
    if (!stock) continue;
    const worth = convert(stock, holding, want);
    if (worth <= 0) continue;
    const take = Math.min(worth, need - got);
    got += take;
    p.set(holding, stock - convert(take, want, holding));
    if (p.get(holding) <= 1e-9) p.delete(holding);
    from.push({ product: holding, exact: holding === want });
  }
  return { got, from };
}

/* The weight of one pack, read off the site's own wording: "à partir de 150g
   (soit 1 oignon)", "la barquette d'1.05 kg environ", "les 4 pièces de 140g -
   560 g". The last weight is the whole pack. */
function packMeasure(packaging) {
  const s = String(packaging).toLowerCase().replace(/(\d),(\d)/g, "$1.$2");
  const last = (re) => { const ms = [...s.matchAll(re)]; return ms.length ? ms[ms.length - 1] : null; };
  const m = last(/(\d+(?:\.\d+)?)\s*(kg|gr|g)(?![a-zà-ÿ])/g);
  if (m) return { kind: "mass", qty: parseFloat(m[1]) * (m[2] === "kg" ? 1000 : 1) };
  const v = last(/(\d+(?:\.\d+)?)\s*(cl|ml|l)(?![a-zà-ÿ])/g);
  if (v) return { kind: "volume", qty: parseFloat(v[1]) * (v[2] === "l" ? 1000 : v[2] === "cl" ? 10 : 1) };
  const c = s.match(/\b(?:de|les)\s+(\d+)\b/);
  return c ? { kind: "count", qty: Number(c[1]) } : null;
}
function packKg(packaging) {
  const m = packMeasure(packaging);
  return m && m.kind === "mass" ? m.qty / 1000 : null;
}

/* How many of the site's packs stand in for one of the receipt's: a box of 12
   eggs for the 20-egg box the recipes were costed on is 1.67. Only when both
   packs state the same kind of measure — a receipt cut off mid-word ("la
   plaquette de 5...") says nothing and converts nothing. */
function packRatio(receiptPack, sitePack) {
  if (!receiptPack || !sitePack || /\.\.\.$|…$/.test(receiptPack)) return 1;
  const r = packMeasure(receiptPack), s = packMeasure(sitePack);
  return r && s && r.kind === s.kind && s.qty > 0 ? r.qty / s.qty : 1;
}

/* ---------- the basket, derived from whatever is on the menu ---------- */
function basket() {
  const acc = new Map();
  // A batch dish is cooked once and eaten three times. Counting its ingredients
  // per serving bought six tins of coconut milk for one pot, so a meal flagged
  // as leftovers eats from a pot already paid for and buys nothing. A dish
  // genuinely cooked twice in a week is not flagged, and does count twice.
  //
  // A meal she has ticked either way is behind her, and nothing behind her is
  // worth shopping for: one was cooked out of the kitchen, the other never
  // happened. The difference between the two is what it did to the kitchen,
  // not what it does here.
  const toShop = meals().filter((m) => !m.leftovers && !m.done);
  for (const m of toShop) {
    for (const i of m.r.ingredients || []) {
      if (!i.buy) continue;
      let e = acc.get(i.product);
      if (!e) acc.set(i.product, (e = {
        product: i.product, amount: 0, mode: i.buy.mode, section: i.buy.section,
        guess: !!i.guess, guessPrice: i.buy.price, dishes: new Set(),
      }));
      // "sum" adds up across dishes (produce, meat); "once" is a bottle or a bag
      // that covers the week however many dishes reach for it.
      e.amount = e.mode === "sum" ? e.amount + i.buy.amount : Math.max(e.amount, i.buy.amount);
      e.dishes.add(m.r.title);
    }
  }

  // Everything the week asks for, before a word about what is in the kitchen.
  const wanted = [];
  for (const e of acc.values()) {
    wanted.push({ key: e.product, section: e.section, guess: e.guess,
                  guessPrice: e.guessPrice, required: e.amount,
                  for: [...e.dishes].join(", "), kind: "dish" });
  }
  for (const s of STAPLES) {
    wanted.push({ key: s.name, section: "Standing order", guess: !!s.guess,
                  guessPrice: s.price, required: s.quantity,
                  for: s.note || "always on the order", kind: "staple" });
  }
  for (const [key, a] of Object.entries(added)) {
    wanted.push({ key, section: "Added by you", guess: !PRICES[a.name],
                  guessPrice: 3, required: a.qty, name: a.name,
                  for: "you added this", kind: "added" });
  }

  const order = ["Proteins", "Vegetables", "Store cupboard", "Bread and cheese",
                 "Standing order", "New to you", "Best guesses", "Added by you"];
  wanted.sort((a, b) => (order.indexOf(a.section) - order.indexOf(b.section)) ||
                        a.key.localeCompare(b.key));

  // Now the kitchen. One pool, drawn down in list order, so the same half-kilo
  // of chicken cannot be counted against two different dinners.
  const p = pool();
  const lines = [];
  for (const w of wanted) {
    const name = w.name || subs[w.key] || w.key;
    const pb = PRICES[name];
    const cat = CATALOGUE[name] || null;

    // Which Méré listing this line will be pushed as. Anything the site sells
    // under another name or pack, or not at all, has no listing until she picks
    // one here — that decision is never made for her.
    const needsDecision = !!cat && (cat.status === "check" || cat.status === "missing");
    const choice = needsDecision ? choices[w.key] || null : null;
    const skipped = !!choice && choice.pick === "skip";
    const site = choice
      ? (skipped ? null : choice.pick === "listing" ? cat.listing : (cat.alternatives || [])[choice.pick] || null)
      : cat && cat.status !== "missing" ? cat.listing : null;
    const pending = needsDecision && !choice;
    const sitePrice = site && site.price != null ? site.price : null;

    const guess = (w.guess || !pb) && !site;
    const unit = guess || !pb ? "unit" : pb.unit;
    const receiptPrice = guess ? (w.guessPrice ?? 3) : pb ? pb.price : (w.guessPrice ?? 3);
    const section = w.section === "Best guesses" && !guess ? "New to you" : w.section;

    let required = qtyAdj[w.key] != null ? qtyAdj[w.key] : w.required;
    if (unit !== "kg") required = Math.max(1, Math.ceil(required));  // you cannot buy 1.4 jars

    const struck = !!dropped[w.key] || skipped;
    const { got, from } = struck ? { got: 0, from: [] } : draw(p, name, required);
    let toBuy = Math.max(0, required - got);
    if (unit !== "kg") toBuy = Math.ceil(toBuy - 1e-9);
    if (struck) toBuy = 0;

    const fmt = (n) => unit === "kg" ? n.toFixed(2).replace(".", ",") + " kg" : "x" + Math.round(n);
    // The Drive sells weighed goods by the piece or the tray, so a kilo figure
    // becomes a count of what to add. A pack with no weight on it counts as one.
    // She can change the count; that count is what gets pushed.
    // A pack that changed size is converted, so a smaller pack means more of them.
    const pk = unit === "kg" && site ? packKg(site.packaging) : null;
    const ratio = unit !== "kg" && site && pb ? packRatio(pb.pack, site.packaging) : 1;
    const addDefault = toBuy <= 0 ? 0
      : unit === "kg" ? Math.max(1, Math.round(toBuy / (pk || toBuy)))
      : Math.max(1, Math.ceil(toBuy * ratio - 0.1));
    const add = toBuy > 0 && addAdj[w.key] != null ? addAdj[w.key] : addDefault;

    // Priced the way Méré charges it — the listing's price per pack, times the
    // packs added. Only a line with no listing falls back to the receipt. Weighed
    // goods are charged on the exact weight at collection, so they stay approximate.
    const weighed = unit === "kg" || (!!site && /vrac|environ|à la coupe/i.test(site.packaging));
    const cost = toBuy <= 0 ? 0 : sitePrice != null ? sitePrice * add : receiptPrice * toBuy;
    const unitValue = unit === "kg" ? receiptPrice : (sitePrice ?? receiptPrice);
    const covered = Math.min(got, required);
    lines.push({
      key: w.key, name, section, kind: w.kind, guess, cat, site, choice, pending, skipped,
      replaces: ratio !== 1 ? pb.pack : null,
      add, addDefault, unit, price: sitePrice ?? receiptPrice, priced: sitePrice != null ? "site" : guess ? "guess" : "receipt",
      approx: sitePrice == null || weighed,
      required, covered, toBuy, struck,
      renamed: name !== w.key ? w.key : null,
      coveredBy: from, for: w.for,
      cost, coveredValue: struck ? 0 : unitValue * covered,
      amount: fmt(toBuy), requiredLabel: fmt(required), coveredLabel: fmt(covered),
    });
  }

  // Re-sorted because a guess the site has named only changes section here.
  lines.sort((a, b) => (order.indexOf(a.section) - order.indexOf(b.section)) || a.key.localeCompare(b.key));
  const buy = lines.filter((l) => l.toBuy > 0);
  const kitchen = lines.filter((l) => l.toBuy <= 0);
  return {
    lines: buy, kitchen,
    pending: buy.filter((l) => l.pending),
    total: buy.reduce((t, l) => t + l.cost, 0),
    saved: lines.reduce((t, l) => t + l.coveredValue, 0),
  };
}

/* ---------- shared state ---------- */
function setSync(kind, text) {
  const d = $("#sync-dot");
  d.className = "dot" + (kind === "live" ? " live" : kind === "off" ? " off" : "");
  $("#sync-text").textContent = text;
}

/* ---------- writing a shared document ----------
   One write in flight per document, always carrying the newest state. The db
   contract asks for exactly this — one write at a time per doc, last writer
   wins, no transactions — and two taps in quick succession broke it: each fired
   a whole-document `set`, and the two raced. The loser's snapshot arrived last
   carrying the older state, so the question she had just answered came back on
   screen, and if the server settled that way it was unanswered for good. It
   looked like a button that worked only sometimes.

   `stale()` is the other half, and serialising alone does not cover it: a
   snapshot carrying the state after the first write can still be delivered
   after the second write has landed, and adopting it would put the answered
   question back just the same. Every write stamps `updatedAt`, so a snapshot is
   only news if it was written after our own last write. Anything older is ours
   coming back late, or a change the server has already overwritten with ours.
   Anything still queued or in flight means the screen is already newer than
   whatever arrives. Before we have written at all — the first load — everything
   is news.

   That also stops the page re-rendering under her finger on its own echo, which
   is the other way a tap disappears: a node replaced between mousedown and
   mouseup fires no click at all. */
function writer(send, onError) {
  const w = {
    busy: false, dirty: false, sentAt: 0,
    pending: () => w.busy || w.dirty,
    stale: (d) => w.pending() ||
      (w.sentAt > 0 && !(Number((d || {}).updatedAt) > w.sentAt)),
    async save() {
      w.dirty = true;
      if (w.busy) return;
      w.busy = true;
      try {
        while (w.dirty) {
          w.dirty = false;
          const at = Math.max(Date.now(), w.sentAt + 1);
          w.sentAt = at;
          await send(at);
        }
      } catch (e) {
        onError(e);
      } finally {
        w.busy = false; w.dirty = false;
      }
    },
  };
  return w;
}

/* Key order is not part of a value, and the store does not promise to hand it
   back the way we sent it, so comparing raw JSON would report a change on every
   echo. */
const stable = (v) => JSON.stringify(v, (k, x) =>
  x && typeof x === "object" && !Array.isArray(x)
    ? Object.fromEntries(Object.keys(x).sort().map((kk) => [kk, x[kk]]))
    : x);
/* `updatedAt` is a stamp on the write, not part of what the page is showing. */
const sameDoc = (a, b) => stable({ ...(a || {}), updatedAt: 0 }) === stable({ ...(b || {}), updatedAt: 0 });

function weekDoc() {
  const diff = {};
  for (const k of changed()) diff[k] = picks[k];
  return {
    picks: diff, extra, qtyAdj, subs, dropped, added, addAdj, choices,
    mealDone, mealMoved, mealOff, mealAdded,
    approved, inBasket,
    // Passed through, never rewritten — see legacyRaw. On a document this page
    // wrote itself these are its own kitchen and its own receipt; on one
    // carried from an older page they are that page's, and saying so is what
    // keeps its corrections in "Still here?" instead of being believed.
    have: legacyRaw,
    seededFrom: legacySeed != null ? legacySeed : (ONHAND.from ? ONHAND.from.order : null),
  };
}
const weekWriter = writer(
  (at) => weekRef.set({ ...weekDoc(), updatedAt: at }),
  (e) => setSync("off", "Change saved on this phone only — " + (e && e.code ? e.code : "not saved")),
);
async function persist() {
  if (!weekRef) return;
  await weekWriter.save();
}

/* The kitchen is not week-scoped, so it has its own document — the same trick
   favourites use. What she says is in the fridge on Thursday is still true on
   Monday, and it is what next week's plan should be built on. */
const kitchenDoc = () => ({
  items: kitchen,
  seededFrom: ONHAND.from ? ONHAND.from.order : null,
});
const kitchenWriter = writer(
  (at) => kitchenRef.set({ ...kitchenDoc(), updatedAt: at }),
  (e) => setSync("off", "Kitchen saved on this phone only — " + (e && e.code ? e.code : "not saved")),
);
async function persistKitchen() {
  if (!kitchenRef) return;
  await kitchenWriter.save();
}

function applyRemote(d) {
  if (!d) return;
  extra = { ...extra, ...(d.extra || {}) };
  picks = { ...baseline, ...(d.picks || {}) };
  // Written by the older page, which kept the kitchen in the week. Still read,
  // so nothing she typed there is lost; the Kitchen tab writes elsewhere now.
  // Believed only if it was written against the receipt this page is seeded
  // from — a shop since means she has not seen these numbers against it.
  legacyRaw = d.have || {};
  legacySeed = d.seededFrom != null ? d.seededFrom : null;
  const sameReceipt = !ONHAND.from || String(legacySeed || "") === String(ONHAND.from.order);
  legacyHave = sameReceipt ? legacyRaw : {};
  legacyOld = sameReceipt ? {} : legacyRaw;
  mealDone = d.mealDone || {};
  mealMoved = d.mealMoved || {};
  mealOff = d.mealOff || {};
  mealAdded = d.mealAdded || {};
  qtyAdj = d.qtyAdj || {};
  subs = d.subs || {};
  dropped = d.dropped || {};
  added = d.added || {};
  addAdj = d.addAdj || {};
  choices = d.choices || {};
  approved = d.approved || null;
  inBasket = d.inBasket || {};
  renderAll();
}

(async () => {
  // Never available on the first synchronous run — render first, light up after.
  if (!(window.claude && typeof window.claude.use === "function")) {
    return setSync("off", "Preview — changes are not shared");
  }
  db = await claude.use("db");
  if (!db) return setSync("off", "Changes stay on this phone");
  weekRef = db.doc("weeks/" + plan.weekOf);
  favRef = db.doc("library/favourites");
  favRef.onSnapshot(
    (snap) => {
      if (favWriter.stale(snap.data())) return;
      const slugs = (snap.data() || {}).slugs || [];
      if (stable([...favs].sort()) === stable([...slugs].sort())) return;
      favs = new Set(slugs);
      renderAll();
    },
    () => { /* the week's own sync line already reports a failure */ },
  );
  // Outside weeks/, deliberately: what is in the fridge outlives the plan.
  kitchenRef = db.doc("library/kitchen");
  kitchenRef.onSnapshot(
    (snap) => {
      if (kitchenWriter.stale(snap.data())) return;
      const items = (snap.data() || {}).items || {};
      if (stable(items) === stable(kitchen)) return;
      kitchen = items;
      renderAll();
    },
    () => { /* the week's own sync line already reports a failure */ },
  );
  weekRef.onSnapshot(
    (snap) => {
      setSync("live", "Shared — you and your partner see the same week");
      const d = snap.data();
      if (weekWriter.stale(d)) return;
      if (d && sameDoc(d, weekDoc())) return;
      applyRemote(d);
    },
    (err) => setSync("off", "Sync stopped (" + err.code + ") — changes stay on this phone"),
  );
  // Its own document, so Claude's progress writes and her list edits can never
  // overwrite each other.
  pushRef = db.doc("push/" + plan.weekOf);
  pushRef.onSnapshot(
    (snap) => {
      const d = snap.exists ? snap.data() : null;
      if (stable(d) === stable(push)) return;
      push = d; renderAll();
    },
    (err) => { pushError = err.code || "unavailable"; renderAll(); },
  );
  db.collection("push/" + plan.weekOf + "/progress").onSnapshot(
    (qs) => {
      // A collection can come back in any order; that is not a change.
      const rows = qs.docs.map((d) => d.data());
      const byTime = (xs) => stable([...xs].sort((a, b) => stable(a).localeCompare(stable(b))));
      if (byTime(rows) === byTime(progress)) return;
      progress = rows; renderAll();
    },
    (err) => { pushError = err.code || "unavailable"; renderAll(); },
  );
  setSync("live", "Shared — you and your partner see the same week");
})();

(async () => {
  if (!(window.claude && typeof window.claude.use === "function")) return;
  sample = await claude.use("sample");
  if (sample) $("#gen-btn").hidden = false;
})();

/* ---------- cards ---------- */
/* Which appliance a dish needs. She has an air fryer, an oven, muffin tins and
   casserole dishes, so the library says which of them each dish wants. */
const KIT_ICON = {
  "air fryer": "◉", "oven": "▣", "muffin tin": "⁘",
  "casserole dish": "▭", "hob": "◍", "blender": "▽",
};

const tagClass = (t) =>
  t === "batch cook" ? " is-batch"
  : t === "fast" || t === "make ahead" || t === "no cook" ? " is-fast"
  : t === "from the freezer" ? " is-pack" : "";

function ingredientList(r) {
  return `<p class="sub">Ingredients &middot; serves ${r.serves}</p>
    <ul class="ing">${(r.ingredients || []).map((i) => `
      <li><div class="ing-row">
        <span class="ing-name">${esc(cap(i.item))}${i.guess && !(CATALOGUE[i.product] && CATALOGUE[i.product].listing) ? '<span class="flag">guess</span>' : ""}${i.pantry ? '<span class="flag pantry">have it</span>' : ""}</span>
        <span class="leader"></span><span class="ing-qty">${esc(i.qty)}</span>
      </div><div class="ing-product">${esc(i.product)}</div></li>`).join("")}</ul>`;
}

/* What happened to a meal, and where it sits now. A week she cannot correct as
   she lives it goes stale by Wednesday, and takes the kitchen list with it. */
function mealControls(o) {
  const btn = (v, label, aria) =>
    `<button type="button" data-mealdone="${esc(o.mealId)}" data-v="${v}"
             aria-pressed="${o.done === v}" aria-label="${esc(aria)}">${label}</button>`;
  return `<div class="mealctl">
      <span class="seg" role="group" aria-label="How this meal went">
        ${btn("cooked", "Cooked it", "Mark " + o.r.title + " as cooked")}
        ${btn("not-cooked", "Didn't", "Mark " + o.r.title + " as not cooked")}
      </span>
      <button class="minibtn" type="button" data-mealmove="${esc(o.mealId)}">Move</button>
      <button class="minibtn danger" type="button" data-mealoff="${esc(o.mealId)}"
              aria-label="Take ${esc(o.r.title)} off the week">Off the week</button>
    </div>`;
}

function card(o) {
  const r = o.r;
  const isPack = r.kind === "assembly";
  const state = o.done === "cooked" ? " is-done" : o.done === "not-cooked" ? " is-skipped" : "";
  return `<article class="card${o.slot === "dinner" ? "" : " is-lunch"}${state}" data-card="${esc(o.key)}">
    <div class="card-top">
      <span class="card-day">${esc(o.day ? cap(o.day) : cap(r.cuisine))}</span>
      <span class="card-slot">${esc(o.slot)}</span>
      ${o.isSwapped ? '<span class="swapped">swapped</span>' : ""}
      ${o.isAdded ? '<span class="mark is-added">you added this</span>' : ""}
      ${o.isMoved ? '<span class="mark is-moved">moved</span>' : ""}
      ${o.done === "cooked" ? '<span class="mark is-cooked">cooked</span>' : ""}
      ${o.done === "not-cooked" ? '<span class="mark is-skipped">not cooked</span>' : ""}
      <span class="leader"></span>
      <span class="card-time">${o.minutes} min</span>
      <button class="fav" type="button" data-fav="${esc(o.slug)}"
              aria-pressed="${isFav(o.slug)}"
              aria-label="${isFav(o.slug) ? "Remove" : "Add"} ${esc(r.title)} ${isFav(o.slug) ? "from" : "to"} favourites"
              title="${isFav(o.slug) ? "One of your favourites" : "Save to favourites"}">${isFav(o.slug) ? "★" : "☆"}</button>
    </div>
    <div class="card-body">
      <h3>${esc(r.title)}</h3>
      <div class="card-meta">${esc(cap(r.cuisine))} &middot; serves ${r.serves} &middot; ${r.prepMinutes} prep + ${r.cookMinutes} cook</div>
      ${(r.equipment || []).length ? `<div class="kit">${(r.equipment).map((e) => `<span class="kit-item">${KIT_ICON[e] || ""} ${esc(e)}</span>`).join("")}</div>` : ""}
      ${o.leftovers ? '<div class="tags"><span class="tag is-batch">from an earlier pot &middot; nothing to buy</span></div>' : ""}
      ${o.note ? `<p class="card-note">${esc(o.note)}</p>` : ""}
      ${isPack ? `<p class="packnote">${esc(r.packNote)}</p>` : ""}
      <p class="card-short">${esc(r.short)}</p>
      <div class="tags">${(r.tags || []).map((t) => `<span class="tag${tagClass(t)}">${esc(t)}</span>`).join("")}</div>
      ${o.served ? `<div class="served">Served: ${esc(o.served)}</div>` : ""}
      <div class="card-actions">
        <button class="expand" type="button" aria-expanded="false">
          <span>${isPack ? "What you actually cook" : "Ingredients &amp; method"}</span><span class="caret">▾</span>
        </button>
        ${o.mealId ? `<button class="btn swapbtn" type="button" data-swap="${esc(o.mealId)}">Swap</button>` : ""}
      </div>
      ${o.mealId ? mealControls(o) : ""}
      <div class="drawer"><div><div class="drawer-inner">
        ${ingredientList(r)}
        <p class="sub">${isPack ? "The part you cook" : "Method"}</p>
        <ol class="steps">${(r.steps || []).map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
      </div></div></div>
    </div>
  </article>`;
}

const groupBlock = (title, count, inner) =>
  `<div class="group-head"><h2>${esc(title)}</h2><span class="leader"></span><span class="group-count">${count}</span></div>
   <div class="cards">${inner}</div>`;

/* ---------- week tab ---------- */
const state = { order: "day", slot: "all", maxTime: 60, ings: new Set() };

function renderIngChips() {
  const list = [...new Set(meals().flatMap((m) => m.ingredients))].sort();
  $("#ingchips").innerHTML = list.map((i) =>
    `<button class="chip" type="button" data-ing="${esc(i)}" aria-pressed="${state.ings.has(i)}">${esc(cap(i))}</button>`).join("");
}

function renderWeek() {
  const list = meals().filter((m) =>
    (state.slot === "all" || m.slot === state.slot) &&
    (state.maxTime >= 60 || m.minutes <= state.maxTime) &&
    (state.ings.size === 0 || m.ingredients.some((i) => state.ings.has(i))));

  const filtered = state.slot !== "all" || state.maxTime < 60 || state.ings.size > 0;
  $("#week-count").textContent = filtered
    ? `${list.length} of ${meals().length} meals`
    : `${meals().length} meals this week`;
  $("#week-clear").hidden = !filtered;
  $("#resetweek").hidden = !weekEdited();

  const asCard = (m) => card({
    key: m.id, mealId: m.id, slug: picks[m.id], r: m.r, slot: m.slot, minutes: m.minutes,
    note: m.note, isSwapped: m.isSwapped, leftovers: m.leftovers,
    done: m.done, isAdded: m.isAdded, isMoved: m.isMoved,
    day: state.order === "day" ? null : m.day,
  });

  // How the week is actually going, and what that does to the two lists. Only
  // once she has ticked something — an untouched week has nothing to report.
  const ms = meals();
  const nCooked = ms.filter((m) => m.done === "cooked").length;
  const nSkipped = ms.filter((m) => m.done === "not-cooked").length;
  const off = offMeals();
  let head = "";
  if (nCooked || nSkipped || off.length) {
    const bits = [];
    if (nCooked) bits.push(`${nCooked} cooked`);
    if (nSkipped) bits.push(`${nSkipped} not cooked`);
    if (off.length) bits.push(`${off.length} off the week`);
    const left = ms.length - nCooked - nSkipped;
    bits.push(`${left} still to come`);
    head = `<div class="weekstate"><span>${esc(bits.join(" · "))}</span>
        <span>Anything ticked is behind you, so the basket stops shopping for it. What you cooked also comes off the kitchen list; what you didn't stays in the fridge.</span>
      </div>`;
  }

  const putBack = off.length
    ? `<details class="chipbox kitchenbox"><summary>Off the week — ${off.length} ${off.length === 1 ? "meal" : "meals"}</summary>
         <div class="kitchen-body"><ul class="bl-list">${off.map((m) => `
           <li class="bl is-kitchen"><div class="bl-row">
             <div class="bl-main">
               <div class="bl-name">${esc(all()[picks[m.id]].title)}</div>
               <div class="bl-meta"><span>${esc(cap((mealMoved[m.id] || m).day))} ${esc((mealMoved[m.id] || m).slot)}</span><span>buying nothing for it</span></div>
             </div>
           </div>
           <div class="line-ctl"><button class="minibtn" type="button" data-mealon="${esc(m.id)}">Put it back</button></div></li>`).join("")}</ul></div>
       </details>`
    : "";

  if (!list.length) {
    $("#week-out").innerHTML = head +
      `<div class="empty">${ms.length
        ? "Nothing this week matches that. Try a longer time, or clear the ingredient filters."
        : "Nothing on the week yet — add a meal, or put one back below."}</div>` + putBack;
    return;
  }

  let html = head;
  if (state.order === "day") {
    for (const d of DAYS) {
      const g = list.filter((m) => m.day === d)
                    .sort((a, b) => SLOT_ORDER.indexOf(a.slot) - SLOT_ORDER.indexOf(b.slot));
      if (g.length) html += groupBlock(cap(d), g.length + (g.length > 1 ? " meals" : " meal"), g.map(asCard).join(""));
    }
  } else if (state.order === "time") {
    const g = [...list].sort((a, b) => a.minutes - b.minutes);
    html += groupBlock("Quickest first", g[0].minutes + "–" + g[g.length - 1].minutes + " min", g.map(asCard).join(""));
  } else {
    for (const c of [...new Set(list.map((m) => m.r.cuisine))].sort()) {
      const g = list.filter((m) => m.r.cuisine === c);
      html += groupBlock(cap(c), g.length, g.map(asCard).join(""));
    }
  }
  $("#week-out").innerHTML = html + putBack;
}

function renderCuisineChips() {

function renderRecipes() {
  const lib = all();
  const servedIn = {};
  for (const p of DATA.plans) for (const m of p.meals) (servedIn[m.recipe] ??= []).push(p.label || p.weekOf);
  for (const [id, slug] of Object.entries(picks)) {
    if (mealOff[id]) continue;
    if (slug !== baseline[id]) (servedIn[slug] ??= []).push(plan.label || plan.weekOf);
  }

  const q = rstate.q.trim().toLowerCase();
  const list = Object.entries(lib).filter(([slug, r]) =>
    (rstate.slot === "all" || r.slot === rstate.slot) &&
    (rstate.cuisines.size === 0 || rstate.cuisines.has(r.cuisine)) &&
    (!rstate.favsOnly || favs.has(slug)) &&
    // any ticked appliance, not all of them — same as the cuisine chips. Ticking
    // the air fryer and the muffin tin means "show me either", not "needs both".
    (rstate.kit.size === 0 || [...rstate.kit].some((k) => (r.equipment || []).includes(k))) &&
    (!q || (r.title + " " + r.short + " " + r.cuisine + " " + (r.tags || []).join(" ") + " " +
            (r.ingredients || []).map((i) => i.item + " " + i.product).join(" ") + " " +
            (r.steps || []).join(" ")).toLowerCase().includes(q)))
    .sort((a, b) => (favs.has(b[0]) - favs.has(a[0])) || a[1].title.localeCompare(b[1].title));

  const total = Object.keys(lib).length;
  const filtered = !!q || rstate.slot !== "all" || rstate.cuisines.size > 0 ||
                   rstate.kit.size > 0 || rstate.favsOnly;
  $("#rec-count").textContent = filtered ? `${list.length} of ${total} dishes` : `${total} dishes in the library`;
  $("#rec-clear").hidden = !filtered;

  if (!list.length) {
    $("#rec-out").innerHTML = `<div class="empty">${rstate.favsOnly && !favs.size
      ? "No favourites yet — tap the star on any dish to keep it here."
      : "No dish matches that yet. The library grows every week."}</div>`;
    return;
  }
  const inner = list.map(([k, r]) => {
    const uniq = [...new Set(servedIn[k] || [])];
    return card({ key: "r-" + k, slug: k, r, day: null, slot: r.slot,
                  minutes: r.prepMinutes + r.cookMinutes,
                  served: uniq.length ? uniq.join(", ") : null });
  }).join("");
  $("#rec-out").innerHTML = `<div class="cards" style="margin-top:1.2rem">${inner}</div>`;
}

/* The receipt date, for the line that explains where "already here" came from. */
const onHandDate = () => {
  const f = ONHAND.from;
  if (!f) return "";
  const d = new Date(Date.UTC(f.date.year, f.date.month - 1, f.date.day));
  return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
};

const andList = (xs) => xs.length < 2 ? (xs[0] || "") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];

/* Why a line is not being bought, in her words rather than the model's. */
function coverReason(l) {
  if (l.skipped) return "skipped — Méré doesn't sell it as named";
  if (l.struck) return "you struck this off";
  const exact = l.coveredBy.some((c) => c.exact);
  const others = l.coveredBy.filter((c) => !c.exact).map((c) => c.product);
  const bits = [];
  if (exact) bits.push("already here");
  // The whole point of the equivalents file: say which product stood in.
  if (others.length) bits.push("covered by " + andList(others));
  return bits.join(", ") || "already here";
}

/* What the Drive site had to say about a product, the last time anyone looked. */
const checkedOn = (iso) => new Date(iso + "T12:00:00Z")
  .toLocaleDateString("en-GB", { day: "numeric", month: "long", timeZone: "UTC" });
const siteHref = (listing) => SITE + encodeURI(decodeURI(listing.url));
// Méré's produce titles carry an EU grading suffix ("- CAT. 1") that says nothing here.
const cleanTitle = (t) => String(t).replace(/\s*-\s*CAT\.\s*(?:\d|EXTRA)\s*$/i, "");
const listingName = (listing) => listing.brand.replace(/, une marque Intermarché$/, "") + " · " + cleanTitle(listing.title);

function siteFlag(cat) {
  if (!cat) return { cls: "", text: "not checked at Méré" };
  if (cat.status === "missing") return { cls: "warn", text: "not at Méré" };
  if (cat.listing && cat.listing.available === false) return { cls: "warn", text: "out of stock " + checkedOn(cat.checked) };
  if (cat.status === "check") return { cls: "", text: "check at Méré" };
  return null;
}
const flagHtml = (f) => f ? `<span class="flag${f.cls ? " " + f.cls : ""}">${esc(f.text)}</span>` : "";

const round2 = (n) => Math.round(n * 100) / 100;
const money = (l) => (l.approx ? "≈ " : "") + eur(l.cost);

/* What a line still needs before it can be pushed, or what it is known to be. */
function lineFlag(l) {
  if (l.pending) return { cls: "warn", text: l.cat.status === "missing" ? "not at Méré" : "changed at Méré" };
  if (l.site && l.site.available === false) return { cls: "warn", text: "out of stock " + checkedOn(l.cat.checked) };
  if (l.choice) return { cls: "ok", text: "your pick" };
  if (!l.cat) return { cls: "", text: l.guess ? "guess — Claude asks at push" : "not checked — Claude asks at push" };
  return null;
}

function decisionBlock(l) {
  const c = l.cat;
  const opts = [];
  if (c.status === "check" && c.listing) opts.push({ pick: "listing", li: c.listing });
  (c.alternatives || []).forEach((a, i) => opts.push({ pick: i, li: a }));
  return `<div class="decide">
      ${c.note ? `<p class="decide-note">${esc(c.note)}</p>` : ""}
      <div class="decide-opts" role="group" aria-label="What to buy for ${esc(l.name)}">
        ${opts.map((o) => {
          const out = o.li.available === false || o.li.price == null;
          return `<button class="opt" type="button" data-choice="${esc(l.key)}" data-option="${o.pick}">
            <span class="opt-name">${esc(listingName(o.li))}</span>
            <span class="opt-meta">${esc(o.li.packaging)} · ${out ? "out of stock " + esc(checkedOn(c.checked)) : eur(o.li.price)}</span>
          </button>`;
        }).join("")}
        <button class="opt opt-skip" type="button" data-choice="${esc(l.key)}" data-option="skip">
          <span class="opt-name">Skip it this week</span>
          <span class="opt-meta">nothing bought</span>
        </button>
      </div>
    </div>`;
}

function addStepper(l) {
  return `<span class="step" role="group" aria-label="How many to add at Méré">
      <button class="stepbtn" type="button" data-addstep="${esc(l.key)}" data-dir="-1" aria-label="One fewer"${l.add <= 1 ? " disabled" : ""}>−</button>
      <span class="stepval">${l.add}</span>
      <button class="stepbtn" type="button" data-addstep="${esc(l.key)}" data-dir="1" aria-label="One more">+</button>
    </span>`;
}

/* One line of the basket as it will be pushed: Méré's own name and pack first,
   because that is what lands in the real basket; the recipe's name underneath. */
function basketLine(l) {
  // Undecided, a line keeps the recipe's name: showing Méré's proposal as its
  // title would read as a choice already made.
  const li = l.pending ? null : l.site;
  const title = li ? listingName(li) : l.name;
  const meta = [];
  if (li) meta.push(esc(li.packaging) + (li.price != null ? " · " + eur(li.price) + " each" : ""));
  if (li && !l.name.toLowerCase().includes(li.title.toLowerCase())) meta.push("for " + esc(l.name));
  if (l.renamed) meta.push("instead of " + esc(l.renamed));
  if (l.replaces) meta.push(`for the recipes' ${l.toBuy} × ${esc(l.replaces.toLowerCase())}`);
  if (l.unit === "kg") meta.push("recipes need " + esc(l.amount));
  if (l.covered > 0) meta.push(esc(l.coveredLabel) + " " + esc(coverReason(l)));
  const dishes = `<div class="bl-for">${esc(l.for)}</div>`;

  return `<li class="bl${l.pending ? " is-pending" : ""}" id="line-${esc(l.key.replace(/[^\w-]/g, "_"))}">
      <div class="bl-row">
        <div class="bl-main">
          <div class="bl-name">${esc(title)}${flagHtml(lineFlag(l))}</div>
          ${meta.length ? `<div class="bl-meta">${meta.map((m) => `<span>${m}</span>`).join("")}</div>` : ""}
          ${dishes}
        </div>
        <div class="bl-cost">${money(l)}</div>
      </div>
      ${l.pending ? decisionBlock(l) : `<div class="line-ctl">
          ${addStepper(l)}
          <button class="minibtn" type="button" data-allof="${esc(l.key)}">I have it</button>
          ${l.choice ? `<button class="minibtn" type="button" data-unchoose="${esc(l.key)}">Choose again</button>` : ""}
          ${l.kind === "added" ? "" : `<button class="minibtn" type="button" data-subswap="${esc(l.key)}">Swap</button>`}
          <button class="minibtn danger" type="button" data-strike="${esc(l.key)}" aria-label="Strike ${esc(title)} off the list">✕</button>
        </div>`}
    </li>`;
}

function kitchenLine(l) {
  const action = l.skipped
    ? `<button class="minibtn" type="button" data-unchoose="${esc(l.key)}">Choose again</button>`
    : l.struck
      ? `<button class="minibtn" type="button" data-strike="${esc(l.key)}">Put it back</button>`
      : `<button class="minibtn" type="button" data-allof="${esc(l.key)}">Need it after all</button>`;
  return `<li class="bl is-kitchen">
      <div class="bl-row">
        <div class="bl-main">
          <div class="bl-name">${esc(l.name)}</div>
          <div class="bl-meta"><span>${esc(l.requiredLabel)} needed</span><span>${esc(coverReason(l))}</span></div>
        </div>
        <div class="bl-cost">—</div>
      </div>
      <div class="line-ctl">${action}</div>
    </li>`;
}

const groupBySection = (lines) => {
  const secs = [];
  for (const l of lines) {
    let s = secs.find((x) => x.name === l.section);
    if (!s) secs.push((s = { name: l.section, lines: [] }));
    s.lines.push(l);
  }
  return secs;
};

function renderShop() {
  if (approved) return renderApproved();
  const { lines, kitchen, pending, total, saved } = basket();
  const ceiling = CONF.budgetCeiling;
  const over = total > ceiling;
  const ready = lines.filter((l) => !l.pending);
  const approxCount = lines.filter((l) => l.approx).length;
  const asks = lines.filter((l) => !l.cat).length;

  let html = `<section class="hero">
      <div class="hero-top">
        <div>
          <div class="eyebrow">To add at ${esc(CONF.store || "the Drive")}</div>
          <div class="hero-total">${eur(total)}</div>
          <div class="hero-sub">${lines.length} ${lines.length === 1 ? "line" : "lines"} · ${over ? `<b class="over">${eur(total - ceiling)} over</b> your ${eur(ceiling)} ceiling` : `${eur(ceiling - total)} under your ${eur(ceiling)} ceiling`}</div>
        </div>
        <div class="hero-state${pending.length ? " is-warn" : " is-ok"}">
          <b>${pending.length ? pending.length : "✓"}</b>
          <span>${pending.length ? (pending.length === 1 ? "decision left" : "decisions left") : "ready to approve"}</span>
        </div>
      </div>
      <div class="meter"><div class="meter-bar"><div class="meter-fill${over ? " over" : ""}" style="width:${Math.min(100, (total / ceiling) * 100).toFixed(1)}%"></div></div></div>
      <p class="hero-note">Priced at Méré's current prices${approxCount ? `; ${approxCount} weighed or unpriced ${approxCount === 1 ? "line is" : "lines are"} approximate (≈)` : ""}.
        ${saved > 0.005 ? `${eur(saved)} of the week is already in the kitchen and off the list.` : ""}
        ${asks ? `${asks} ${asks === 1 ? "line has" : "lines have"} not been checked at Méré, so Claude will ask about ${asks === 1 ? "it" : "them"} during the push.` : ""}</p>
      <div class="toolbar">
        <button class="btn" id="additem">Add something</button>
        <button class="btn" id="resetshop"${shopEdited() ? "" : " hidden"}>Undo my changes</button>
      </div>
    </section>`;

  if (pending.length) {
    html += `<div class="shop-sec decide-sec">
        <div class="group-head has-icon" style="margin:0"><span class="sec-icon is-clay" aria-hidden="true">!</span><h2>Decide first</h2><span class="leader"></span><span class="group-count">${pending.length}</span></div>
        <p class="decide-lede">Méré sells these under another name or pack, or not at all. Pick what to buy — nothing is swapped without you.</p>
        <ul class="bl-list">${pending.map(basketLine).join("")}</ul>
      </div>`;
  }

  for (const s of groupBySection(ready)) {
    html += `<div class="shop-sec">
        <div class="group-head has-icon" style="margin:0">${sectionIcon(s.name)}<h2>${esc(s.name)}</h2><span class="leader"></span><span class="group-count">${eur(s.lines.reduce((a, b) => a + b.cost, 0))}</span></div>
        <ul class="bl-list">${s.lines.map(basketLine).join("")}</ul>
      </div>`;
  }
  if (!lines.length) {
    html += `<div class="empty" style="margin-top:1.2rem">Nothing left to buy — the kitchen already covers every dish on the menu.</div>`;
  }
  html += `<div class="shop-total"><span>Estimated total</span><span>${eur(total)}</span></div>`;

  if (kitchen.length) {
    html += `<details class="chipbox kitchenbox">
        <summary>Not buying — ${kitchen.length} ${kitchen.length === 1 ? "item" : "items"} already here, struck off or skipped</summary>
        <div class="kitchen-body">
          <p class="kitchen-note">What is already here comes from the Drive order collected ${esc(onHandDate())}, plus anything you have corrected by hand.</p>
          <ul class="bl-list">${kitchen.map(kitchenLine).join("")}</ul>
        </div>
      </details>`;
  }

  html += `<div class="approvebar">
      <div>
        <div class="approve-title">${pending.length ? `Decide on ${pending.length} ${pending.length === 1 ? "line" : "lines"} first` : "Approve this basket"}</div>
        <div class="approve-sub">${pending.length
          ? "Approving locks the list for pushing, so every line has to say exactly what to buy."
          : `${lines.length} lines, ${eur(total)}${over ? `, ${eur(total - ceiling)} over the ceiling` : ""}. Approving locks it and lets you push it to your Intermarché basket.`}</div>
      </div>
      <button class="btn primary" id="approve"${lines.length && !pending.length ? "" : " disabled"}>Approve</button>
    </div>`;

  const cookCount = meals().filter((m) => !m.leftovers && !m.done).length;
  html += `<div class="foot" style="margin-top:1.6rem">Built from the ${cookCount} meals still to cook this week — ${meals().length - cookCount} more come out of an earlier pot, are already behind you, or cost nothing extra. Follows every swap and every count you change.<br>${(plan.notes || []).map(esc).join("<br>")}</div>`;
  $("#shop-out").innerHTML = html;
}

/* ---------- the kitchen tab ----------
   Its own tab because this is the half of the basket she is the only source
   for. Everything else on the page is derived from a receipt, a recipe or the
   site; what is left in the fridge on Thursday night is only ever something she
   tells us. It reuses the basket's line furniture so the two read as one thing.

   ("larder" in the code only because .kitchen is already the quiz's drawn hob.) */
const STAPLE_NAMES = new Set(STAPLES.map((s) => s.name));
/* Which aisle a product sits in, so the kitchen groups the way the basket does.
   SECTION_OF is learnt from the recipes; a receipt product no dish names has
   nowhere to be filed but the cupboard. */
const larderSection = (p) =>
  SECTION_OF[p] || (STAPLE_NAMES.has(p) ? "Standing order" : "Store cupboard");
const larderStep = (p) => unitOf(p) === "kg" ? 0.1 : 1;
const fmtQty = (p, q) =>
  unitOf(p) === "kg" ? q.toFixed(2).replace(".", ",") + " kg" : "x" + Math.round(q);

const midnight = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const daysAgo = (t) => Math.round((midnight(Date.now()) - midnight(t)) / 86400000);
const whenSaid = (at) => {
  const d = daysAgo(at);
  return d <= 0 ? "today" : d === 1 ? "yesterday"
    : "on " + new Date(at).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
};
const seedAge = () => {
  if (!SEED_AT) return "";
  const d = daysAgo(SEED_AT);
  return d <= 0 ? "today" : d === 1 ? "yesterday" : d + " days ago";
};

function larderLine(l) {
  const none = l.qty <= 0;
  const meta = [l.seeded ? "from your " + esc(onHandDate() || "last") + " order" : "you put this here"];
  if (l.covers.length) meta.push("covering " + esc(andList(l.covers)));
  const note = l.said
    ? `you said ${esc(fmtQty(l.product, l.said.qty))} ${esc(whenSaid(l.said.at))}`
    : l.used
      ? `${esc(andList(l.used.dishes))} took ${esc(fmtQty(l.product, l.used.amount))} off this`
      : "";
  return `<li class="bl${none ? " is-gone" : ""}">
      <div class="bl-row">
        <div class="bl-main">
          <div class="bl-name">${esc(l.product)}</div>
          <div class="bl-meta">${meta.map((m) => `<span>${m}</span>`).join("")}</div>
          ${note ? `<div class="said${l.used && !l.said ? " is-used" : ""}">${note}</div>` : ""}
        </div>
        <div class="bl-qty${none ? " is-none" : ""}">${none ? "none" : esc(fmtQty(l.product, l.qty))}</div>
      </div>
      <div class="line-ctl">
        <span class="step${none ? " is-zero" : ""}" role="group" aria-label="How much of ${esc(l.product)} is left">
          <button class="stepbtn" type="button" data-larderstep="${esc(l.product)}" data-dir="-1" aria-label="Less"${none ? " disabled" : ""}>−</button>
          <span class="stepval">${none ? "0" : esc(fmtQty(l.product, l.qty))}</span>
          <button class="stepbtn" type="button" data-larderstep="${esc(l.product)}" data-dir="1" aria-label="More">+</button>
        </span>
        ${none ? "" : `<button class="minibtn" type="button" data-lardergone="${esc(l.product)}">All gone</button>`}
        ${l.said ? `<button class="minibtn" type="button" data-larderclear="${esc(l.product)}">${l.seeded ? "Back to the receipt" : "Take it off"}</button>` : ""}
      </div>
    </li>`;
}

function renderLarder() {
  const b = basket();
  const used = usedByCooked();
  const now = onHandNow();
  const said = Object.fromEntries(saidNow());
  const old = toConfirm();

  // What each thing here is standing in for this week, so a number she changes
  // shows its effect without her going back to the basket to look for it.
  const covers = {};
  for (const l of [...b.lines, ...b.kitchen]) {
    for (const c of l.coveredBy || []) {
      const set = covers[c.product] || (covers[c.product] = new Set());
      for (const d of String(l.for || "").split(", ")) if (d) set.add(d);
    }
  }

  const ORDER = ["Proteins", "Vegetables", "Bread and cheese", "Store cupboard",
                 "Standing order", "New to you", "Best guesses", "Added by you"];
  const rows = [...new Set([...Object.keys(haveSeed), ...Object.keys(legacyHave), ...Object.keys(said)])]
    .map((product) => ({
      product, qty: now[product] || 0, section: larderSection(product),
      seeded: haveSeed[product] != null || legacyHave[product] != null,
      said: said[product] || null, used: used[product] || null,
      covers: covers[product] ? [...covers[product]] : [],
    }))
    .sort((a, c) => (ORDER.indexOf(a.section) - ORDER.indexOf(c.section)) ||
                    a.product.localeCompare(c.product));

  const here = rows.filter((r) => r.qty > 0).length;
  let html = `<section class="hero">
      <div class="hero-top">
        <div>
          <div class="eyebrow">Already in the kitchen</div>
          <div class="hero-total">${eur(b.saved)}</div>
          <div class="hero-sub">${here} ${here === 1 ? "thing" : "things"} here · already off the list</div>
        </div>
        <div class="hero-state${old.length ? " is-warn" : " is-ok"}">
          <b>${old.length ? old.length : "✓"}</b>
          <span>${old.length ? "to confirm" : "up to date"}</span>
        </div>
      </div>
      <p class="hero-note">This is what the basket takes off. It starts at your last Drive order${
        onHandDate() ? ` — collected ${esc(onHandDate())}, ${esc(seedAge())}` : ""
      }, subtracts whatever the meals you've ticked as cooked used, and then does exactly what you say here. Your word wins over both, and it carries to next week's page.</p>
      <div class="toolbar">
        <button class="btn" id="larderadd">Add something</button>
        <button class="btn" id="resetlarder"${larderEdited() ? "" : " hidden"}>Undo what I've said</button>
      </div>
    </section>`;

  if (old.length) {
    html += `<div class="shop-sec ask-sec">
        <div class="group-head has-icon" style="margin:0"><span class="sec-icon" aria-hidden="true">?</span><h2>Still here?</h2><span class="leader"></span><span class="group-count">${old.length}</span></div>
        <p class="decide-lede">You told us about these before the ${esc(onHandDate() || "last")} order. A shop has happened since, so they count for nothing until you say — nothing here is assumed.</p>
        <ul class="bl-list">${old.map((e) => `
          <li class="bl is-ask"><div class="bl-row">
            <div class="bl-main">
              <div class="bl-name">${esc(e.product)}</div>
              <div class="bl-meta"><span>you said ${esc(fmtQty(e.product, e.qty))} ${esc(e.when)}</span></div>
            </div>
            <div class="bl-qty is-none">not counted</div>
          </div>
          <div class="line-ctl">
            <button class="minibtn" type="button" data-larderkeep="${esc(e.product)}">Still ${esc(fmtQty(e.product, e.qty))}</button>
            <button class="minibtn" type="button" data-lardergone="${esc(e.product)}">All gone</button>
          </div></li>`).join("")}</ul>
        <div class="toolbar" style="margin-top:.7rem"><button class="btn" id="larderallgone">None of it is left</button></div>
      </div>`;
  }

  for (const sec of groupBySection(rows)) {
    const n = sec.lines.filter((l) => l.qty > 0).length;
    html += `<div class="shop-sec">
        <div class="group-head has-icon" style="margin:0">${sectionIcon(sec.name)}<h2>${esc(sec.name)}</h2><span class="leader"></span><span class="group-count">${n} of ${sec.lines.length}</span></div>
        <ul class="bl-list">${sec.lines.map(larderLine).join("")}</ul>
      </div>`;
  }
  if (!rows.length) {
    html += `<div class="empty" style="margin-top:1.2rem">Nothing recorded yet. Add whatever is in the fridge and the cupboard, and the basket stops buying it twice.</div>`;
  }

  html += `<div class="foot" style="margin-top:1.6rem">Every line here is something you can correct, and both of you see the same numbers. Tick a meal as cooked on the Week tab and what it used comes off these counts — untick it and it comes back.</div>`;
  $("#larder-out").innerHTML = html;
}

/* ---------- approved: the push ---------- */
const PUSH_OPEN = ["requested", "running", "waiting"];
const pushOpen = () => { const s = pushState(); return !!s && PUSH_OPEN.includes(s.status); };
const logFor = (key) => { const s = pushState(); return (s && s.log[key]) || null; };
const LOG_DONE = ["added", "already", "unavailable", "skipped", "mismatch", "not-found"];

function logChip(entry) {
  if (!entry) return "";
  const t = {
    added: ["ok", `in basket ×${entry.qty ?? ""}`], already: ["ok", `in basket ×${entry.qty ?? ""}`],
    unavailable: ["warn", "out of stock"], "not-found": ["warn", "not found"],
    mismatch: ["warn", "didn't match — not added"], skipped: ["", "skipped"],
    asking: ["warn", "Claude is asking you"], adding: ["", "adding…"],
  }[entry.status] || ["", entry.status];
  return `<span class="flag ${t[0]}">${esc(t[1].trim())}</span>`;
}

function pushedRow(l) {
  const entry = logFor(l.key);
  const done = !!inBasket[l.key] || (entry && (entry.status === "added" || entry.status === "already"));
  const title = l.expect ? listingName(l.expect) : l.name;
  return `<li class="${done ? "is-done" : ""}">
      <button class="tickbox" type="button" data-tick="${esc(l.key)}" aria-pressed="${done}"
              aria-label="${done ? "Added" : "Mark added"}: ${esc(title)}">${done ? "✓" : ""}</button>
      <div class="drive-body">
        <div class="drive-name">${esc(title)}</div>
        <div class="drive-meta">
          <span class="drive-qty">add ${l.add}</span>
          ${l.expect ? `<span>${esc(l.expect.packaging)}</span>` : ""}
          <span>${l.approx ? "≈ " : ""}${eur(l.cost)}</span>
          ${entry ? logChip(entry) : l.url ? "" : `<span class="flag">Claude asks before adding</span>`}
        </div>
        ${entry && entry.note ? `<div class="drive-note">${esc(entry.note)}</div>` : ""}
      </div>
      <div class="drive-actions">
        ${l.url ? `<a class="copybtn" href="${esc(siteHref(l))}" target="_blank" rel="noopener" aria-label="Open ${esc(title)} at Méré">Open</a>` : ""}
      </div>
    </li>`;
}

function pushPanel(lines) {
  const push = pushState();
  const s = push ? push.status : null;
  const settled = lines.filter((l) => { const e = logFor(l.key); return e && LOG_DONE.includes(e.status); }).length;
  const pct = lines.length ? (settled / lines.length) * 100 : 0;
  const noDb = !pushRef;
  const cmd = `<div class="cmd"><code>${PUSH_COMMAND}</code><button class="copybtn" type="button" id="copycmd">Copy</button></div>`;
  const meter = `<div class="meter"><div class="meter-bar"><div class="meter-fill" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="meter-row"><span>${settled} of ${lines.length} done</span><span>${eur(approved.total)} estimated</span></div></div>`;

  if (s === "requested") return `<div class="pushpanel is-wait">
      <h3>Waiting for Claude on your PC</h3>
      <p>Open Claude on the PC where Chrome is signed in to Intermarché and run:</p>${cmd}
      <p class="small">It adds each line at Méré, then writes back here as it goes.</p>
      <div class="toolbar"><button class="btn" id="pushcancel">Cancel the push</button></div>
    </div>`;
  if (s === "running") return `<div class="pushpanel is-run">
      <h3>Filling your basket</h3>${meter}
      <p class="small">Claude is adding these at Méré now. Leave this open to follow along.</p>
    </div>`;
  if (s === "waiting") return `<div class="pushpanel is-warn">
      <h3>Claude needs you</h3>
      <p>${esc(push.question || "Answer in Claude on your PC to carry on.")}</p>${meter}
    </div>`;
  if (s === "done") {
    const diff = push.siteTotal != null ? push.siteTotal - approved.total : null;
    const issues = lines.filter((l) => { const e = logFor(l.key); return e && !["added", "already"].includes(e.status); }).length;
    return `<div class="pushpanel is-ok">
      <h3>In your Intermarché basket</h3>
      <p>${push.siteCount != null ? `${push.siteCount} items, ` : ""}${push.siteTotal != null ? `<b>${eur(push.siteTotal)}</b> on the site` : ""}${diff != null ? ` — ${Math.abs(diff) < 0.005 ? "exactly the estimate" : `${eur(Math.abs(diff))} ${diff > 0 ? "above" : "below"} the estimate`}` : ""}.
        ${issues ? `${issues} ${issues === 1 ? "line was" : "lines were"} not added — see below.` : "Every line went in."}</p>
      <p class="small">Claude does not book the slot or pay. Check the basket and confirm it yourself.</p>
      <div class="toolbar">
        <a class="btn primary" href="${esc(SITE)}/commandes/panier" target="_blank" rel="noopener">Open my basket</a>
        <button class="btn" id="pushnow">Push again</button>
      </div>
    </div>`;
  }
  const lead = s === "cancelled" ? "Push cancelled" : s === "failed" ? "The push stopped" : "Push to your Intermarché basket";
  return `<div class="pushpanel">
      <h3>${lead}</h3>
      ${s === "failed" && push.note ? `<p>${esc(push.note)}</p>` : ""}
      <p>Claude on your PC opens each product at Méré in your own Chrome, sets the count shown here, and checks the basket total against the estimate. Pushing twice never doubles anything: each count is set, not added on top. It never books a slot or pays.</p>
      <p class="small">Intermarché replaces out-of-stock items by default. To stop that, switch off “Option de remplacement de produits” on your basket page.</p>
      <div class="toolbar"><button class="btn primary" id="pushnow"${noDb ? " disabled" : ""}>Push to Intermarché</button></div>
      ${noDb ? `<p class="small">Pushing needs the published page — this copy is not connected.</p>` : ""}
      ${pushError ? `<p class="small warn">The push could not be sent (${esc(pushError)}). Try again in a moment.</p>` : ""}
    </div>`;
}

   One dialog, three jobs, so there is a single thing to close and a single set
   of open/close wiring. `sheetMode` says which. */

const priceLabel = (name) => {
  const pb = PRICES[name];
  return pb ? eur(pb.price) + (pb.unit === "kg" ? " / kg" : "") : "no price on file";
};

/* Which aisle a product belongs to, learnt from the recipes that name it. The
   pricebook itself has no sections — it is only names and prices — so this is
   what lets the swap sheet open on something useful instead of a blank search. */
const SECTION_OF = {};
for (const r of Object.values(LIB)) {
  for (const i of r.ingredients || []) {
    if (i.buy && i.buy.section && !SECTION_OF[i.product]) SECTION_OF[i.product] = i.buy.section;
  }
}

/* "beurre" should find the butter, not a shampoo that happens to contain
   "beurre de karité". Rank a name that starts with the query first, then one
   where a word starts with it, then anything containing it. */
function search(query, exclude = []) {
  const q = query.trim().toLowerCase();
  if (q.length < 2) return [];
  const scored = [];
  for (const name of Object.keys(PRICES)) {
    if (exclude.includes(name)) continue;
    const low = name.toLowerCase();
    const at = low.indexOf(q);
    if (at < 0) continue;
    const wordStart = at === 0 || /[^a-z0-9àâäçéèêëîïôöùûü]/.test(low[at - 1]);
    scored.push([at === 0 ? 0 : wordStart ? 1 : 2, at, name]);
  }
  return scored
    .sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2].localeCompare(b[2]))
    .slice(0, 40)
    .map(([, , name]) => name);
}

/* Products offered as a stand-in: the rest of the equivalence group first,
   because those are already known to be the same thing; then, with nothing
   typed, the other products this household buys from the same aisle. */
function productOptions(current, q) {
  const g = GROUP_OF[current];
  const groupNames = g ? (g.members || []).map((m) => m.name).filter((n) => n !== current) : [];
  const head = groupNames.map((n) => ({ name: n, why: g.label }));
  const sec = SECTION_OF[current];
  const rest = q.trim().length >= 2
    ? search(q, [current, ...groupNames]).map((n) => ({ name: n, why: null }))
    : Object.keys(PRICES)
        .filter((n) => n !== current && !groupNames.includes(n) && SECTION_OF[n] === sec)
        .sort((a, b) => a.localeCompare(b))
        .slice(0, 30)
        .map((n) => ({ name: n, why: sec }));
  return [...head, ...rest];
}

  if (!pushRef || !s || s.status !== "requested") return;

  catch (e) { pushError = (e && e.code) || "not saved"; renderAll(); }
