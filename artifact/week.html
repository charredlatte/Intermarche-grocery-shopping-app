d pinch the seam shut. Roll the log seam-down.","Cut into 10 with a serrated knife, sawing rather than pressing, and lay them cut-side up with a good gap between — they spread. Squash each one down slightly.","Brush the tops with almond milk and bake 18–20 minutes, until the tops are set and the edges are properly brown. The pale ones are underdone in the middle.","Cool on the tray 5 minutes; the centres firm up as they go. Freeze what you will not eat in two days, and take one out the night before or give it 30 seconds in the microwave."],"equipment":["oven"]},"sandwich-matin":{"title":"The morning baguette","cuisine":"french","slot":"breakfast","kind":"assembly","prepMinutes":6,"cookMinutes":0,"serves":2,"tags":["fast","no chilli","no cook"],"packNote":"Nothing here is cooked — the baguette, the charcuterie and the Boursin all come as they are. The only real technique is warming the bread and salting the tomatoes.","short":"The sandwich you actually eat every morning: baguette, Boursin, charcuterie, cheese and cherry tomatoes.","ingredients":[{"item":"baguette","qty":"1, split","product":"Cuit sur place Baguette La Généreuse","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"Boursin","qty":"generously","product":"Boursin Fromage à tartiner ail et fines herbes","buy":{"amount":0.4,"mode":"sum","section":"Bread and cheese"}},{"item":"mortadella","qty":"4 slices","product":"Montorsi Mortadelle","buy":{"amount":0.5,"mode":"sum","section":"Proteins"}},{"item":"cherry tomatoes","qty":"a handful, halved","product":"Petit prix Tomates cerises allongées","buy":{"amount":0.4,"mode":"sum","section":"Vegetables"}},{"item":"cheddar","qty":"2 slices","product":"Pâturages, une marque Intermarché Cheddar Les Tranchettes","buy":{"amount":0.3,"mode":"sum","section":"Bread and cheese"}},{"item":"salt and pepper","qty":"to taste","product":"already in the cupboard","pantry":true}],"steps":["Warm the baguette for 4 minutes in a hot oven if it is yesterday's. A revived crust is the difference between a sandwich and a chore.","Split it lengthways, not all the way through, so it holds together in your hand.","Boursin on the bottom half, right to the ends — it is the only thing keeping the tomatoes from soaking the bread.","Halve the cherry tomatoes, salt them on the board, and give them a minute. Salting first draws out the water that would otherwise run into the crumb.","Charcuterie in loose folds rather than flat sheets, cheese over, then the tomatoes cut-side down.","Plenty of black pepper, close, press gently, eat."],"equipment":["oven"]},"truite-amandes-poireaux":{"title":"Trout with almonds and leeks","cuisine":"french","slot":"dinner","kind":"recipe","prepMinutes":10,"cookMinutes":15,"serves":2,"tags":["fast","no chilli"],"short":"Trout crisped skin-side down, almonds browned in the pan butter. Méré only sells leeks in a jar, already cooked — which for once saves you twelve minutes.","ingredients":[{"item":"trout fillets","qty":"2","product":"Notre Sélection Filet de truite","buy":{"amount":1,"mode":"sum","section":"Proteins"}},{"item":"leek whites","qty":"1 jar, drained","product":"Parole gourmande Blancs de poireaux","buy":{"amount":1,"mode":"sum","section":"Vegetables"}},{"item":"flaked almonds","qty":"a handful","product":"Amandes effilées","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":2.2}},{"item":"lemon","qty":"half, juiced","product":"Le Choix du Primeur Citrons JAUNES","buy":{"amount":0.28,"mode":"once","section":"Vegetables"}},{"item":"potatoes","qty":"500 g, to serve","product":"Le Choix du Primeur Pomme de terre de consommation PRINCESSE AMANDINE à chair ferme avec traitement anti germinatif","buy":{"amount":1,"mode":"once","section":"Vegetables"}},{"item":"butter","qty":"a good knob","product":"already in the fridge","pantry":true}],"steps":["Potatoes on to boil first; everything else takes fifteen minutes and will not wait.","Drain the leek whites well and pat them dry, then cut them into 2 cm lengths. They come out of the jar already cooked and quite wet — dry them or they will steam in the pan instead of colouring.","Melt a knob of butter in a wide pan over medium heat and lay the leeks in cut-side down. 4 minutes, undisturbed, until the cut faces catch and go gold. That browning is the only thing you can add to a jarred vegetable, so do not skip it.","Push them to one side. Pat the trout dry, season, and lay it skin-down in the hot part of the pan. 4 minutes without touching it, until the skin lifts away cleanly by itself.","Turn, 90 seconds, then lift onto the plates.","Almonds into the pan, 1 minute until they smell toasted and go pale gold, then the lemon juice, which will hiss and lift everything off the base.","Spoon the almonds and pan juices over, leeks and potatoes alongside."],"equipment":["hob"]},"poulet-basquaise":{"title":"Poulet basquaise","cuisine":"french","slot":"dinner","kind":"recipe","prepMinutes":15,"cookMinutes":40,"serves":4,"tags":["batch cook","no chilli","dairy-free"],"short":"Chicken braised with three colours of pepper, tomato and onion until it falls off the bone. The Basque original leans on piment d'Espelette; this one does not, and does not miss it.","ingredients":[{"item":"chicken thighs","qty":"1 kg","product":"Volaé, une marque Intermarché Cuisse de poulet jaune x4","buy":{"amount":1,"mode":"sum","section":"Proteins"}},{"item":"red pepper","qty":"1","product":"Le Choix du Primeur Poivron ROUGE","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"yellow pepper","qty":"1","product":"Le Choix du Primeur Poivrons JAUNES","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"green pepper","qty":"1","product":"Le Choix du Primeur Poivrons VERTS","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"tomatoes","qty":"4, chopped","product":"Le Choix du Primeur Tomate RONDE en GRAPPE","buy":{"amount":0.5,"mode":"sum","section":"Vegetables"}},{"item":"onion","qty":"2, sliced","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.3,"mode":"sum","section":"Vegetables"}},{"item":"garlic","qty":"4 cloves","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"dry white wine","qty":"150 ml","product":"Vin blanc sec de cuisine","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":4.5}},{"item":"thyme","qty":"a few sprigs","product":"Thym frais","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.9}},{"item":"rice","qty":"to serve","product":"Taureau Ailé Riz Basmati","buy":{"amount":1,"mode":"once","section":"Store cupboard"}}],"steps":["Season the thighs and brown them skin-down in a dry casserole, 7 minutes, until the skin is properly gold. Do not crowd the pan — steam instead of colour and the whole dish stays pale.","Out onto a plate. Pour off all but a spoonful of the fat.","Onions in, 6 minutes on medium. Then all three peppers in strips, 8 minutes, until they slump and start to catch at the edges.","Garlic and thyme, 1 minute. Wine in, and scrape the base clean while it bubbles down by half.","Tomatoes in, chicken back on top with any juices, lid on, 25 minutes at a bare simmer.","Lid off for the last 5 to thicken the sauce. Taste hard for salt — peppers and tomato both swallow it.","Serve over rice. It is better the next day, so it seeds a second dinner."],"equipment":["casserole dish","hob"]},"gratin-patates-douces-chevre":{"title":"Sweet potato and goat's cheese gratin","cuisine":"french","slot":"dinner","kind":"recipe","prepMinutes":15,"cookMinutes":35,"serves":4,"tags":["batch cook","no chilli","vegetarian"],"short":"Sweet potato sliced thin, layered with goat's cheese and thyme, baked till the edges caramelise. No cream in it.","ingredients":[{"item":"sweet potatoes","qty":"1 kg","product":"Le Choix du Primeur Patates DOUCES","buy":{"amount":1,"mode":"sum","section":"Vegetables"}},{"item":"goat's cheese log","qty":"150 g","product":"Bûche de chèvre","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":2.6}},{"item":"onion","qty":"2, sliced","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.3,"mode":"sum","section":"Vegetables"}},{"item":"garlic","qty":"3 cloves","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"grated cheese","qty":"100 g","product":"Pâturages, une marque Intermarché 3 fromages râpés","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"thyme","qty":"a few sprigs","product":"Thym frais","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.9}},{"item":"rocket","qty":"to serve","product":"Saint Eloi, une marque Intermarché Roquette prête à l'emploi déjà lavée","buy":{"amount":1,"mode":"sum","section":"Vegetables"}}],"steps":["Oven to 200°C. Slice the sweet potatoes into 3 mm rounds — thinner than feels necessary, or they will still be firm when the top is done.","Soften the onions in olive oil for 8 minutes with a good pinch of salt, then stir in the garlic and thyme leaves.","Layer into a dish: sweet potato, a scatter of onion, torn goat's cheese, seasoning. Repeat, finishing with sweet potato.","Grated cheese over the top, cover with foil, 25 minutes.","Foil off, 10 minutes more, until the top is blistered and the edges have gone dark and sweet. That caramelised rim is the best part of the dish; do not pull it early.","Stand 10 minutes before cutting, and serve with the rocket dressed in oil and lemon."],"equipment":["oven"]},"omelette-champignons":{"title":"Mushroom and emmental omelette","cuisine":"french","slot":"lunch","kind":"recipe","prepMinutes":5,"cookMinutes":10,"serves":2,"tags":["fast","no chilli","vegetarian","uses eggs"],"short":"Mushrooms browned properly first, eggs barely set around them, still baveuse in the middle.","ingredients":[{"item":"eggs","qty":"5","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"chestnut mushrooms","qty":"250 g","product":"Champignons de Paris","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":2.4}},{"item":"emmental","qty":"60 g, grated","product":"Pâturages, une marque Intermarché Emmental français râpé","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}},{"item":"flat-leaf parsley","qty":"a handful","product":"Persil plat","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.1}},{"item":"salad","qty":"to serve","product":"Le Choix du Primeur Salade MACHE","buy":{"amount":1,"mode":"once","section":"Vegetables"}},{"item":"butter","qty":"a knob","product":"already in the fridge","pantry":true}],"steps":["Slice the mushrooms thickly and put them into a dry hot pan with no fat at all. They release their water; let it boil off, 4 minutes. Adding fat first makes them stew in it.","Once the pan is dry again, butter in, 2 minutes, until they are properly brown. Salt now, not before — salt early pulls out more water.","Beat the eggs with a fork just until the yolks break up. Over-beating makes a rubbery omelette.","Eggs over the mushrooms on a medium heat, and drag the setting edges into the middle with a spatula for about 90 seconds.","Emmental and parsley over one half while the top is still glossy and wet. Fold, slide onto a plate, and let the residual heat finish it."],"equipment":["hob"]},"risotto-safran":{"title":"Saffron risotto","cuisine":"italian","slot":"dinner","kind":"recipe","prepMinutes":10,"cookMinutes":25,"serves":2,"tags":["no chilli","vegetarian"],"short":"Risotto alla milanese: rice, stock, saffron, parmesan. Twenty minutes of stirring and nothing to hide behind.","ingredients":[{"item":"arborio rice","qty":"200 g","product":"Riz Arborio pour risotto","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":2.6}},{"item":"saffron","qty":"a good pinch","product":"Safran en dosettes","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":4.5}},{"item":"vegetable stock","qty":"1 litre, hot","product":"Bouillon de légumes en cubes","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.6}},{"item":"dry white wine","qty":"100 ml","product":"Vin blanc sec de cuisine","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":4.5}},{"item":"shallots","qty":"2, very finely chopped","product":"Échalotes","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":2.1}},{"item":"parmesan","qty":"50 g, grated","product":"Itinéraire des Saveurs, une marque Intermarché Parmigiano Reggiano AOP","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}},{"item":"butter","qty":"a knob, to finish","product":"already in the fridge","pantry":true}],"steps":["Steep the saffron in a ladleful of the hot stock and leave it. Adding the threads dry gives you yellow streaks instead of an evenly perfumed pot.","Soften the shallots in butter on a low heat for 5 minutes without colouring them.","Rice in, and stir it for a full 2 minutes until the grains look translucent at the edges with a white dot at the centre. This toasting is what keeps them separate later.","Wine in, stir until it has all gone.","Now a ladle of hot stock at a time, stirring, waiting until each is nearly absorbed before the next. About 18 minutes. Add the saffron stock halfway.","When the rice is tender with the faintest bite, take it off the heat, beat in the butter and parmesan hard, and let it sit 2 minutes. That final beating is what makes it creamy, not cream.","It should spread slowly on the plate. If it stands up in a mound, loosen it with another splash of stock."],"equipment":["hob"]},"carbonara-pancetta":{"title":"Carbonara, the Roman way","cuisine":"italian","slot":"dinner","kind":"recipe","prepMinutes":5,"cookMinutes":15,"serves":2,"tags":["fast","no chilli","uses eggs"],"short":"Egg yolks, pancetta, pecorino and pasta water. No cream anywhere near it — which is also why it sits well with you.","ingredients":[{"item":"pasta","qty":"200 g","product":"Pastificio Liguori Pâtes fusilli","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"pancetta","qty":"120 g, cubed","product":"Pancetta en dés","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":3.2}},{"item":"eggs","qty":"3 yolks + 1 whole","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"parmesan","qty":"60 g, finely grated","product":"Itinéraire des Saveurs, une marque Intermarché Parmigiano Reggiano AOP","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}},{"item":"black pepper","qty":"a lot","product":"already in the cupboard","pantry":true}],"steps":["Pasta into well-salted boiling water. Time it — everything else is faster than the pasta.","Pancetta into a cold pan, heat to medium, and let the fat render out for 6 minutes until the cubes are crisp. Starting cold is what gets the fat out instead of burning the outside.","Beat the yolks, the whole egg, the parmesan and an aggressive amount of black pepper into a paste in a bowl.","Scoop out a mugful of pasta water before draining. This is the one step people skip and the one that matters.","Drain the pasta, tip it into the pancetta pan OFF THE HEAT, and toss for 30 seconds so the pan cools slightly.","Now the egg mixture, and toss hard, adding pasta water a splash at a time until it turns into a glossy sauce that coats every piece. Off the heat throughout — on the heat you get scrambled egg, and there is no coming back from it."],"equipment":["hob"]},"lasagnes-legumes-ricotta":{"title":"Courgette and ricotta lasagne","cuisine":"italian","slot":"dinner","kind":"recipe","prepMinutes":20,"cookMinutes":40,"serves":4,"tags":["batch cook","no chilli","vegetarian"],"short":"Ricotta instead of béchamel — lighter, faster, and no milk sauce to split.","ingredients":[{"item":"lasagne sheets","qty":"1 box","product":"Barilla Pâtes Lasagne aux œufs - Collezione","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"ricotta","qty":"500 g","product":"Pâturages, une marque Intermarché Ricotta","buy":{"amount":2,"mode":"sum","section":"Bread and cheese"}},{"item":"courgettes","qty":"600 g, sliced","product":"Le Choix du Primeur Courgettes LONGUES","buy":{"amount":0.6,"mode":"sum","section":"Vegetables"}},{"item":"aubergine","qty":"1, cubed","product":"Le Choix du Primeur Aubergines VIOLETTES","buy":{"amount":0.4,"mode":"sum","section":"Vegetables"}},{"item":"tomato sauce","qty":"1 jar","product":"Panzani Sauce Tomates Basilic ingrédients origine naturelle","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"onion","qty":"1","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.15,"mode":"sum","section":"Vegetables"}},{"item":"garlic","qty":"3 cloves","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"grated cheese","qty":"150 g","product":"Pâturages, une marque Intermarché Emmental français râpé","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"basil","qty":"a handful","product":"Basilic frais en pot","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":2.2}}],"steps":["Oven to 190°C. Cook the courgette and aubergine hard in olive oil, in two batches so they brown rather than steam, 10 minutes in total. Crowding the pan here is what makes a watery lasagne.","Add the onion and garlic for the last 3 minutes, then the tomato sauce and a splash of water. Simmer 5 minutes.","Beat the ricotta with salt, pepper and half the basil until it is spreadable.","Layer: vegetables, sheets, ricotta spread thin, and repeat. Finish with vegetables, then the grated cheese.","40 minutes, until the top is brown and a knife goes through the sheets with no resistance.","Rest 15 minutes before cutting. Straight out of the oven it slumps; rested, it slices."],"equipment":["oven","hob"]},"puttanesca-sans-piment":{"title":"Puttanesca, without the heat","cuisine":"italian","slot":"dinner","kind":"recipe","prepMinutes":5,"cookMinutes":15,"serves":2,"tags":["fast","no chilli","dairy-free"],"short":"Anchovies melted into oil, capers, tomato. The classic carries peperoncino and olives; this one has neither — the heat for the IBS rule, the olives because Charlotte does not like them — and leans harder on the anchovy instead.","ingredients":[{"item":"pasta","qty":"200 g","product":"Pastificio Liguori Pâtes fusilli","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"anchovy fillets in oil","qty":"6","product":"Filets d'anchois à l'huile","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":2.3}},{"item":"capers","qty":"2 tbsp, rinsed","product":"Câpres au vinaigre","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.9}},{"item":"tomato sauce","qty":"1 jar","product":"Panzani Sauce Tomates Provençale ingrédients origine naturelle","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"garlic","qty":"4 cloves, sliced","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"flat-leaf parsley","qty":"a handful","product":"Persil plat","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.1}}],"steps":["Pasta on. Salt the water properly but go easy — anchovies and capers are both salty and the sauce catches up fast.","Garlic into cold olive oil over a low heat, 2 minutes, until it just turns blond. Hot oil burns it in seconds and turns the whole dish bitter.","Anchovies in, and press them with a wooden spoon. They will dissolve completely in about a minute — that is the point, and why nobody eating it will identify them.","Capers in, 1 minute, then the tomato sauce. Simmer 8 minutes.","Drain the pasta a minute early, keeping a mugful of water, and finish it in the sauce for that last minute with a splash of the water.","Parsley through at the end. Taste before you add any salt at all."],"equipment":["hob"]},"salade-roquette-parmesan-pommes":{"title":"Rocket, parmesan and green apple","cuisine":"italian","slot":"lunch","kind":"recipe","prepMinutes":8,"cookMinutes":0,"serves":2,"tags":["fast","no chilli","no cook","vegetarian"],"short":"Peppery rocket, sharp apple, salty parmesan shards and toasted pine nuts. Three minutes if the pine nuts are already done.","ingredients":[{"item":"rocket","qty":"1 bag","product":"Saint Eloi, une marque Intermarché Roquette prête à l'emploi déjà lavée","buy":{"amount":1,"mode":"sum","section":"Vegetables"}},{"item":"green apple","qty":"1, matchsticked","product":"Le Choix du Primeur Pommes GRANNY SMITH","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"parmesan","qty":"a wedge, shaved","product":"Itinéraire des Saveurs, une marque Intermarché Parmigiano Reggiano AOP","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}},{"item":"pine nuts","qty":"2 tbsp","product":"Pignons de pin","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":3.9}},{"item":"balsamic vinegar","qty":"1 tbsp","product":"Vinaigre balsamique","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":2.8}},{"item":"baguette","qty":"to serve","product":"Cuit sur place Baguette La Généreuse","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}},{"item":"olive oil, salt, pepper","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Toast the pine nuts in a dry pan for 2 minutes, shaking constantly. They go from pale to burnt in about fifteen seconds, so do not walk away.","Cut the apple into matchsticks at the last moment and toss them in a little of the balsamic, which stops them browning.","Dress the rocket with olive oil first, then a little balsamic, then salt. Oil before acid coats the leaves and stops them collapsing.","Shave the parmesan over with a peeler — shards, not gratings, so you get a proper salty hit now and then.","Pine nuts over, black pepper, and the baguette alongside."],"equipment":["hob"]},"pates-saumon-fume-citron":{"title":"Smoked salmon and lemon pasta","cuisine":"italian","slot":"dinner","kind":"recipe","prepMinutes":5,"cookMinutes":12,"serves":2,"tags":["fast","no chilli"],"short":"The salmon never sees the pan — it goes in off the heat so it stays silky instead of turning to string.","ingredients":[{"item":"pasta","qty":"200 g","product":"Pastificio Liguori Pâtes fusilli","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"smoked salmon","qty":"1 pack","product":"Petit navire Saumon fumé de Norvège","buy":{"amount":1,"mode":"sum","section":"Proteins"}},{"item":"lemon","qty":"1, zest and juice","product":"Le Choix du Primeur Citrons JAUNES","buy":{"amount":0.28,"mode":"once","section":"Vegetables"}},{"item":"ricotta","qty":"150 g","product":"Pâturages, une marque Intermarché Ricotta","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"shallots","qty":"1, finely chopped","product":"Échalotes","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":2.1}},{"item":"dill or parsley","qty":"a handful","product":"Aneth frais","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.9}}],"steps":["Pasta on. Zest the lemon before juicing it.","Soften the shallot in olive oil on a low heat, 4 minutes, no colour.","Loosen the ricotta in a bowl with the lemon zest, half the juice, black pepper and two spoonfuls of the pasta water.","Drain the pasta, keeping a mugful of water. Into the shallot pan, off the heat.","Ricotta mixture in, tossing and loosening with pasta water until it coats.","Only now tear in the salmon and fold it through the residual heat, with the herbs. Cook it properly and it seizes into salty threads; warmed like this it stays soft."],"equipment":["hob"]},"tortilla-patatas":{"title":"Tortilla de patatas","cuisine":"spanish","slot":"dinner","kind":"recipe","prepMinutes":15,"cookMinutes":30,"serves":4,"tags":["batch cook","no chilli","vegetarian","uses eggs"],"short":"Potatoes poached soft in olive oil, then set in egg. Eaten hot, warm or cold, and better on day two.","ingredients":[{"item":"potatoes","qty":"700 g","product":"Le Choix du Primeur Pomme de terre de consommation PRINCESSE AMANDINE à chair ferme avec traitement anti germinatif","buy":{"amount":1,"mode":"sum","section":"Vegetables"}},{"item":"eggs","qty":"6","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"onion","qty":"1 large, sliced thin","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"olive oil","qty":"plenty","product":"Bouton d’Or, une marque Intermarché Huile d'olive vierge extra BIO - issue de l'agriculture biologique","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"salad","qty":"to serve","product":"Le Choix du Primeur Laitue COEUR DE ROMAINE","buy":{"amount":1,"mode":"once","section":"Vegetables"}}],"steps":["Slice the potatoes thin. Into a deep pan with enough olive oil to nearly cover them and a big pinch of salt.","Cook them on a low-medium heat for 20 minutes, turning gently now and then. They should never sizzle hard or brown — you are poaching them soft, not frying them. Add the onion halfway.","Drain them through a sieve set over a bowl, and keep that oil; it is now excellent and worth cooking with all week.","Beat the eggs with salt, tip in the hot potatoes, and leave the lot to sit for 10 minutes. This soak is what makes the tortilla hold together instead of falling apart.","Two tablespoons of the reserved oil into a 24 cm non-stick pan on medium. Mixture in, and cook 5 minutes, easing the edges in with a spatula.","Cover with a plate, flip the whole thing over — commit, do not hesitate — slide it back in and give it 3 more minutes. The middle should still be a little loose."],"equipment":["hob"]},"gambas-ail-persil":{"title":"Gambas al ajillo, no chilli","cuisine":"spanish","slot":"dinner","kind":"recipe","prepMinutes":8,"cookMinutes":8,"serves":2,"tags":["fast","no chilli","dairy-free"],"short":"Prawns in garlicky oil, eight minutes start to finish. The Spanish version has a dried guindilla in it; this one has an extra clove of garlic instead.","ingredients":[{"item":"raw prawns","qty":"300 g, peeled","product":"Gambas crues décortiquées","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":7.5}},{"item":"garlic","qty":"6 cloves, sliced thin","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.15,"mode":"once","section":"Vegetables"}},{"item":"olive oil","qty":"generous","product":"Bouton d’Or, une marque Intermarché Huile d'olive vierge extra BIO - issue de l'agriculture biologique","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"flat-leaf parsley","qty":"a big handful","product":"Persil plat","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.1}},{"item":"lemon","qty":"half","product":"Le Choix du Primeur Citrons JAUNES","buy":{"amount":0.28,"mode":"once","section":"Vegetables"}},{"item":"baguette","qty":"1, for the oil","product":"Cuit sur place Baguette La Généreuse","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}}],"steps":["Pat the prawns very dry and salt them. Wet prawns steam and go rubbery.","Garlic into cold olive oil in a small pan, then bring it up to a gentle heat over 3 minutes until the slices are pale gold and the oil smells of them. Never let them brown.","Heat up, prawns in one layer, 90 seconds.","Turn them, 60 seconds more, and take the pan off as soon as they have just turned opaque. They keep cooking in the hot oil, so pull them early.","Parsley and a squeeze of lemon in, swirl once.","Straight to the table in the pan, with the baguette. The oil is the point as much as the prawns."],"equipment":["hob"]},"pisto-manchego":{"title":"Pisto with a fried egg and shaved parmesan","cuisine":"spanish","slot":"dinner","kind":"recipe","prepMinutes":15,"cookMinutes":35,"serves":4,"tags":["batch cook","no chilli","vegetarian","uses eggs"],"short":"Spain’s ratatouille — courgette, aubergine, peppers and tomato cooked right down, with a fried egg broken over it. It should be manchego on top; Méré does not sell any, so it is the parmesan already on the order, shaved the same way.","ingredients":[{"item":"courgettes","qty":"2, cubed","product":"Le Choix du Primeur Courgettes LONGUES","buy":{"amount":0.5,"mode":"sum","section":"Vegetables"}},{"item":"aubergine","qty":"1, cubed","product":"Le Choix du Primeur Aubergines VIOLETTES","buy":{"amount":0.4,"mode":"sum","section":"Vegetables"}},{"item":"red pepper","qty":"1","product":"Le Choix du Primeur Poivron ROUGE","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"yellow pepper","qty":"1","product":"Le Choix du Primeur Poivrons JAUNES","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"tomatoes","qty":"5, chopped","product":"Le Choix du Primeur Tomates RONDES CHARNUES","buy":{"amount":0.6,"mode":"sum","section":"Vegetables"}},{"item":"onion","qty":"2","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.3,"mode":"sum","section":"Vegetables"}},{"item":"garlic","qty":"4 cloves","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"olive oil","qty":"plenty — the aubergine drinks it","product":"Bouton d’Or, une marque Intermarché Huile d'olive vierge extra BIO - issue de l'agriculture biologique","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"eggs","qty":"4","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"parmesan","qty":"60 g, shaved","product":"Itinéraire des Saveurs, une marque Intermarché Parmigiano Reggiano AOP","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}},{"item":"baguette","qty":"to serve","product":"Cuit sur place Baguette La Généreuse","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}}],"steps":["Cube everything to roughly the same size. Salt the aubergine in a colander while you do the rest.","Onions in olive oil, low, 10 minutes until sweet. Peppers in, 10 minutes more.","Aubergine squeezed dry and in with a good slug more oil — aubergine drinks it and under-oiled aubergine goes leathery — 8 minutes.","Courgette and garlic, 5 minutes, then the tomatoes.","Now leave it alone on a low heat for 15 minutes, stirring rarely, until it is jammy and the oil separates out at the edges. That separation is how you know it is done; before that it is just hot vegetables.","Fry the eggs hard in olive oil so the whites go lacy and crisp at the edges.","Pisto into bowls, egg on top, parmesan shaved over, baguette to mop."],"equipment":["hob"]},"avocado-toast":{"title":"Avocado toast, properly seasoned","cuisine":"american","slot":"breakfast","kind":"recipe","prepMinutes":6,"cookMinutes":6,"serves":2,"equipment":["air fryer","hob"],"tags":["fast","no chilli","vegetarian","uses eggs"],"short":"The whole dish is seasoning. Under-salted avocado is the reason most versions of this taste of nothing.","ingredients":[{"item":"avocado","qty":"2, ripe","product":"Le Choix du Primeur Avocat AFFINE","buy":{"amount":2,"mode":"sum","section":"Vegetables"}},{"item":"bread","qty":"4 thick slices","product":"Cuit sur place Baguette La Généreuse","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"eggs","qty":"2","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"cherry tomatoes","qty":"a handful","product":"Petit prix Tomates cerises allongées","buy":{"amount":0.3,"mode":"sum","section":"Vegetables"}},{"item":"lemon","qty":"half","product":"Le Choix du Primeur Citrons JAUNES","buy":{"amount":0.28,"mode":"once","section":"Vegetables"}},{"item":"olive oil, salt, black pepper","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Bread into the air fryer at 190°C for 4 minutes, or under a grill. You want it dry and crisp right through — soft toast collapses under the avocado.","Poach or fry the eggs while it goes. Six-minute boiled works equally well if you would rather not stand over a pan.","Halve the avocados and scoop them into a bowl. Mash roughly with a fork — keep some lumps, a smooth purée is baby food.","Now season it much harder than feels right: the lemon juice, a real pinch of salt, plenty of pepper, a slug of olive oil. Taste it. Then add a bit more salt. This is the entire recipe.","Spread thickly on the toast, halved cherry tomatoes over, egg on top, one last grind of pepper."]},"pilons-airfryer-citron":{"title":"Air fryer chicken drumsticks with lemon and thyme","cuisine":"french","slot":"dinner","kind":"recipe","prepMinutes":10,"cookMinutes":25,"serves":2,"equipment":["air fryer"],"tags":["no chilli","dairy-free"],"short":"Drumsticks in the air fryer come out with skin like crackling and no oven to heat. Twenty-five minutes, one basket.","ingredients":[{"item":"chicken drumsticks","qty":"1 pack","product":"Plukon Pilons de poulet","buy":{"amount":1,"mode":"sum","section":"Proteins"}},{"item":"lemon","qty":"1","product":"Le Choix du Primeur Citrons JAUNES","buy":{"amount":0.28,"mode":"once","section":"Vegetables"}},{"item":"garlic","qty":"3 cloves, crushed","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"thyme","qty":"several sprigs","product":"Thym frais","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.9}},{"item":"potatoes","qty":"400 g, in chunks","product":"Le Choix du Primeur Pomme de terre de consommation PRINCESSE AMANDINE à chair ferme avec traitement anti germinatif","buy":{"amount":1,"mode":"once","section":"Vegetables"}},{"item":"salad","qty":"to serve","product":"Saint Eloi, une marque Intermarché Mélange de salades mâche et roquette prêt à l'emploi","buy":{"amount":1,"mode":"sum","section":"Vegetables"}}],"steps":["Dry the drumsticks with kitchen paper — genuinely dry, all over. Moisture is the only thing standing between you and crisp skin.","Toss with olive oil, salt, pepper, the crushed garlic, thyme leaves and the zest of the lemon.","Air fryer to 200°C. Drumsticks in a single layer, not touching. Stacked, they steam each other and the skin stays flabby.","18 minutes, turning once at 10. Add the potato chunks around them for the last 12, tossed in a little oil.","Check the thickest drumstick at the bone — the juices should run clear with no pink at all.","Squeeze the lemon over everything the moment it comes out, while it is hot enough to sizzle. Salad alongside."]},"frites-patates-douces-airfryer":{"title":"Air fryer sweet potato fries","cuisine":"american","slot":"lunch","kind":"recipe","prepMinutes":10,"cookMinutes":20,"serves":2,"equipment":["air fryer"],"tags":["fast","no chilli","vegetarian","dairy-free"],"short":"The cornflour is not optional — it is the only way sweet potato goes crisp instead of floppy.","ingredients":[{"item":"sweet potatoes","qty":"600 g","product":"Le Choix du Primeur Patates DOUCES","buy":{"amount":0.6,"mode":"sum","section":"Vegetables"}},{"item":"cornflour","qty":"1 tbsp","product":"Maïzena fécule de maïs","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.8}},{"item":"mayonnaise","qty":"to dip","product":"Bouton d’Or, une marque Intermarché Mayonnaise","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"garlic","qty":"1 clove, for the dip","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.05,"mode":"once","section":"Vegetables"}},{"item":"olive oil, salt","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Cut the sweet potatoes into batons about a centimetre thick. Even thickness matters more than the exact size — mixed sizes give you burnt thin ones and raw fat ones.","Soak them in cold water for 10 minutes to pull out surface starch, then dry them thoroughly. Wet chips steam.","Toss with a tablespoon of cornflour until dusty, then a tablespoon of oil. Cornflour first, oil second, or it clumps.","Air fryer 200°C, single layer, 18–20 minutes, shaking the basket twice. Cook in two batches rather than crowding it.","Salt the moment they come out, not before — salt in the basket draws water and softens them.","Stir the crushed garlic into the mayonnaise for a dip."]},"dinde-panee-airfryer":{"title":"Air fryer breaded turkey escalope","cuisine":"italian","slot":"dinner","kind":"recipe","prepMinutes":12,"cookMinutes":14,"serves":2,"equipment":["air fryer"],"tags":["fast","no chilli"],"short":"A milanese without a pan of hot oil. Parmesan in the crumb is what makes it taste of something.","ingredients":[{"item":"turkey escalopes","qty":"2 thin","product":"Volaé, une marque Intermarché Escalopes de dinde extra fines x2","buy":{"amount":0.3,"mode":"sum","section":"Proteins"}},{"item":"breadcrumbs","qty":"80 g","product":"Chapelure","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.4}},{"item":"parmesan","qty":"30 g, grated","product":"Itinéraire des Saveurs, une marque Intermarché Grana Padano AOP râpé","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}},{"item":"egg","qty":"1, beaten","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"flour","qty":"3 tbsp","product":"Top Budget Farine de blé Type 55","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"lemon","qty":"half, in wedges","product":"Le Choix du Primeur Citrons JAUNES","buy":{"amount":0.28,"mode":"once","section":"Vegetables"}},{"item":"rocket","qty":"to serve","product":"Saint Eloi, une marque Intermarché Roquette prête à l'emploi déjà lavée","buy":{"amount":1,"mode":"sum","section":"Vegetables"}}],"steps":["Three shallow plates: seasoned flour, beaten egg, and the breadcrumbs mixed with the parmesan.","Pat the escalopes dry, then flour, egg, crumb — pressing the crumb on firmly. Shake off the excess flour properly or the coating slides off in sheets.","Spray or brush both sides with oil. An air fryer will not brown a dry crumb; it just goes pale and dusty.","190°C, 7 minutes, flip, 5–7 minutes more until deep gold.","Lemon squeezed over, rocket alongside dressed in oil and salt."]},"legumes-rotis-airfryer":{"title":"Air fryer roasted vegetables with brebis","cuisine":"french","slot":"dinner","kind":"recipe","prepMinutes":10,"cookMinutes":22,"serves":2,"equipment":["air fryer"],"tags":["fast","no chilli","vegetarian"],"short":"Courgette, pepper and aubergine charred hard, then brebis crumbled over while it is still hot enough to soften.","ingredients":[{"item":"courgette","qty":"1","product":"Le Choix du Primeur Courgettes LONGUES","buy":{"amount":0.3,"mode":"sum","section":"Vegetables"}},{"item":"red pepper","qty":"1","product":"Le Choix du Primeur Poivron ROUGE","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"aubergine","qty":"1 small","product":"Le Choix du Primeur Aubergines VIOLETTES","buy":{"amount":0.3,"mode":"sum","section":"Vegetables"}},{"item":"red onion","qty":"1","product":"Le Choix du Primeur Oignons ROUGES","buy":{"amount":0.15,"mode":"sum","section":"Vegetables"}},{"item":"brebis with herbs","qty":"1 pack, crumbled","product":"Salakis Fromage 100% brebis herbes de Provence","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"balsamic vinegar","qty":"1 tbsp","product":"Vinaigre balsamique","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":2.8}},{"item":"baguette","qty":"to serve","product":"Cuit sur place Baguette La Généreuse","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}}],"steps":["Cut everything to roughly 2 cm. Bigger than you would for the oven — an air fryer moves a lot of air and small pieces dry out.","Toss with olive oil and salt, then into the basket at 200°C.","20 minutes, shaking hard every 7. You are after blackened edges in places, not an even golden colour; the charred bits are the flavour.","Tip into a warm bowl, splash the balsamic over while it steams, and toss.","Crumble the brebis over so it half melts, and eat with the baguette."]},"muffins-oeufs-legumes":{"title":"Egg and vegetable muffins","cuisine":"american","slot":"breakfast","kind":"recipe","prepMinutes":12,"cookMinutes":20,"serves":4,"equipment":["muffin tin","oven"],"tags":["batch cook","no chilli","vegetarian","uses eggs"],"short":"Twelve at a time, good cold for three days. A breakfast for the mornings you don't want another sandwich.","ingredients":[{"item":"eggs","qty":"8","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":2,"mode":"sum","section":"Proteins"}},{"item":"red pepper","qty":"1, finely diced","product":"Le Choix du Primeur Poivron ROUGE","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"courgette","qty":"1, grated and squeezed","product":"Le Choix du Primeur Courgettes LONGUES","buy":{"amount":0.25,"mode":"sum","section":"Vegetables"}},{"item":"grated cheese","qty":"100 g","product":"Pâturages, une marque Intermarché 3 fromages râpés","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"onion","qty":"1, finely chopped","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.1,"mode":"sum","section":"Vegetables"}},{"item":"flat-leaf parsley","qty":"a handful","product":"Persil plat","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.1}}],"steps":["Oven to 180°C. Oil a twelve-hole muffin tin properly, including the top surface between the holes — egg welds itself to bare metal.","Grate the courgette and squeeze it dry in a clean cloth. Skip this and you get twelve wet, collapsed pucks.","Soften the onion and pepper in a pan for 5 minutes; raw onion in the mix stays crunchy and sharp.","Beat the eggs with plenty of salt and pepper, stir in the vegetables, cheese and parsley.","Fill each hole about three-quarters. They rise like soufflés and then settle, so leave the room.","20 minutes, until puffed and just set with no wobble at the centre. Cool 5 minutes in the tin before easing them out with a knife."]},"muffins-banane-chocolat":{"title":"Banana and dark chocolate muffins","cuisine":"american","slot":"breakfast","kind":"recipe","prepMinutes":12,"cookMinutes":22,"serves":4,"equipment":["muffin tin","oven"],"tags":["batch cook","no chilli","vegetarian","uses eggs"],"short":"The blacker the bananas the better. Dairy-free — it runs on the almond milk you already buy.","ingredients":[{"item":"bananas","qty":"3, very ripe","product":"Le Choix du Primeur Bananes","buy":{"amount":0.4,"mode":"sum","section":"Vegetables"}},{"item":"flour","qty":"250 g","product":"Top Budget Farine de blé Type 55","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"sugar","qty":"100 g","product":"Daddy Sucre en poudre","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"eggs","qty":"2","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"almond milk","qty":"100 ml","product":"Bjorg Boisson végétale Lait d'amande vanille BIO","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"dark chocolate chips","qty":"100 g","product":"Vahiné Pépites de chocolat noir","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"baking powder","qty":"2 tsp","product":"Levure chimique","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.2}},{"item":"oil and a pinch of salt","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Oven to 190°C, papers in the muffin tin. Bananas that have gone black in the fruit bowl are the ones you want — they are sweeter and mash to nothing.","Mash the bananas thoroughly, then beat in the sugar, eggs, almond milk and 80 ml of oil.","Flour, baking powder and salt sifted over the top, plus the chocolate chips.","Fold it about ten times with a spatula and stop while it still looks lumpy and undermixed. Beating a muffin batter smooth develops the gluten and gives you rubber.","Divide between twelve papers, right to the top for a good dome.","22 minutes, until a skewer comes out with a crumb or two but no wet batter. Cool in the tin 5 minutes."]},"mini-quiches-muffin":{"title":"Mini quiches lorraines","cuisine":"french","slot":"lunch","kind":"recipe","prepMinutes":15,"cookMinutes":25,"serves":4,"equipment":["muffin tin","oven"],"tags":["batch cook","no chilli","uses eggs"],"short":"A whole quiche's worth in twelve, cooked in a third of the time and easy to carry.","ingredients":[{"item":"shortcrust pastry","qty":"1 roll","product":"Pâte brisée prête à dérouler","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.7}},{"item":"lardons","qty":"150 g","product":"Herta Lardons nature","buy":{"amount":1,"mode":"sum","section":"Proteins"}},{"item":"eggs","qty":"4","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"emmental","qty":"100 g, grated","product":"Pâturages, une marque Intermarché Emmental français râpé","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"onion","qty":"1","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.1,"mode":"sum","section":"Vegetables"}},{"item":"salad","qty":"to serve","product":"Le Choix du Primeur Salade MACHE","buy":{"amount":1,"mode":"once","section":"Vegetables"}},{"item":"nutmeg, salt, pepper","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Oven to 190°C. Cut twelve discs from the pastry with a glass, a good centimetre wider than the muffin holes, and press them in.","Lardons into a cold pan, heat to medium, 5 minutes until crisp. Onion into the rendered fat, 4 minutes. Drain off the fat or the quiches turn greasy.","Beat the eggs with salt, pepper and a scrape of nutmeg. No cream — the cheese carries it.","Lardons, onion and most of the emmental into the cases, then egg poured in to just below the pastry rim. Overfill them and they weld to the tin.","Rest of the cheese on top. 25 minutes, until set and golden.","Cool 5 minutes before lifting out. Good hot, better at room temperature."]},"poivrons-farcis-four":{"title":"Stuffed peppers baked with rice and beef","cuisine":"spanish","slot":"dinner","kind":"recipe","prepMinutes":20,"cookMinutes":45,"serves":4,"equipment":["oven","casserole dish","hob"],"tags":["batch cook","no chilli","dairy-free"],"short":"Peppers are on the always-welcome list and this is the best thing to do with four of them. The rice goes in raw and cooks inside the pepper.","ingredients":[{"item":"red peppers","qty":"2","product":"Le Choix du Primeur Poivron ROUGE","buy":{"amount":0.4,"mode":"sum","section":"Vegetables"}},{"item":"yellow peppers","qty":"2","product":"Le Choix du Primeur Poivrons JAUNES","buy":{"amount":0.4,"mode":"sum","section":"Vegetables"}},{"item":"beef mince","qty":"400 g","product":"Jean Rozé, une marque Intermarché Viande hachée vrac pur BŒUF 15% MG","buy":{"amount":1,"mode":"sum","section":"Proteins"}},{"item":"rice","qty":"150 g, uncooked","product":"Taureau Ailé Riz Basmati","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"tomato sauce","qty":"1 jar","product":"Panzani Sauce Tomates Provençale ingrédients origine naturelle","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"onion","qty":"1","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.15,"mode":"sum","section":"Vegetables"}},{"item":"garlic","qty":"3 cloves","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"flat-leaf parsley","qty":"a handful","product":"Persil plat","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.1}}],"steps":["Oven to 180°C. Cut the tops off the peppers and keep them; pull out the seeds and the white ribs.","Brown the mince hard in a pan, 5 minutes, without stirring much. Then the onion, 4 minutes, and the garlic.","Off the heat, stir in the raw rice, half the tomato sauce, the parsley and plenty of salt. Raw rice, not cooked — it swells inside the pepper and takes the meat juices with it. Cooked rice turns to mush.","Stand the peppers in a casserole dish, fill them about three-quarters, and put their lids back on.","Pour the rest of the sauce and 150 ml water around the base, cover the dish with foil, and bake 35 minutes.","Foil off, 10 minutes more to colour the tops. Test the rice through the side of a pepper with a knife; if it is still firm, another 5 minutes covered."]},"gratin-coquillettes-jambon":{"title":"Baked coquillettes with ham","cuisine":"french","slot":"dinner","kind":"recipe","prepMinutes":10,"cookMinutes":30,"serves":4,"equipment":["oven","casserole dish","hob"],"tags":["batch cook","no chilli"],"short":"The French childhood pasta bake, made without a béchamel — the pasta finishes cooking in the milk it bakes in.","ingredients":[{"item":"coquillettes","qty":"400 g","product":"Fiorini, une marque Intermarché Coquillettes","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"sliced ham","qty":"200 g","product":"Jambon blanc en tranches","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":2.8}},{"item":"grated cheese","qty":"200 g","product":"Pâturages, une marque Intermarché Emmental français râpé","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"onion","qty":"1","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.1,"mode":"sum","section":"Vegetables"}},{"item":"milk","qty":"400 ml","product":"Pâturages, une marque Intermarché Lait demi-écrémé stérilisé UHT BIO - issu de l'agriculture biologique,","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"salad","qty":"to serve","product":"Le Choix du Primeur Laitue FEUILLES DE CHENES BLONDE","buy":{"amount":1,"mode":"once","section":"Vegetables"}},{"item":"nutmeg, salt, pepper","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Oven to 180°C. Boil the coquillettes for 4 minutes only — half the packet time. They drink the milk in the oven and finish there; fully cooked pasta turns to paste.","Soften the onion in butter, 5 minutes.","Drain the pasta and mix in the dish with the onion, torn ham, two-thirds of the cheese, the milk, salt, pepper and a good scrape of nutmeg.","Rest of the cheese over the top.","30 minutes, until the top is brown and the edges are bubbling. If it looks wet at 25 minutes, give it another five uncovered.","Stand 5 minutes, and eat with a sharp green salad — it needs the contrast."]},"tian-provencal":{"title":"Tian provençal","cuisine":"french","slot":"dinner","kind":"recipe","prepMinutes":20,"cookMinutes":50,"serves":4,"equipment":["oven","casserole dish"],"tags":["batch cook","no chilli","vegetarian","dairy-free"],"short":"Courgette, aubergine and tomato stood on edge in a dish and baked slowly until they shrink and sweeten. Almost no work.","ingredients":[{"item":"courgettes","qty":"2","product":"Le Choix du Primeur Courgettes LONGUES","buy":{"amount":0.4,"mode":"sum","section":"Vegetables"}},{"item":"aubergine","qty":"1","product":"Le Choix du Primeur Aubergines VIOLETTES","buy":{"amount":0.35,"mode":"sum","section":"Vegetables"}},{"item":"tomatoes","qty":"4","product":"Le Choix du Primeur Tomate RONDE en GRAPPE","buy":{"amount":0.5,"mode":"sum","section":"Vegetables"}},{"item":"onion","qty":"2, sliced","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.3,"mode":"sum","section":"Vegetables"}},{"item":"garlic","qty":"4 cloves","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"thyme and rosemary","qty":"several sprigs","product":"Herbes de Provence fraîches","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.9}},{"item":"olive oil","qty":"generous","product":"Bouton d’Or, une marque Intermarché Huile d'olive vierge extra BIO - issue de l'agriculture biologique","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"rice","qty":"to serve","product":"Taureau Ailé Riz Basmati","buy":{"amount":1,"mode":"once","section":"Store cupboard"}}],"steps":["Oven to 180°C. Soften the sliced onions and garlic in olive oil for 10 minutes and spread them over the base of the dish. This layer is what stops the whole thing sticking and drying out.","Slice the courgette, aubergine and tomato into rounds of the same thickness, about 5 mm. Same thickness matters — mixed thicknesses cook unevenly and some stay raw.","Stand them on edge in tight alternating rows, packed hard against each other. They shrink a lot, and a loosely packed tian collapses into a puddle.","Salt, pepper, the herbs tucked in, and a generous pour of olive oil over the whole surface.","50 minutes. It is done when the tops are browned and the vegetables have sunk to about two-thirds of their original height.","Better warm than hot, and better still the next day. Rice or bread alongside."]},"poulet-tomates-olives-four":{"title":"Roast chicken thighs with tomatoes and lemon","cuisine":"french","slot":"dinner","kind":"recipe","prepMinutes":10,"cookMinutes":45,"serves":4,"equipment":["oven","casserole dish"],"tags":["batch cook","no chilli","dairy-free"],"short":"One dish, forty-five minutes, no stirring. The tomatoes burst and turn into the sauce by themselves.","ingredients":[{"item":"chicken thighs","qty":"1 kg","product":"Volaé, une marque Intermarché Cuisse de poulet jaune x4","buy":{"amount":1,"mode":"sum","section":"Proteins"}},{"item":"cherry tomatoes","qty":"500 g","product":"Petit prix Tomates cerises allongées","buy":{"amount":2,"mode":"sum","section":"Vegetables"}},{"item":"red onion","qty":"2, in wedges","product":"Le Choix du Primeur Oignons ROUGES","buy":{"amount":0.3,"mode":"sum","section":"Vegetables"}},{"item":"garlic","qty":"1 whole head, halved","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.12,"mode":"once","section":"Vegetables"}},{"item":"lemon","qty":"1, in wedges","product":"Le Choix du Primeur Citrons JAUNES","buy":{"amount":0.28,"mode":"once","section":"Vegetables"}},{"item":"rosemary","qty":"several sprigs","product":"Romarin frais","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.9}},{"item":"potatoes","qty":"600 g","product":"Le Choix du Primeur Pomme de terre de consommation PRINCESSE AMANDINE à chair ferme avec traitement anti germinatif","buy":{"amount":1,"mode":"sum","section":"Vegetables"}}],"steps":["Oven to 200°C. Halve the potatoes and put them in the dish with the onion wedges, the halved garlic head and the rosemary, tossed in olive oil and salt.","Dry the chicken thighs, salt the skin hard, and sit them on top — skin up, and not touching each other. Anything laid on top of them steams them.","25 minutes.","Scatter the cherry tomatoes and lemon wedges around the chicken, and give it 20 minutes more.","The tomatoes should have burst and gone jammy and the skin should be crisp. If the skin is still pale, three minutes under the grill fixes it.","Squeeze the roasted garlic cloves out of their skins and mash them into the pan juices before serving."]},"pain-perdu":{"title":"Pain perdu","cuisine":"french","slot":"breakfast","kind":"recipe","prepMinutes":5,"cookMinutes":10,"serves":2,"equipment":["hob"],"tags":["fast","no chilli","vegetarian","uses eggs"],"short":"What yesterday's baguette is for. Made with the vanilla almond milk, so there is no cow's milk in it.","ingredients":[{"item":"stale baguette","qty":"1, in thick slices","product":"Cuit sur place Baguette La Généreuse","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"eggs","qty":"3","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"almond milk","qty":"200 ml","product":"Bjorg Boisson végétale Lait d'amande vanille BIO","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"sugar","qty":"2 tbsp","product":"Daddy Sucre en poudre","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"banana","qty":"1, sliced","product":"Le Choix du Primeur Bananes","buy":{"amount":0.15,"mode":"sum","section":"Vegetables"}},{"item":"cinnamon","qty":"a good pinch","product":"Bouton d’Or, une marque Intermarché Cannelle moulue","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"butter","qty":"for the pan","product":"already in the fridge","pantry":true}],"steps":["Beat the eggs, almond milk, one tablespoon of the sugar and the cinnamon in a wide shallow dish.","Cut the baguette into 3 cm slices, on a steep angle for more surface.","Soak them for a full minute a side. Stale bread needs it; a quick dip leaves a dry core, which is the usual failure.","Butter in a pan on medium — not high. Too hot and the outside browns while the custard inside stays raw.","3 minutes a side until deep gold and puffed.","Banana over, the last of the sugar scattered on while hot."]},"oeufs-tomate-four":{"title":"Eggs baked in tomato sauce","cuisine":"italian","slot":"breakfast","kind":"recipe","prepMinutes":5,"cookMinutes":15,"serves":2,"equipment":["oven","casserole dish","hob"],"tags":["fast","no chilli","vegetarian","uses eggs"],"short":"Uova in purgatorio — normally made hot with chilli, which is exactly what we leave out. Garlic and oregano carry it instead.","ingredients":[{"item":"tomato sauce","qty":"1 jar","product":"Panzani Sauce Tomates Provençale ingrédients origine naturelle","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"eggs","qty":"4","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"garlic","qty":"3 cloves, sliced","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"parmesan","qty":"to finish","product":"Itinéraire des Saveurs, une marque Intermarché Grana Padano AOP râpé","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}},{"item":"baguette","qty":"to mop","product":"Cuit sur place Baguette La Généreuse","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"basil","qty":"a few leaves","product":"Basilic frais en pot","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":2.2}}],"steps":["Oven to 200°C. Soften the sliced garlic in olive oil in an ovenproof dish over a low heat, 2 minutes, without letting it colour.","Tomato sauce in with a splash of water, and simmer 5 minutes so it thickens slightly.","Make four wells with the back of a spoon and crack an egg into each. Deep wells — a shallow one lets the white spread across the whole surface.","Season the eggs, parmesan over the sauce but not the yolks, and into the oven.","8–10 minutes. Pull it when the whites are just set and the yolks still move when you shake the dish; they carry on cooking in the hot sauce.","Basil over, baguette to mop."]},"soupe-oignon-gratinee":{"title":"Soupe à l'oignon gratinée","cuisine":"french","slot":"lunch","kind":"recipe","prepMinutes":10,"cookMinutes":50,"serves":4,"equipment":["hob","oven","casserole dish"],"tags":["batch cook","no chilli","vegetarian"],"short":"Replaces the leek and potato soup, which Méré cannot supply. Forty minutes of browning onions and nothing else — there is no shortcut and no substitute for the time.","ingredients":[{"item":"onions","qty":"1 kg, sliced thin","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":1,"mode":"sum","section":"Vegetables"}},{"item":"baguette","qty":"1, in thick slices","product":"Cuit sur place Baguette La Généreuse","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"grated cheese","qty":"200 g","product":"Pâturages, une marque Intermarché Emmental français râpé","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"garlic","qty":"2 cloves","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"dry white wine","qty":"150 ml","product":"Vin blanc sec de cuisine","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":4.5}},{"item":"beef or vegetable stock","qty":"1.2 litres","product":"Bouillon de bœuf en cubes","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.6}},{"item":"butter","qty":"a good knob","product":"already in the fridge","pantry":true}],"steps":["Slice the onions as thinly as you can manage. A kilo looks absurd in the pan and cooks down to almost nothing.","Butter and a little oil in a wide heavy pan on medium-low. Onions in with a good pinch of salt, and now give them 40 minutes, stirring every five. This is the entire recipe. Rushed onions taste sharp and the soup never recovers.","They are ready when they are deep brown and jammy, not blond. If they catch, a splash of water lifts the fond back into them.","Garlic, 1 minute. Wine in, and scrape the base clean while it bubbles down by half.","Stock in, simmer 15 minutes, season hard.","Toast the baguette slices. Ladle the soup into ovenproof bowls, float the bread, pile the cheese on top.","Under a hot grill or in a 220°C oven until the cheese blisters and runs down the sides, about 5 minutes."]},"gamja-jorim-oeuf":{"title":"Soy-glazed potatoes with a fried egg","cuisine":"korean","slot":"dinner","kind":"recipe","prepMinutes":10,"cookMinutes":20,"serves":2,"tags":["no chilli","dairy-free","vegetarian","uses eggs"],"short":"Gamja jorim: small potato cubes simmered in soy, sugar and garlic until the liquid turns to a sticky glaze. In Korea it is a side dish and often carries gochugaru; this one has none, and a fried egg, rice and cold cucumber make it dinner.","ingredients":[{"item":"potatoes","qty":"700 g, in 2 cm cubes","product":"Le Choix du Primeur Pomme de terre de consommation PRINCESSE AMANDINE à chair ferme avec traitement anti germinatif","buy":{"amount":1,"mode":"sum","section":"Vegetables"}},{"item":"garlic","qty":"4 cloves, sliced","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"soy sauce","qty":"4 tbsp","product":"Kikkoman Sauce soja salée","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"sweet soy","qty":"2 tbsp","product":"Itinéraire des Saveurs, une marque Intermarché Saveur d'Asie - Sauce soja sucrée","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"sugar","qty":"1 tbsp","product":"Daddy Sucre en poudre","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"eggs","qty":"2","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"cucumber","qty":"half, in batons","product":"Le Choix du Primeur Concombre","buy":{"amount":1,"mode":"once","section":"Vegetables"}},{"item":"sushi rice","qty":"150 g dry","product":"Tanoshi Riz pour sushi Japonica","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"oil, water","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Rice first: rinse 150 g until the water runs almost clear, then 200 ml water, lid on, 12 minutes on low and 10 more off the heat with the lid still on.","Cut the potatoes into 2 cm cubes and rinse them in a bowl of cold water until it stops going cloudy. Drain and pat dry — the surface starch is what makes them stick and break.","A spoonful of oil in a wide pan over medium-high heat. Potatoes in, 5 minutes, turning now and then, until the edges go translucent.","Add the garlic, soy, sweet soy, sugar and 200 ml water. Bring to a lively simmer, lid half on, 10 minutes.","Lid off, heat up. Keep shaking the pan for 4 to 5 minutes as the liquid reduces to a glaze that coats every cube. Stop the moment the pan looks nearly dry — the sugar catches quickly after that.","Fry the eggs in a little oil in a second pan, whites crisp at the edges, yolks soft.","Rice into bowls, potatoes and every bit of glaze over it, an egg on each, cucumber batons alongside. The original finishes with sesame oil and seeds; there are none in the kitchen, so a thread of olive oil over the hot potatoes rounds the salt instead."],"equipment":["hob"]},"nikujaga-poulet":{"title":"Chicken and potato nikujaga","cuisine":"japanese","slot":"dinner","kind":"recipe","prepMinutes":10,"cookMinutes":30,"serves":4,"tags":["batch cook","no chilli","dairy-free"],"short":"Japan's everyday simmer: potatoes, carrot and onion cooked gently in a sweet soy broth. It is usually made with thin-sliced beef; this one uses chicken thighs, and the yakitori sauce brings the sake and mirin that would otherwise be two more bottles. Better the next day.","ingredients":[{"item":"chicken thighs","qty":"a 500 g tray, meat cut off the bone, bones kept","product":"Volaé, une marque Intermarché Cuisse de poulet jaune déjointée","buy":{"amount":0.5,"mode":"sum","section":"Proteins"}},{"item":"potatoes","qty":"600 g, in large chunks","product":"Le Choix du Primeur Pomme de terre de consommation PRINCESSE AMANDINE à chair ferme avec traitement anti germinatif","buy":{"amount":1,"mode":"sum","section":"Vegetables"}},{"item":"carrot","qty":"1, in chunks","product":"Le Choix du Primeur Carottes","buy":{"amount":0.1,"mode":"sum","section":"Vegetables"}},{"item":"onion","qty":"2, in thick wedges","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.3,"mode":"sum","section":"Vegetables"}},{"item":"ginger","qty":"a thumb, thinly sliced","product":"Gingembre frais","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.05}},{"item":"yakitori sauce","qty":"5 tbsp","product":"Itinéraire des Saveurs, une marque Intermarché Sauce Yakitori assaisonnement à base de sauce soja, saké et mirin","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"soy sauce","qty":"2 tbsp","product":"Kikkoman Sauce soja salée","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"sugar","qty":"1 tbsp","product":"Daddy Sucre en poudre","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"sushi rice","qty":"to serve","product":"Tanoshi Riz pour sushi Japonica","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"oil, water","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Take the meat off the thigh and drumstick bones with a small knife — it comes away easily if you follow the bone — and cut it into bite-size pieces. Keep the bones.","A spoonful of oil in the casserole over medium-high heat. Brown the chicken, skin side down first, 4 minutes. Add the onion wedges and ginger, 2 minutes more.","Add the potatoes and carrot and turn everything through the fat for a minute.","Pour in about 400 ml water, enough to come two-thirds of the way up, with the yakitori sauce, soy and sugar. Drop the bones in. Bring to the boil and skim off the grey foam.","Lid on but set a little ajar, and simmer gently for 20 minutes without stirring — stirring breaks the potatoes. Shake the pot once or twice instead.","Lift out the bones. Taste the broth: it should be sweet and salty in about equal measure; a splash more soy if it tastes flat.","Serve half in deep bowls with rice and some of the broth. Cool the rest and keep it in the fridge — by the next day the potatoes have drunk the broth, which is the point."],"equipment":["casserole dish","hob"]},"dinde-celeri-gingembre":{"title":"Turkey, celery and pepper stir-fry with ginger","cuisine":"chinese","slot":"dinner","kind":"recipe","prepMinutes":10,"cookMinutes":10,"serves":2,"tags":["fast","no chilli","dairy-free"],"short":"Celery is a proper stir-fry vegetable in China: sliced on the diagonal it stays crisp and turns sweet in a hot pan. Here with turkey, red pepper, ginger and garlic, glossed with soy and sweet soy. Many versions add dried chillies; this one leaves them out.","ingredients":[{"item":"turkey escalope","qty":"260 g, in thin strips","product":"Le Gaulois Escalope de dinde","buy":{"amount":0.26,"mode":"sum","section":"Proteins"}},{"item":"celery","qty":"3 stalks, sliced thin on the diagonal","product":"Le Choix du Primeur Céleri BRANCHE VERT","buy":{"amount":0.3,"mode":"sum","section":"Vegetables"}},{"item":"red pepper","qty":"1, in strips","product":"Le Choix du Primeur Poivron ROUGE","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"garlic","qty":"3 cloves, sliced","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"ginger","qty":"a thumb, in matchsticks","product":"Gingembre frais","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.05}},{"item":"soy sauce","qty":"3 tbsp","product":"Kikkoman Sauce soja salée","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"sweet soy","qty":"1 tbsp","product":"Itinéraire des Saveurs, une marque Intermarché Saveur d'Asie - Sauce soja sucrée","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"sugar","qty":"a pinch","product":"Daddy Sucre en poudre","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"sushi rice","qty":"150 g dry","product":"Tanoshi Riz pour sushi Japonica","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"oil","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Rice on first: rinse 150 g until the water runs almost clear, 200 ml water, lid on, 12 minutes on low, 10 off the heat.","Toss the turkey strips with 1 tbsp of the soy and the pinch of sugar, and leave them while you cut the vegetables.","Get a wide pan very hot with a spoonful of oil. Turkey in a single layer, 90 seconds without moving it, turn, 1 minute more — only just cooked. Out onto a plate.","A little more oil in the same pan: celery and pepper, 3 minutes, tossing. They should still snap.","Garlic and ginger, 30 seconds, until they smell sharp and sweet.","Turkey back in with its juices, then the rest of the soy and the sweet soy down the hot side of the pan so they sizzle. Toss for a minute until everything is glossy, and serve over the rice."],"equipment":["hob"]},"onigirazu-mortadelle":{"title":"Mortadella, cheddar and cucumber onigirazu","cuisine":"japanese","slot":"lunch","kind":"recipe","prepMinutes":10,"cookMinutes":15,"serves":1,"tags":["make ahead","no chilli"],"short":"Onigirazu is the onigiri you don't have to shape: rice, filling and more rice folded into a sheet of nori like an envelope, then cut in half. Mortadella and cheddar are not Japanese, but ham-and-cheese onigirazu is a lunchbox classic there, and it keeps until lunchtime.","ingredients":[{"item":"sushi rice","qty":"150 g dry","product":"Tanoshi Riz pour sushi Japonica","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"nori","qty":"2 sheets","product":"Tanoshi Feuilles d'algues nori grillées pour sushi","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"mortadella","qty":"4 slices","product":"Montorsi Mortadelle","buy":{"amount":0.5,"mode":"sum","section":"Proteins"}},{"item":"cheddar","qty":"2 thin slices","product":"Maddy's Cheddar rouge mature","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}},{"item":"cucumber","qty":"a third, thinly sliced","product":"Le Choix du Primeur Concombre","buy":{"amount":1,"mode":"once","section":"Vegetables"}},{"item":"mâche","qty":"a small handful","product":"Le Choix du Primeur Salade MACHE","buy":{"amount":1,"mode":"once","section":"Vegetables"}},{"item":"soy sauce","qty":"a few drops","product":"Kikkoman Sauce soja salée","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"salt","qty":"a pinch","product":"already in the cupboard","pantry":true}],"steps":["Rinse the rice until the water runs almost clear, cook it with 200 ml water, lid on, 12 minutes on low and 10 off the heat. Season with a pinch of salt and let it cool until you can handle it.","Lay a sheet of nori shiny side down on a board, turned so it sits in front of you like a diamond.","Wet your hands. Spread a quarter of the rice in a square about 10 cm across in the middle of the sheet — an even layer, not pressed hard.","On the rice: a few mâche leaves, 2 slices of mortadella folded to fit the square, a slice of cheddar, cucumber slices and a few drops of soy. Then another quarter of the rice on top, patted into the same square.","Fold the four corners of the nori over the top one after another, like closing an envelope, dampening the last corner so it sticks. Turn it seam side down. Make the second one the same way.","Leave them 5 minutes for the nori to soften and seal, then cut each in half through the middle with a wet knife. Pack them cut side up; they keep until lunchtime without the fridge."],"equipment":["hob"]},"ramen-froid-concombre":{"title":"Cold teriyaki ramen salad with smashed cucumber","cuisine":"japanese","slot":"lunch","kind":"recipe","prepMinutes":10,"cookMinutes":5,"serves":1,"tags":["fast","no chilli","dairy-free"],"short":"Hiyashi ramen is Japan's summer noodle: cooked, chilled and piled with cold, crisp things. The precooked teriyaki ramen brings its own sauce; yakitori, ginger and a small splash of balsamic — standing in for the rice vinegar Méré does not sell — turn it into a dressing, and a smashed cucumber does the rest.","ingredients":[{"item":"ramen noodles","qty":"half the pack, with half its sauce sachet","product":"Tanoshi Nouilles ramen précuites au poulet teriyaki","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"cucumber","qty":"half","product":"Le Choix du Primeur Concombre","buy":{"amount":1,"mode":"once","section":"Vegetables"}},{"item":"carrot","qty":"1, in ribbons","product":"Le Choix du Primeur Carottes","buy":{"amount":0.1,"mode":"sum","section":"Vegetables"}},{"item":"yellow pepper","qty":"half, in thin strips","product":"Le Choix du Primeur Poivrons JAUNES","buy":{"amount":0.1,"mode":"sum","section":"Vegetables"}},{"item":"yakitori sauce","qty":"1 tbsp","product":"Itinéraire des Saveurs, une marque Intermarché Sauce Yakitori assaisonnement à base de sauce soja, saké et mirin","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"balsamic vinegar","qty":"1 tsp","product":"Vinaigre balsamique","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.54}},{"item":"ginger","qty":"a small piece, grated","product":"Gingembre frais","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.05}},{"item":"sugar","qty":"a pinch","product":"Daddy Sucre en poudre","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"olive oil, salt","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Lay the cucumber on a board and press down hard along its length with the flat of a big knife until it cracks open. Break it into bite-size pieces with your hands, toss with a pinch of salt and a pinch of sugar, and leave it in a sieve for 10 minutes.","Loosen the noodles under the hot tap, then into boiling water for 1 minute. Drain and run them under cold water until they are completely cold. Drain well.","Dressing: half the sauce sachet from the noodles, the yakitori sauce, the balsamic, the grated ginger and a teaspoon of olive oil. Stir.","Toss the noodles through the dressing. Pile the carrot ribbons, pepper strips and drained cucumber on top. It holds in a lunchbox, dressing and all, for a morning."],"equipment":["hob"]},"patatas-a-lo-pobre":{"title":"Patatas a lo pobre with a fried egg","cuisine":"spanish","slot":"dinner","kind":"recipe","prepMinutes":10,"cookMinutes":20,"serves":2,"tags":["no chilli","dairy-free","vegetarian","uses eggs"],"short":"Andalusia's poor man's potatoes: potatoes, onion and peppers cooked slowly in olive oil until soft and sweet, with a fried egg broken over them. No chorizo, no guindilla — just the vegetables, garlic and a pinch of sweet paprika.","ingredients":[{"item":"potatoes","qty":"600 g, thinly sliced","product":"Le Choix du Primeur Pomme de terre de consommation PRINCESSE AMANDINE à chair ferme avec traitement anti germinatif","buy":{"amount":1,"mode":"sum","section":"Vegetables"}},{"item":"onion","qty":"1 large, sliced","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.15,"mode":"sum","section":"Vegetables"}},{"item":"red pepper","qty":"1, in strips","product":"Le Choix du Primeur Poivron ROUGE","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"yellow pepper","qty":"1, in strips","product":"Le Choix du Primeur Poivrons JAUNES","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"garlic","qty":"3 cloves, sliced","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"olive oil","qty":"6 tbsp — it is the cooking medium","product":"Bouton d’Or, une marque Intermarché Huile d'olive vierge extra BIO - issue de l'agriculture biologique","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"sweet paprika","qty":"a pinch","product":"Bouton d’Or, une marque Intermarché Paprika doux moulu","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"eggs","qty":"2","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"salt","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Slice the potatoes about 3 mm thick, rinse them, and dry them well in a clean tea towel.","Warm the olive oil in a wide frying pan or the casserole over medium heat. Add the potatoes and onion, salt them, and turn to coat. Lid on, 10 minutes, turning once — they should soften, not brown.","Add the peppers and garlic, take the lid off and turn the heat up a notch. 10 minutes more, turning every few minutes, until the potatoes are tender and catching gold at the edges and the peppers have collapsed.","Push everything to one side and fry the eggs in the oil in the clear space, spooning the hot oil over the whites until they crisp at the edges.","A pinch of sweet paprika over the potatoes, check the salt, and an egg on top of each plate. Break the yolk into the potatoes as you eat."],"equipment":["hob"]},"dinde-pancetta-romarin":{"title":"Turkey wrapped in pancetta with rosemary and lemon","cuisine":"italian","slot":"dinner","kind":"recipe","prepMinutes":8,"cookMinutes":12,"serves":2,"tags":["fast","no chilli","dairy-free"],"short":"Saltimbocca, adapted to the kitchen: turkey escalopes flattened, wrapped in pancetta with rosemary where the original has sage and prosciutto, seared crisp and finished with lemon and a spoon of water for a quick pan sauce. Garlicky broccoli alongside.","ingredients":[{"item":"turkey escalope","qty":"2 escalopes, about 280 g","product":"Le Gaulois Escalope de dinde","buy":{"amount":0.28,"mode":"sum","section":"Proteins"}},{"item":"pancetta","qty":"6 slices","product":"Pancetta en dés","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":3.15}},{"item":"rosemary","qty":"a pinch of needles","product":"Romarin frais","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.74}},{"item":"lemon","qty":"half","product":"Le Choi
