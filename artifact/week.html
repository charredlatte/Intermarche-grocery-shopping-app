async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { /* blocked in some frames */ }
  if (!ok) {
    // Clipboard access is not guaranteed inside the artifact frame; selecting
    // the text still lets her copy it by hand.
    const el = btn.parentElement.querySelector("code");
    const r = document.createRange(); r.selectNodeContents(el);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }
  btn.textContent = ok ? "Copied" : "Selected";
  btn.classList.add("did");
  setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("did"); }, 1600);
}

/* ---------- generating a new dish ---------- */
function generatePrompt(meal) {
  const c = CONF.constraints;
  const products = Object.keys(PRICES).join("\n");
  const already = Object.values(all()).map((r) => r.title).join("; ");
  return `Invent one ${meal.slot} dish for a household of two in France who shop at Intermarché.

HARD RULES, no exceptions:
- No chilli, no capsaicin, nothing hot. ${c.bannedReason}
- Minimise ${c.limited.join(", ")}. ${c.limitedReason} Cheese is fine. Coconut milk is fine.
- It must be a dish that is genuinely COOKED. Never a recipe for reheating a ready-made or frozen product.
- Total time at most ${meal.slot === "dinner" ? c.maxWeeknightMinutes + 15 : 20} minutes.
- Do not repeat any of these existing dishes: ${already}

Every ingredient that must be bought needs a "product" chosen EXACTLY, character for character, from this list of things they actually buy. If nothing in the list fits, set "guess": true and give buy.price as a euro estimate.

${products}

Reply with JSON only, this exact shape:
{"title":"","cuisine":"italian|french|spanish|greek|japanese|chinese|thai|vietnamese|indian",
 "slot":"${meal.slot}","kind":"recipe","prepMinutes":0,"cookMinutes":0,"serves":${meal.slot === "dinner" ? 2 : 1},
 "tags":["no chilli"],"short":"one sentence a cook can read at the hob",
 "ingredients":[{"item":"plain name","qty":"how much","product":"exact name from the list",
   "buy":{"amount":0.3,"mode":"sum","section":"Proteins|Vegetables|Store cupboard|Bread and cheese"}}],
 "steps":["numbered method, 4 to 7 steps, specific about heat and timing"]}

buy.mode is "sum" for produce and meat, "once" for a bottle or bag that lasts the week. Omit "buy" entirely for salt, pepper, oil or eggs.`;
}

function sanitise(r, slot) {
  if (!r || typeof r !== "object" || !r.title || !Array.isArray(r.steps)) throw new Error("shape");
  r.slot = slot;
  r.kind = "recipe";
  r.serves = r.serves || (slot === "dinner" ? 2 : 1);
  r.prepMinutes = +r.prepMinutes || 10;
  r.cookMinutes = +r.cookMinutes || 15;
  r.tags = Array.isArray(r.tags) ? r.tags : [];
  if (!r.tags.includes("no chilli")) r.tags.push("no chilli");
  r.tags.push("invented");
  r.short = r.short || "";
  r.ingredients = (r.ingredients || []).map((i) => {
    const o = { item: String(i.item || "something"), qty: String(i.qty || ""), product: String(i.product || "") };
    if (i.buy && i.buy.amount != null) {
      const known = !!PRICES[o.product];
      o.guess = !known;
      o.buy = {
        amount: +i.buy.amount || 1,
        mode: i.buy.mode === "once" ? "once" : "sum",
        section: i.buy.section || (known ? "Store cupboard" : "Best guesses"),
      };
      // A product the pricebook has never seen still has to cost something, or
      // the basket would quietly under-report.
      if (!known) { o.buy.price = +i.buy.price || 3; o.buy.section = "Best guesses"; }
    } else o.pantry = true;
    return o;
  });
  return r;
}

async function generate() {
  if (!sample || !swapTarget) return;
  const meal = mealById(swapTarget);
  const btn = $("#gen-btn");
  btn.disabled = true;
  $("#gen-state").innerHTML = `<div class="genstate">Asking Claude for something new… this takes a few seconds.</div>`;
  try {
    const raw = await sample.json(generatePrompt(meal), { modelTier: "default" });
    const r = sanitise(raw, meal.slot);
    const slug = "new-" + r.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) + "-" + Date.now().toString(36).slice(-4);
    extra[slug] = r;
    $("#sheet").close();
    setPick(swapTarget, slug);
  } catch (e) {
    const code = e && e.code ? e.code : "failed";
    $("#gen-state").innerHTML = `<div class="genstate err">${esc(
      code === "not_granted" ? "Claude isn't available on this view — pick from the list instead."
      : code === "rate_limited" ? "Too many requests just now. Try again in a minute."
      : "That didn't come back usable. Try again, or pick from the list.")}</div>`;
  } finally {
    btn.disabled = false;
  }
}


/* ================= the quiz =================
   Modelled on the flow Charlotte pointed at: one question a screen, a segmented
   progress bar, pastel cards that saturate with a tick when chosen, and a single
   green button that stays pale until the answer is valid. Her palette, that
   structure.

   It answers the question the tabs never did — "what can I actually cook
   tonight" — from the time she has, the appliance she feels like using, the mood
   she is in, and what is already in the kitchen. */

const QUIZ_STEPS = ["time", "kit", "mood", "have", "count"];
let qStep = 0;
let quiz = { time: null, kit: new Set(), mood: new Set(), have: new Set(), count: null };
let qResults = null;

const TIME_CHOICES = [
  { v: 15, emoji: "⚡", label: "15 min", tone: "clay" },
  { v: 30, emoji: "🕐", label: "30 min", tone: "yuzu" },

/* Moods map onto what the library actually records, so a pick really does filter
   rather than just looking good. */
const MOODS = [
  { id: "fast",       emoji: "⚡", label: "Speedy",     tone: "clay", match: (r) => (r.tags || []).includes("fast") },
  { id: "veg",        emoji: "🥗", label: "Veggie",     tone: "herb", match: (r) => (r.tags || []).includes("vegetarian") },
  { id: "batch",      emoji: "🍲", label: "Batch cook", tone: "herb", match: (r) => (r.tags || []).includes("batch cook") },
  { id: "asia",       emoji: "🍜", label: "Asian",      tone: "yuzu", match: (r) => ["japanese","korean","chinese","thai","vietnamese","indian"].includes(r.cuisine) },
  { id: "europe",     emoji: "🥖", label: "European",   tone: "yuzu", match: (r) => ["french","italian","spanish","greek"].includes(r.cuisine) },
  { id: "protein",    emoji: "💪", label: "Protein",    tone: "clay", match: (r) => (r.ingredients || []).some((i) => i.buy && i.buy.section === "Proteins") },
];

/* The ingredients worth offering: what the library actually cooks with most,
   with the ones already in the kitchen marked and floated to the front. */
function ingredientChoices() {
  const count = new Map();
  const product = new Map();
  for (const r of Object.values(all())) {
    for (const i of r.ingredients || []) {
      if (!i.buy) continue;
      const k = i.item.toLowerCase();
      count.set(k, (count.get(k) || 0) + 1);
      if (!product.has(k)) product.set(k, i.product);
    }
  }
  const kit = onHandNow();
  const hasIt = (k) => {
    const p = product.get(k);
    if (kit[p] > 0) return true;
    const g = GROUP_OF[p];
    return !!(g && (g.members || []).some((m) => kit[m.name] > 0));
  };
  return [...count.entries()]
    .filter(([, n]) => n >= 2)
    .map(([k, n]) => ({ item: k, n, have: hasIt(k) }))
    .sort((a, b) => (b.have - a.have) || (b.n - a.n) || a.item.localeCompare(b.item))
    .slice(0, 30);
}

/* ---------- scoring ---------- */
function rankDishes() {
  const lib = all();
  const out = [];
  for (const [slug, r] of Object.entries(lib)) {
    if (r.slot === "breakfast" && quiz.count > 2) continue;   // breakfast is the sandwich
    const mins = r.prepMinutes + r.cookMinutes;
    if (quiz.time && mins > quiz.time) continue;
    if (quiz.kit.size && !(r.equipment || []).some((e) => quiz.kit.has(e))) continue;

    let score = 0;
    const why = [];
    for (const m of MOODS) {
      if (quiz.mood.has(m.id) && m.match(r)) { score += 3; why.push(m.label.toLowerCase()); }
    }
    const items = (r.ingredients || []).map((i) => i.item.toLowerCase());
    const hits = [...quiz.have].filter((h) => items.includes(h));
    score += hits.length * 4;
    if (hits.length) why.push(hits.length + " you have");
    if (favs.has(slug)) { score += 2; why.push("a favourite"); }
    if (quiz.time && quiz.time < 999 && mins <= quiz.time - 10) { score += 1; }
    // nudge towards things not already on the menu this week
    if (Object.values(picks).includes(slug)) score -= 2;
    out.push({ slug, r, mins, score, why });
  }
  return out.sort((a, b) => b.score - a.score || a.mins - b.mins);
}

/* ---------- render ---------- */
function renderCook() {
  if (qResults) return renderResults();
  const step = QUIZ_STEPS[qStep];
  let title = "", sub = "", body = "", cta = "continue", ok = false;

  if (step === "time") {
    title = "how long have you got?";
    sub = "Total, including the chopping.";
    body = `<div class="q-grid">${TIME_CHOICES.map((t) => qCard({
      key: t.v, on: quiz.time === t.v, emoji: t.emoji, label: t.label, tone: t.tone, kind: "time",
    })).join("")}</div>`;
    ok = quiz.time != null;
  }

  if (step === "kit") {
    title = "what do you want to cook in?";
    sub = "Tap what you feel like using. Nothing tapped means anything goes.";
    body = kitchenSVG() + `<p class="q-tally">${quiz.kit.size} selected</p>`;
    ok = true;
  }

  if (step === "mood") {
    title = "what are you in the mood for?";
    sub = "";
    body = `<p class="q-hint">pick up to 3</p>
      <div class="q-grid">${MOODS.map((m) => qCard({
        key: m.id, on: quiz.mood.has(m.id), emoji: m.emoji, label: m.label, tone: m.tone, kind: "mood",
      })).join("")}
      ${qCard({ key: "nochilli", on: true, emoji: "🌱", label: "No chilli", tone: "herb", kind: "locked" })}</div>
      <p class="q-tally">${quiz.mood.size}/3 &middot; no chilli is always on</p>`;
    ok = true;
  }

  if (step === "have") {
    const list = ingredientChoices();
    const hadCount = list.filter((x) => x.have).length;
    title = "what do you want to use up?";
    sub = `The dotted ones are already in your kitchen, from ${onHandDate() || "your last order"}.`;
    body = `<div class="q-chips">${list.map((x) => `
      <button class="q-chip" type="button" data-qpick="have" data-key="${esc(x.item)}"
              aria-pressed="${quiz.have.has(x.item)}">${x.have ? '<span class="dotmark"></span>' : ""}${esc(cap(x.item))}</button>`).join("")}</div>
      <p class="q-tally">${quiz.have.size} chosen &middot; ${hadCount} of these are in the kitchen</p>`;
    ok = true;
  }

  if (step === "count") {
    title = "how many dishes?";
    sub = "";
    body = `<div class="q-grid">${[
      { v: 1, emoji: "🍽️", label: "just tonight", tone: "clay" },
      { v: 3, emoji: "📋", label: "3 dishes", tone: "yuzu" },
      { v: 7, emoji: "🗓️", label: "a week", tone: "herb" },
    ].map((c) => qCard({ key: c.v, on: quiz.count === c.v, emoji: c.emoji, label: c.label, tone: c.tone, kind: "count" })).join("")}</div>`;
    cta = "find dishes";
    ok = quiz.count != null;
  }

  $("#cook-out").innerHTML = `<div class="q-wrap">
    <div class="q-bar">
      <button class="q-back" type="button" id="qback" ${qStep === 0 ? "disabled" : ""} aria-label="Back">&lsaquo;</button>
      <div class="q-segs">${QUIZ_STEPS.map((_, i) => `<span class="q-seg${i <= qStep ? " on" : ""}"></span>`).join("")}</div>
      <span class="q-count">${qStep + 1} of ${QUIZ_STEPS.length}</span>
    </div>
    <h2 class="q-title">${esc(title)}</h2>
    ${sub ? `<p class="q-sub">${esc(sub)}</p>` : ""}
    <div style="margin-top:1.3rem">${body}</div>
    <button class="q-cta" type="button" id="qnext" ${ok ? "" : "disabled"}>${esc(cta)}</button>
  </div>`;
}

function qCard({ key, on, emoji, label, tone, kind }) {
  const locked = kind === "locked";
  return `<button class="q-card" type="button" ${locked ? 'data-locked="1" disabled' : `data-qpick="${kind}" data-key="${esc(key)}"`}
          data-tone="${tone}" aria-pressed="${on}">
      <span class="q-tick">✓</span>
      <span class="q-emoji">${emoji}</span>
      <span>${esc(label)}</span>
    </button>`;
}

function renderResults() {
  const top = qResults.slice(0, Math.max(6, quiz.count === 7 ? 12 : 8));
  const asked = [
    quiz.time === 999 ? "no time limit" : "under " + quiz.time + " min",
    quiz.kit.size ? [...quiz.kit].join(", ") : "any appliance",
    quiz.mood.size ? [...quiz.mood].map((m) => MOODS.find((x) => x.id === m).label.toLowerCase()).join(", ") : null,
    quiz.have.size ? "using " + [...quiz.have].join(", ") : null,
  ].filter(Boolean).join(" &middot; ");

  let html = `<div class="q-wrap" style="padding-bottom:1rem">
    <div class="res-head"><h2>${qResults.length ? top.length + " to cook" : "Nothing matches"}</h2><span class="leader"></span>
      <button class="linkbtn" id="qrestart">Start again</button></div>
    <p class="q-sub">${asked}</p>`;

  if (!qResults.length) {
    html += `<div class="empty" style="margin-top:1.2rem">Nothing in the library fits all of that.
      Loosen the time, or pick another appliance.</div></div>`;
    $("#cook-out").innerHTML = html;
    return;
  }
  html += `</div><div class="cards">${top.map(({ slug, r, why }) => {
    const c = card({ key: "q-" + slug, slug, r, day: null, slot: r.slot, minutes: r.prepMinutes + r.cookMinutes });
    const badges = `<div class="why">${(why.length ? why : ["fits what you asked"]).map((w) => `<span>${esc(w)}</span>`).join("")}</div>`;
    return c.replace('<div class="tags">', badges + '<div class="tags">');
  }).join("")}</div>`;
  $("#cook-out").innerHTML = html;
}

/* ---------- render all ---------- */
/* ---------- never redraw under a finger ----------
   A browser fires `click` only when the press and the release land on the same
   element. This page rebuilds whole panels with innerHTML, so any redraw that
   arrives mid-press destroys the button being pressed and the click never
   happens at all — the tap vanishes with no error and nothing on screen. That
   is what made the "Still here?" buttons work only sometimes, and chasing each
   redraw to its source only narrows the window rather than closing it.

   So the window is closed: while a pointer is down nothing is redrawn, and a
   redraw that wanted to happen runs on release instead. The press always wins,
   because it is the one thing on this page that came from her. A release that
   never arrives — the pointer left the window — must not freeze the page, so
   the hold times out. */
let pressed = false, heldRender = false, holdTimer = 0;
function pressStart() {
  pressed = true;
  clearTimeout(holdTimer);
  holdTimer = setTimeout(pressEnd, 1500);
}
function pressEnd() {
  clearTimeout(holdTimer);
  if (!pressed) return;
  pressed = false;
  // After the click has been delivered, not instead of it.
  if (heldRender) { heldRender = false; setTimeout(renderAll, 0); }
}
addEventListener("pointerdown", pressStart, true);
addEventListener("pointerup", pressEnd, true);
addEventListener("pointercancel", pressEnd, true);
addEventListener("blur", pressEnd, true);

function renderAll() {
  if (pressed) { heldRender = true; return; }
  renderNow();
}

function renderNow() {
  renderIngChips();
  renderCuisineChips();
  renderCook();
  renderWeek();
  renderRecipes();
  renderShop();
  renderLarder();
  renderMasthead();
}

function renderMasthead() {
  const { lines, pending, total } = basket();
  $("#store-line").textContent = CONF.store || plan.store || "";
  $("#week-title").textContent = plan.label || ("Week of " + plan.weekOf);
  const count = (s) => meals().filter((m) => m.slot === s).length;
  const parts = SLOT_ORDER
    .map((s) => [count(s), s])
    .filter(([n]) => n > 0)
    .map(([n, s]) => `${n} ${n > 1 ? PLURAL[s] : s}`);
  const ps = pushState();
  const status = ps && ps.status === "done" ? "In your Intermarché basket"
    : pushOpen() ? "Being pushed to Intermarché"
    : approved ? "Approved — ready to push"
    : pending.length ? `${pending.length} to decide before approving`
    : "Ready to approve";
  $("#strapline").textContent =
    `The basket for ${andList(parts)}. Swap a dish, tick off what you cooked, say what is left in the kitchen — the basket follows all three. No chilli anywhere.`;
  $("#tally").innerHTML = [
    ["To buy", eur(approved ? approved.total : total)],
    ["Ceiling", eur(CONF.budgetCeiling)],
    ["Lines", approved ? approved.lines.length : lines.length],
    ["Status", status],
    // One element per pair, or the flex row wraps a label away from its number.
  ].map(([k, v]) => `<span class="tally-pair"><span>${k}</span>&nbsp;<b>${esc(String(v))}</b></span>`).join("");
  const checked = Object.values(CATALOGUE).map((c) => c.checked).sort().pop();
  $("#foot").innerHTML =
    `${Object.keys(all()).length} dishes. Prices and packs as listed at Méré${checked ? " on " + esc(checkedOn(checked)) : ""}; ` +
    `weighed goods are charged on the exact weight at collection, so those lines are approximate.`;
}

/* ---------- wiring ---------- */
function segment(sel, onchange) {
  $(sel).addEventListener("click", (e) => {
    const b = e.target.closest("button[data-v]");
    if (!b) return;
    $$("button", $(sel)).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    onchange(b.dataset.v);
  });
}
segment("#orderby", (v) => { state.order = v; renderWeek(); });
segment("#slotfilter", (v) => { state.slot = v; renderWeek(); });
segment("#rslot", (v) => { rstate.slot = v; renderRecipes(); });

$("#timemax").addEventListener("input", (e) => {
  state.maxTime = +e.target.value;
  $("#timeval").textContent = state.maxTime >= 60 ? "any" : "≤ " + state.maxTime + " min";
  renderWeek();
});
$("#ingchips").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-ing]"); if (!b) return;
  const v = b.dataset.ing;
  state.ings.has(v) ? state.ings.delete(v) : state.ings.add(v);
  b.setAttribute("aria-pressed", String(state.ings.has(v)));
  renderWeek();
});
$("#rcuisine").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-cuisine]"); if (!b) return;
  const v = b.dataset.cuisine;
  rstate.cuisines.has(v) ? rstate.cuisines.delete(v) : rstate.cuisines.add(v);
  b.setAttribute("aria-pressed", String(rstate.cuisines.has(v)));
  renderRecipes();
});
$("#rsearch").addEventListener("input", (e) => { rstate.q = e.target.value; renderRecipes(); });

$("#week-clear").addEventListener("click", () => {
  state.slot = "all"; state.maxTime = 60; state.ings.clear();
  $$("#slotfilter button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === "all")));
  $("#timemax").value = 60; $("#timeval").textContent = "any";
  renderIngChips(); renderWeek();
});
$("#rec-clear").addEventListener("click", () => {
  rstate.q = ""; rstate.slot = "all"; rstate.cuisines.clear();
  $("#rsearch").value = "";
  rstate.kit.clear();
  rstate.favsOnly = false;
  $$("#rslot button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === "all")));
  renderCuisineChips(); renderRecipes();
});

$("#shuffle").addEventListener("click", () => {
  const lib = all();
  const used = new Set();
  for (const m of meals()) {
    const opts = Object.entries(lib).filter(([s, r]) => r.slot === m.slot && !used.has(s));
    if (!opts.length) continue;
    const [slug] = opts[Math.floor(Math.random() * opts.length)];
    picks[m.id] = slug;
    used.add(slug);
  }
  renderAll(); persist();
});
$("#resetweek").addEventListener("click", resetWeek);

document.addEventListener("click", (e) => {
  // ---- the quiz ----
  const qp = e.target.closest("[data-qpick]");
  if (qp) {
    const kind = qp.dataset.qpick, key = qp.dataset.key;
    if (kind === "time") quiz.time = Number(key);
    else if (kind === "count") quiz.count = Number(key);
    else if (kind === "mood") {
      if (quiz.mood.has(key)) quiz.mood.delete(key);
      else if (quiz.mood.size < 3) quiz.mood.add(key);   // pick up to 3
    } else if (kind === "have") {
      quiz.have.has(key) ? quiz.have.delete(key) : quiz.have.add(key);
    }
    return renderCook();
  }
  const kp = e.target.closest("[data-kitpick]");
  if (kp) {
    const k = kp.dataset.kitpick;
    quiz.kit.has(k) ? quiz.kit.delete(k) : quiz.kit.add(k);
    return renderCook();
  }
  if (e.target.closest("#qback")) { qStep = Math.max(0, qStep - 1); return renderCook(); }
  if (e.target.closest("#qnext")) {
    if (qStep < QUIZ_STEPS.length - 1) { qStep += 1; return renderCook(); }
    qResults = rankDishes();
    window.scrollTo({ top: 0, behavior: "instant" });
    return renderCook();
  }
  if (e.target.closest("#qrestart")) {
    qResults = null; qStep = 0;
    quiz = { time: null, kit: new Set(), mood: new Set(), have: new Set(), count: null };
    window.scrollTo({ top: 0, behavior: "instant" });
    return renderCook();
  }

  const fav = e.target.closest("button[data-fav]");
  if (fav) return toggleFav(fav.dataset.fav);
  const kit = e.target.closest("button[data-kit]");
  if (kit) {
    const k = kit.dataset.kit;
    rstate.kit.has(k) ? rstate.kit.delete(k) : rstate.kit.add(k);
    renderCuisineChips(); return renderRecipes();
  }
  if (e.target.closest("#favonly")) {
    rstate.favsOnly = !rstate.favsOnly;
    renderCuisineChips(); return renderRecipes();
  }
  const sw = e.target.closest("button[data-swap]");
  if (sw) return openSwap(sw.dataset.swap);
  const alt = e.target.closest("button[data-pick]");
  if (alt) { $("#sheet").close(); return setPick(swapTarget, alt.dataset.pick); }

  // the ingredient layer
  const step = e.target.closest("button[data-addstep]");
  if (step) return stepAdd(step.dataset.addstep, Number(step.dataset.dir));
  const pick = e.target.closest("button[data-choice]");
  if (pick) return chooseLine(pick.dataset.choice, pick.dataset.option);
  const unpick = e.target.closest("button[data-unchoose]");
  if (unpick) return unchoose(unpick.dataset.unchoose);
  const allof = e.target.closest("button[data-allof]");
  if (allof) return toggleAllOf(allof.dataset.allof);
  const strike = e.target.closest("button[data-strike]");
  if (strike) return toggleStrike(strike.dataset.strike);
  const subsw = e.target.closest("button[data-subswap]");
  if (subsw) return openProductSwap(subsw.dataset.subswap);
  const pp = e.target.closest("button[data-pick-product]");
  if (pp) {
    const name = pp.dataset.pickProduct;
    if (name === productTarget) delete subs[productTarget]; else subs[productTarget] = name;
    $("#sheet").close();
    return commitShop();
  }
  const ap = e.target.closest("button[data-add-product]");
  if (ap) { $("#sheet").close(); return addProduct(ap.dataset.addProduct); }
  const tick = e.target.closest("button[data-tick]");
  if (tick) return toggleInBasket(tick.dataset.tick);
  const cmd = e.target.closest("#copycmd");
  if (cmd) return copyText(PUSH_COMMAND, cmd);
  if (e.target.closest("#pushnow")) return requestPush();
  if (e.target.closest("#pushcancel")) return cancelPush();
  if (e.target.closest("#approve")) return approveList();
  if (e.target.closest("#reopen")) return reopenList();
  if (e.target.closest("#additem")) return openAddItem();
  if (e.target.closest("#resetshop")) return resetShop();

  // the week as it is lived
  const md = e.target.closest("button[data-mealdone]");
  if (md) return setMealDone(md.dataset.mealdone, md.dataset.v);
  const mv = e.target.closest("button[data-mealmove]");
  if (mv) return openMealMove(mv.dataset.mealmove);
  const moff = e.target.closest("button[data-mealoff]");
  if (moff) return takeMealOff(moff.dataset.mealoff);
  const mon = e.target.closest("button[data-mealon]");
  if (mon) return putMealBack(mon.dataset.mealon);
  const mto = e.target.closest("button[data-mealto]");
  if (mto) { const [d, sl] = mto.dataset.mealto.split("|"); return moveMeal(moveTarget, d, sl); }
  const msl = e.target.closest("button[data-mealslot]");
  if (msl) { const [d, sl] = msl.dataset.mealslot.split("|"); return openAddMealDish(d, sl); }
  const mdish = e.target.closest("button[data-mealdish]");
  if (mdish && addAt) return addMeal(addAt.day, addAt.slot, mdish.dataset.mealdish);
  if (e.target.closest("#addmeal")) return openAddMeal();

  // the kitchen
  const lstep = e.target.closest("button[data-larderstep]");
  if (lstep) return stepLarder(lstep.dataset.larderstep, Number(lstep.dataset.dir));
  const lgone = e.target.closest("button[data-lardergone]");
  if (lgone) return say(lgone.dataset.lardergone, 0);
  const lkeep = e.target.closest("button[data-larderkeep]");
  if (lkeep) return larderKeep(lkeep.dataset.larderkeep);
  const lclear = e.target.closest("button[data-larderclear]");
  if (lclear) return unsay(lclear.dataset.larderclear);
  const ladd = e.target.closest("button[data-add-larder]");
  if (ladd) return addToLarder(ladd.dataset.addLarder);
  if (e.target.closest("#larderadd")) return openAddToLarder();
  if (e.target.closest("#larderallgone")) return larderAllGone();
  if (e.target.closest("#resetlarder")) return resetLarder();

  const btn = e.target.closest(".expand");
  if (!btn) return;
  const c = btn.closest(".card");
  const open = c.classList.toggle("open");
  btn.setAttribute("aria-expanded", String(open));
  btn.querySelector(".caret").textContent = open ? "▴" : "▾";
});

$("#gen-btn").addEventListener("click", generate);
$("#sheet-close").addEventListener("click", () => $("#sheet").close());
$("#sheet-restore").addEventListener("click", () => {
  $("#sheet").close();
  if (sheetMode === "product") { delete subs[productTarget]; return commitShop(); }
  setPick(swapTarget, baseline[swapTarget]);
});
$("#sheet-search").addEventListener("input", renderProductAlts);

// An <svg> <g> is not a button, so Enter and Space have to be wired by hand or
// the kitchen is mouse-only.
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const hot = e.target.closest && e.target.closest("[data-kitpick]");
  if (!hot) return;
  e.preventDefault();
  const k = hot.dataset.kitpick;
  quiz.kit.has(k) ? quiz.kit.delete(k) : quiz.kit.add(k);
  renderCook();
});

const PANELS = { "tab-cook": "panel-cook", "tab-week": "panel-week",
                "tab-recipes": "panel-recipes", "tab-shop": "panel-shop",
                "tab-larder": "panel-larder" };
$$(".tab").forEach((t) => t.addEventListener("click", () => {
  $$(".tab").forEach((x) => {
    const on = x === t;
    x.setAttribute("aria-selected", String(on));
    $("#" + PANELS[x.id]).hidden = !on;
  });
  document.body.classList.toggle("on-cook", t.id === "tab-cook");
  window.scrollTo({ top: 0, behavior: "instant" });
}));

setSync("", "Checking for your partner's changes…");
renderAll();
</script>
