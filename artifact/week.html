,"tags":["no cook","no chilli","vegetarian"],"short":"Three ingredients, so all of it rests on salting the tomatoes early and using enough oil.","ingredients":[{"item":"tomatoes","qty":"3 good ones","product":"Le Choix du Primeur Tomates RONDES CHARNUES","buy":{"amount":0.3,"mode":"sum","section":"Vegetables"}},{"item":"mozzarella","qty":"1 ball","product":"Pâturages, une marque Intermarché Mozzarella","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"baguette","qty":"half","product":"Cuit sur place Baguette La Généreuse","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"salad","qty":"a few leaves","product":"Le Choix du Primeur Laitue FEUILLES DE CHENES BLONDE","buy":{"amount":1,"mode":"once","section":"Vegetables"}}],"steps":["Thick tomato slices onto the plate, salted, and left for 10 minutes. They release juice that mixes with the oil into a dressing you did not have to make.","Tear the mozzarella rather than slicing it — the ragged edges hold the oil.","Olive oil, black pepper. No vinegar; the tomato is acid enough.","Bread to mop the plate."],"equipment":[]},"roules-cannelle":{"title":"Cinnamon rolls from pizza dough","cuisine":"american","protein":"vegetarian","slot":"breakfast","kind":"recipe","prepMinutes":15,"cookMinutes":20,"serves":10,"tags":["batch cook","no chilli","freezes"],"short":"A rolled pizza dough, salted butter, cassonade and cinnamon, cut into ten and baked. Sunday morning's job, all week's breakfast.","ingredients":[{"item":"pizza dough","qty":"1 roll","product":"Croustipate Pâte à pizza qualité comme à la pizzeria","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"cassonade","qty":"80 g","product":"Cassonade","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":2}},{"item":"ground cinnamon","qty":"2 tsp","product":"Cannelle moulue","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":2.2}},{"item":"salted butter","qty":"60 g, very soft","product":"already in the fridge","pantry":true},{"item":"almond milk","qty":"a splash, to brush","product":"already in the fridge","pantry":true}],"steps":["Take the butter out an hour ahead. Cold butter tears the dough instead of spreading on it.","Heat the oven to 200 °C. Unroll the dough on its own paper, long side towards you, and leave it on the paper — it is what you will bake on.","Spread the soft butter right to the edges, then scatter the cassonade and cinnamon evenly over it. Press it in lightly with your palm so it does not all fall out when you roll.","Roll up from the long side, fairly snug but not tight, and pinch the seam shut. Roll the log seam-down.","Cut into 10 with a serrated knife, sawing rather than pressing, and lay them cut-side up with a good gap between — they spread. Squash each one down slightly.","Brush the tops with almond milk and bake 18–20 minutes, until the tops are set and the edges are properly brown. The pale ones are underdone in the middle.","Cool on the tray 5 minutes; the centres firm up as they go. Freeze what you will not eat in two days, and take one out the night before or give it 30 seconds in the microwave."],"equipment":["oven"]},"sandwich-matin":{"title":"The morning baguette","cuisine":"french","protein":"charcuterie","slot":"breakfast","kind":"assembly","prepMinutes":6,"cookMinutes":0,"serves":2,"tags":["fast","no chilli","no cook"],"short":"The sandwich you actually eat every morning: baguette, Boursin, charcuterie, cheese and cherry tomatoes.","ingredients":[{"item":"baguette","qty":"1, split","product":"Cuit sur place Baguette La Généreuse","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"Boursin","qty":"generously","product":"Boursin Fromage à tartiner ail et fines herbes","buy":{"amount":0.4,"mode":"sum","section":"Bread and cheese"}},{"item":"mortadella","qty":"4 slices","product":"Montorsi Mortadelle","buy":{"amount":0.5,"mode":"sum","section":"Proteins"}},{"item":"cherry tomatoes","qty":"a handful, halved","product":"Petit prix Tomates cerises allongées","buy":{"amount":0.4,"mode":"sum","section":"Vegetables"}},{"item":"cheddar","qty":"2 slices","product":"Pâturages, une marque Intermarché Cheddar Les Tranchettes","buy":{"amount":0.3,"mode":"sum","section":"Bread and cheese"}},{"item":"salt and pepper","qty":"to taste","product":"already in the cupboard","pantry":true}],"steps":["Warm the baguette for 4 minutes in a hot oven if it is yesterday's. A revived crust is the difference between a sandwich and a chore.","Split it lengthways, not all the way through, so it holds together in your hand.","Boursin on the bottom half, right to the ends — it is the only thing keeping the tomatoes from soaking the bread.","Halve the cherry tomatoes, salt them on the board, and give them a minute. Salting first draws out the water that would otherwise run into the crumb.","Charcuterie in loose folds rather than flat sheets, cheese over, then the tomatoes cut-side down.","Plenty of black pepper, close, press gently, eat."],"equipment":[],"packNote":"Nothing here is cooked — the baguette, the charcuterie and the Boursin all come as they are. The only real technique is warming the bread and salting the tomatoes."},"truite-amandes-poireaux":{"title":"Salmon with almonds and leeks","cuisine":"french","protein":"fish","slot":"dinner","kind":"recipe","prepMinutes":10,"cookMinutes":15,"serves":2,"tags":["fast","no chilli"],"short":"Salmon fillets in foaming butter with flaked almonds and lemon, the leek whites warmed through beside them. Méré sells no fresh trout fillet, so this is the salmon version — the method is the trout one unchanged.","ingredients":[{"item":"salmon fillets","qty":"2 fillets (about 250 g)","product":"Filet de saumon frais","buy":{"amount":1,"mode":"sum","section":"Best guesses","price":7.5},"guess":true},{"item":"leek whites","qty":"1 jar, drained","product":"Parole gourmande Blancs de poireaux","buy":{"amount":1,"mode":"sum","section":"Vegetables"}},{"item":"flaked almonds","qty":"a handful","product":"Amandes effilées","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":2.2}},{"item":"lemon","qty":"half, juiced","product":"Le Choix du Primeur Citrons JAUNES","buy":{"amount":0.28,"mode":"once","section":"Vegetables"}},{"item":"potatoes","qty":"500 g, to serve","product":"Le Choix du Primeur Pomme de terre de consommation PRINCESSE AMANDINE à chair ferme avec traitement anti germinatif","buy":{"amount":1,"mode":"once","section":"Vegetables"}},{"item":"butter","qty":"a good knob","product":"already in the fridge","pantry":true}],"steps":["Potatoes on to boil first; everything else takes fifteen minutes and will not wait.","Drain the leek whites well and pat them dry, then cut them into 2 cm lengths. They come out of the jar already cooked and quite wet — dry them or they will steam in the pan instead of colouring.","Melt a knob of butter in a wide pan over medium heat and lay the leeks in cut-side down. 4 minutes, undisturbed, until the cut faces catch and go gold. That browning is the only thing you can add to a jarred vegetable, so do not skip it.","Push them to one side. Pat the salmon dry, season, and lay it skin-down in the hot part of the pan. 4 minutes without touching it, until the skin lifts away cleanly by itself.","Turn, 90 seconds, then lift onto the plates.","Almonds into the pan, 1 minute until they smell toasted and go pale gold, then the lemon juice, which will hiss and lift everything off the base.","Spoon the almonds and pan juices over, leeks and potatoes alongside.","Fresh salmon has not been looked up at Méré yet, so it is priced as a guess until the next catalogue check confirms the fillet and its price."],"equipment":["hob"]},"poulet-basquaise":{"title":"Poulet basquaise","cuisine":"french","protein":"chicken","slot":"dinner","kind":"recipe","prepMinutes":15,"cookMinutes":40,"serves":4,"tags":["batch cook","no chilli","dairy-free"],"short":"Chicken braised with three colours of pepper, tomato and onion until it falls off the bone. The Basque original leans on piment d'Espelette; this one does not, and does not miss it.","ingredients":[{"item":"chicken thighs","qty":"1 kg","product":"Volaé, une marque Intermarché Cuisse de poulet jaune x4","buy":{"amount":1,"mode":"sum","section":"Proteins"}},{"item":"red pepper","qty":"1","product":"Le Choix du Primeur Poivron ROUGE","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"yellow pepper","qty":"1","product":"Le Choix du Primeur Poivrons JAUNES","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"green pepper","qty":"1","product":"Le Choix du Primeur Poivrons VERTS","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"tomatoes","qty":"4, chopped","product":"Le Choix du Primeur Tomate RONDE en GRAPPE","buy":{"amount":0.5,"mode":"sum","section":"Vegetables"}},{"item":"onion","qty":"2, sliced","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.3,"mode":"sum","section":"Vegetables"}},{"item":"garlic","qty":"4 cloves","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"dry white wine","qty":"150 ml","product":"Vin blanc sec de cuisine","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":4.5}},{"item":"thyme","qty":"a few sprigs","product":"Thym frais","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.9}},{"item":"rice","qty":"to serve","product":"Taureau Ailé Riz Basmati","buy":{"amount":1,"mode":"once","section":"Store cupboard"}}],"steps":["Season the thighs and brown them skin-down in a dry casserole, 7 minutes, until the skin is properly gold. Do not crowd the pan — steam instead of colour and the whole dish stays pale.","Out onto a plate. Pour off all but a spoonful of the fat.","Onions in, 6 minutes on medium. Then all three peppers in strips, 8 minutes, until they slump and start to catch at the edges.","Garlic and thyme, 1 minute. Wine in, and scrape the base clean while it bubbles down by half.","Tomatoes in, chicken back on top with any juices, lid on, 25 minutes at a bare simmer.","Lid off for the last 5 to thicken the sauce. Taste hard for salt — peppers and tomato both swallow it.","Serve over rice. It is better the next day, so it seeds a second dinner."],"equipment":["casserole dish","hob"]},"gratin-patates-douces-chevre":{"title":"Sweet potato and goat's cheese gratin","cuisine":"french","protein":"vegetarian","slot":"dinner","kind":"recipe","prepMinutes":15,"cookMinutes":35,"serves":4,"tags":["batch cook","no chilli","vegetarian"],"short":"Sweet potato sliced thin, layered with goat's cheese and thyme, baked till the edges caramelise. No cream in it.","ingredients":[{"item":"sweet potatoes","qty":"1 kg","product":"Le Choix du Primeur Patates DOUCES","buy":{"amount":1,"mode":"sum","section":"Vegetables"}},{"item":"goat's cheese log","qty":"150 g","product":"Bûche de chèvre","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":2.6}},{"item":"onion","qty":"2, sliced","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.3,"mode":"sum","section":"Vegetables"}},{"item":"garlic","qty":"3 cloves","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"grated cheese","qty":"100 g","product":"Pâturages, une marque Intermarché 3 fromages râpés","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"thyme","qty":"a few sprigs","product":"Thym frais","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.9}},{"item":"mâche","qty":"to serve","product":"Le Choix du Primeur Salade MACHE BIO","buy":{"amount":1,"mode":"sum","section":"Vegetables"}}],"steps":["Oven to 200°C. Slice the sweet potatoes into 3 mm rounds — thinner than feels necessary, or they will still be firm when the top is done.","Soften the onions in olive oil for 8 minutes with a good pinch of salt, then stir in the garlic and thyme leaves.","Layer into a dish: sweet potato, a scatter of onion, torn goat's cheese, seasoning. Repeat, finishing with sweet potato.","Grated cheese over the top, cover with foil, 25 minutes.","Foil off, 10 minutes more, until the top is blistered and the edges have gone dark and sweet. That caramelised rim is the best part of the dish; do not pull it early.","Stand 10 minutes before cutting, and serve with the mâche dressed in oil and lemon.","The handful of leaves alongside is mâche rather than rocket: Méré lists no rocket."],"equipment":["oven"]},"omelette-champignons":{"title":"Mushroom and emmental omelette","cuisine":"french","protein":"eggs","slot":"lunch","kind":"recipe","prepMinutes":5,"cookMinutes":10,"serves":2,"tags":["fast","no chilli","vegetarian","uses eggs"],"short":"Mushrooms browned properly first, eggs barely set around them, still baveuse in the middle.","ingredients":[{"item":"eggs","qty":"5","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"chestnut mushrooms","qty":"250 g","product":"Champignons de Paris","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":2.4}},{"item":"emmental","qty":"60 g, grated","product":"Pâturages, une marque Intermarché Emmental français râpé","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}},{"item":"flat-leaf parsley","qty":"a handful","product":"Persil plat","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.1}},{"item":"salad","qty":"to serve","product":"Le Choix du Primeur Salade MACHE","buy":{"amount":1,"mode":"once","section":"Vegetables"}},{"item":"butter","qty":"a knob","product":"already in the fridge","pantry":true}],"steps":["Slice the mushrooms thickly and put them into a dry hot pan with no fat at all. They release their water; let it boil off, 4 minutes. Adding fat first makes them stew in it.","Once the pan is dry again, butter in, 2 minutes, until they are properly brown. Salt now, not before — salt early pulls out more water.","Beat the eggs with a fork just until the yolks break up. Over-beating makes a rubbery omelette.","Eggs over the mushrooms on a medium heat, and drag the setting edges into the middle with a spatula for about 90 seconds.","Emmental and parsley over one half while the top is still glossy and wet. Fold, slide onto a plate, and let the residual heat finish it."],"equipment":["hob"]},"risotto-safran":{"title":"Saffron risotto","cuisine":"italian","protein":"vegetarian","slot":"dinner","kind":"recipe","prepMinutes":10,"cookMinutes":25,"serves":2,"tags":["no chilli","vegetarian"],"short":"Risotto alla milanese: rice, stock, saffron, parmesan. Twenty minutes of stirring and nothing to hide behind.","ingredients":[{"item":"arborio rice","qty":"200 g","product":"Riz Arborio pour risotto","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":2.6}},{"item":"saffron","qty":"a good pinch","product":"Safran en dosettes","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":4.5}},{"item":"vegetable stock","qty":"1 litre, hot","product":"Bouillon de légumes en cubes","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.6}},{"item":"dry white wine","qty":"100 ml","product":"Vin blanc sec de cuisine","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":4.5}},{"item":"shallots","qty":"2, very finely chopped","product":"Échalotes","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":2.1}},{"item":"parmesan","qty":"50 g, grated","product":"Itinéraire des Saveurs, une marque Intermarché Parmigiano Reggiano AOP","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}},{"item":"butter","qty":"a knob, to finish","product":"already in the fridge","pantry":true}],"steps":["Steep the saffron in a ladleful of the hot stock and leave it. Adding the threads dry gives you yellow streaks instead of an evenly perfumed pot.","Soften the shallots in butter on a low heat for 5 minutes without colouring them.","Rice in, and stir it for a full 2 minutes until the grains look translucent at the edges with a white dot at the centre. This toasting is what keeps them separate later.","Wine in, stir until it has all gone.","Now a ladle of hot stock at a time, stirring, waiting until each is nearly absorbed before the next. About 18 minutes. Add the saffron stock halfway.","When the rice is tender with the faintest bite, take it off the heat, beat in the butter and parmesan hard, and let it sit 2 minutes. That final beating is what makes it creamy, not cream.","It should spread slowly on the plate. If it stands up in a mound, loosen it with another splash of stock."],"equipment":["hob"]},"carbonara-pancetta":{"title":"Carbonara, the Roman way","cuisine":"italian","protein":"charcuterie","slot":"dinner","kind":"recipe","prepMinutes":5,"cookMinutes":15,"serves":2,"tags":["fast","no chilli","uses eggs"],"short":"Egg yolks, pancetta, pecorino and pasta water. No cream anywhere near it — which is also why it sits well with you.","ingredients":[{"item":"pasta","qty":"200 g","product":"Pastificio Liguori Pâtes fusilli","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"pancetta","qty":"120 g, cubed","product":"Pancetta en dés","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":3.2}},{"item":"eggs","qty":"3 yolks + 1 whole","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"parmesan","qty":"60 g, finely grated","product":"Itinéraire des Saveurs, une marque Intermarché Parmigiano Reggiano AOP","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}},{"item":"black pepper","qty":"a lot","product":"already in the cupboard","pantry":true}],"steps":["Pasta into well-salted boiling water. Time it — everything else is faster than the pasta.","Pancetta into a cold pan, heat to medium, and let the fat render out for 6 minutes until the cubes are crisp. Starting cold is what gets the fat out instead of burning the outside.","Beat the yolks, the whole egg, the parmesan and an aggressive amount of black pepper into a paste in a bowl.","Scoop out a mugful of pasta water before draining. This is the one step people skip and the one that matters.","Drain the pasta, tip it into the pancetta pan OFF THE HEAT, and toss for 30 seconds so the pan cools slightly.","Now the egg mixture, and toss hard, adding pasta water a splash at a time until it turns into a glossy sauce that coats every piece. Off the heat throughout — on the heat you get scrambled egg, and there is no coming back from it."],"equipment":["hob"]},"lasagnes-legumes-ricotta":{"title":"Courgette and ricotta lasagne","cuisine":"italian","protein":"vegetarian","slot":"dinner","kind":"recipe","prepMinutes":20,"cookMinutes":40,"serves":4,"tags":["batch cook","no chilli","vegetarian"],"short":"Ricotta instead of béchamel — lighter, faster, and no milk sauce to split.","ingredients":[{"item":"lasagne sheets","qty":"1 box","product":"Barilla Pâtes Lasagne aux œufs - Collezione","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"ricotta","qty":"500 g","product":"Pâturages, une marque Intermarché Ricotta","buy":{"amount":2,"mode":"sum","section":"Bread and cheese"}},{"item":"courgettes","qty":"600 g, sliced","product":"Le Choix du Primeur Courgettes LONGUES","buy":{"amount":0.6,"mode":"sum","section":"Vegetables"}},{"item":"aubergine","qty":"1, cubed","product":"Le Choix du Primeur Aubergines VIOLETTES","buy":{"amount":0.4,"mode":"sum","section":"Vegetables"}},{"item":"tomato sauce","qty":"1 jar","product":"Panzani Sauce Tomates Basilic ingrédients origine naturelle","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"onion","qty":"1","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.15,"mode":"sum","section":"Vegetables"}},{"item":"garlic","qty":"3 cloves","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"grated cheese","qty":"150 g","product":"Pâturages, une marque Intermarché Emmental français râpé","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"basil","qty":"a handful","product":"Basilic frais en pot","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":2.2}}],"steps":["Oven to 190°C. Cook the courgette and aubergine hard in olive oil, in two batches so they brown rather than steam, 10 minutes in total. Crowding the pan here is what makes a watery lasagne.","Add the onion and garlic for the last 3 minutes, then the tomato sauce and a splash of water. Simmer 5 minutes.","Beat the ricotta with salt, pepper and half the basil until it is spreadable.","Layer: vegetables, sheets, ricotta spread thin, and repeat. Finish with vegetables, then the grated cheese.","40 minutes, until the top is brown and a knife goes through the sheets with no resistance.","Rest 15 minutes before cutting. Straight out of the oven it slumps; rested, it slices."],"equipment":["oven","hob"]},"puttanesca-sans-piment":{"title":"Puttanesca, without the heat","cuisine":"italian","protein":"fish","slot":"dinner","kind":"recipe","prepMinutes":5,"cookMinutes":15,"serves":2,"tags":["fast","no chilli","dairy-free"],"short":"Anchovies melted into oil, capers, tomato. The classic carries peperoncino and olives; this one has neither — the heat for the IBS rule, the olives because Charlotte does not like them — and leans harder on the anchovy instead.","ingredients":[{"item":"pasta","qty":"200 g","product":"Pastificio Liguori Pâtes fusilli","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"anchovy fillets in oil","qty":"6","product":"Filets d'anchois à l'huile","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":2.3}},{"item":"capers","qty":"2 tbsp, rinsed","product":"Câpres au vinaigre","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.9}},{"item":"tomato sauce","qty":"1 jar","product":"Panzani Sauce Tomates Provençale ingrédients origine naturelle","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"garlic","qty":"4 cloves, sliced","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"flat-leaf parsley","qty":"a handful","product":"Persil plat","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.1}}],"steps":["Pasta on. Salt the water properly but go easy — anchovies and capers are both salty and the sauce catches up fast.","Garlic into cold olive oil over a low heat, 2 minutes, until it just turns blond. Hot oil burns it in seconds and turns the whole dish bitter.","Anchovies in, and press them with a wooden spoon. They will dissolve completely in about a minute — that is the point, and why nobody eating it will identify them.","Capers in, 1 minute, then the tomato sauce. Simmer 8 minutes.","Drain the pasta a minute early, keeping a mugful of water, and finish it in the sauce for that last minute with a splash of the water.","Parsley through at the end. Taste before you add any salt at all."],"equipment":["hob"]},"salade-roquette-parmesan-pommes":{"title":"Mâche, parmesan and green apple","cuisine":"italian","protein":"vegetarian","slot":"lunch","kind":"recipe","prepMinutes":8,"cookMinutes":0,"serves":2,"tags":["fast","no chilli","no cook","vegetarian"],"short":"Soft mâche, sharp apple, salty parmesan shards and toasted pine nuts. Three minutes if the pine nuts are already done.","ingredients":[{"item":"mâche","qty":"1 bag","product":"Le Choix du Primeur Salade MACHE BIO","buy":{"amount":1,"mode":"sum","section":"Vegetables"}},{"item":"green apple","qty":"1, matchsticked","product":"Le Choix du Primeur Pommes GRANNY SMITH","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"parmesan","qty":"a wedge, shaved","product":"Itinéraire des Saveurs, une marque Intermarché Parmigiano Reggiano AOP","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}},{"item":"pine nuts","qty":"2 tbsp","product":"Pignons de pin","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":3.9}},{"item":"balsamic vinegar","qty":"1 tbsp","product":"Vinaigre balsamique","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":2.8}},{"item":"baguette","qty":"to serve","product":"Cuit sur place Baguette La Généreuse","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}},{"item":"olive oil, salt, pepper","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Toast the pine nuts in a dry pan for 2 minutes, shaking constantly. They go from pale to burnt in about fifteen seconds, so do not walk away.","Cut the apple into matchsticks at the last moment and toss them in a little of the balsamic, which stops them browning.","Dress the mâche with olive oil first, then a little balsamic, then salt. Oil before acid coats the leaves and stops them collapsing.","Shave the parmesan over with a peeler — shards, not gratings, so you get a proper salty hit now and then.","Pine nuts over, black pepper, and the baguette alongside.","Méré stocks no rocket at all — checked 2026-09-14 — so this is the mâche version. Mâche is softer and nuttier than rocket and does not fight the parmesan, so dress it at the last minute and go easy on the balsamic."],"equipment":[]},"pates-saumon-fume-citron":{"title":"Smoked salmon and lemon pasta","cuisine":"italian","protein":"fish","slot":"dinner","kind":"recipe","prepMinutes":5,"cookMinutes":12,"serves":2,"tags":["fast","no chilli"],"short":"The salmon never sees the pan — it goes in off the heat so it stays silky instead of turning to string.","ingredients":[{"item":"pasta","qty":"200 g","product":"Pastificio Liguori Pâtes fusilli","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"smoked salmon","qty":"1 pack","product":"Petit navire Saumon fumé de Norvège","buy":{"amount":1,"mode":"sum","section":"Proteins"}},{"item":"lemon","qty":"1, zest and juice","product":"Le Choix du Primeur Citrons JAUNES","buy":{"amount":0.28,"mode":"once","section":"Vegetables"}},{"item":"ricotta","qty":"150 g","product":"Pâturages, une marque Intermarché Ricotta","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"shallots","qty":"1, finely chopped","product":"Échalotes","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":2.1}},{"item":"dill or parsley","qty":"a handful","product":"Aneth frais","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.9}}],"steps":["Pasta on. Zest the lemon before juicing it.","Soften the shallot in olive oil on a low heat, 4 minutes, no colour.","Loosen the ricotta in a bowl with the lemon zest, half the juice, black pepper and two spoonfuls of the pasta water.","Drain the pasta, keeping a mugful of water. Into the shallot pan, off the heat.","Ricotta mixture in, tossing and loosening with pasta water until it coats.","Only now tear in the salmon and fold it through the residual heat, with the herbs. Cook it properly and it seizes into salty threads; warmed like this it stays soft."],"equipment":["hob"]},"tortilla-patatas":{"title":"Tortilla de patatas","cuisine":"spanish","protein":"eggs","slot":"dinner","kind":"recipe","prepMinutes":15,"cookMinutes":30,"serves":4,"tags":["batch cook","no chilli","vegetarian","uses eggs"],"short":"Potatoes poached soft in olive oil, then set in egg. Eaten hot, warm or cold, and better on day two.","ingredients":[{"item":"potatoes","qty":"700 g","product":"Le Choix du Primeur Pomme de terre de consommation PRINCESSE AMANDINE à chair ferme avec traitement anti germinatif","buy":{"amount":1,"mode":"sum","section":"Vegetables"}},{"item":"eggs","qty":"6","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"onion","qty":"1 large, sliced thin","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"olive oil","qty":"plenty","product":"Bouton d’Or, une marque Intermarché Huile d'olive vierge extra BIO - issue de l'agriculture biologique","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"salad","qty":"to serve","product":"Le Choix du Primeur Laitue COEUR DE ROMAINE","buy":{"amount":1,"mode":"once","section":"Vegetables"}}],"steps":["Slice the potatoes thin. Into a deep pan with enough olive oil to nearly cover them and a big pinch of salt.","Cook them on a low-medium heat for 20 minutes, turning gently now and then. They should never sizzle hard or brown — you are poaching them soft, not frying them. Add the onion halfway.","Drain them through a sieve set over a bowl, and keep that oil; it is now excellent and worth cooking with all week.","Beat the eggs with salt, tip in the hot potatoes, and leave the lot to sit for 10 minutes. This soak is what makes the tortilla hold together instead of falling apart.","Two tablespoons of the reserved oil into a 24 cm non-stick pan on medium. Mixture in, and cook 5 minutes, easing the edges in with a spatula.","Cover with a plate, flip the whole thing over — commit, do not hesitate — slide it back in and give it 3 more minutes. The middle should still be a little loose."],"equipment":["hob"]},"pisto-manchego":{"title":"Pisto with a fried egg and shaved parmesan","cuisine":"spanish","protein":"eggs","slot":"dinner","kind":"recipe","prepMinutes":15,"cookMinutes":35,"serves":4,"tags":["batch cook","no chilli","vegetarian","uses eggs"],"short":"Spain’s ratatouille — courgette, aubergine, peppers and tomato cooked right down, with a fried egg broken over it. It should be manchego on top; Méré does not sell any, so it is the parmesan already on the order, shaved the same way.","ingredients":[{"item":"courgettes","qty":"2, cubed","product":"Le Choix du Primeur Courgettes LONGUES","buy":{"amount":0.5,"mode":"sum","section":"Vegetables"}},{"item":"aubergine","qty":"1, cubed","product":"Le Choix du Primeur Aubergines VIOLETTES","buy":{"amount":0.4,"mode":"sum","section":"Vegetables"}},{"item":"red pepper","qty":"1","product":"Le Choix du Primeur Poivron ROUGE","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"yellow pepper","qty":"1","product":"Le Choix du Primeur Poivrons JAUNES","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"tomatoes","qty":"5, chopped","product":"Le Choix du Primeur Tomates RONDES CHARNUES","buy":{"amount":0.6,"mode":"sum","section":"Vegetables"}},{"item":"onion","qty":"2","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.3,"mode":"sum","section":"Vegetables"}},{"item":"garlic","qty":"4 cloves","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"olive oil","qty":"plenty — the aubergine drinks it","product":"Bouton d’Or, une marque Intermarché Huile d'olive vierge extra BIO - issue de l'agriculture biologique","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"eggs","qty":"4","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"parmesan","qty":"60 g, shaved","product":"Itinéraire des Saveurs, une marque Intermarché Parmigiano Reggiano AOP","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}},{"item":"baguette","qty":"to serve","product":"Cuit sur place Baguette La Généreuse","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}}],"steps":["Cube everything to roughly the same size. Salt the aubergine in a colander while you do the rest.","Onions in olive oil, low, 10 minutes until sweet. Peppers in, 10 minutes more.","Aubergine squeezed dry and in with a good slug more oil — aubergine drinks it and under-oiled aubergine goes leathery — 8 minutes.","Courgette and garlic, 5 minutes, then the tomatoes.","Now leave it alone on a low heat for 15 minutes, stirring rarely, until it is jammy and the oil separates out at the edges. That separation is how you know it is done; before that it is just hot vegetables.","Fry the eggs hard in olive oil so the whites go lacy and crisp at the edges.","Pisto into bowls, egg on top, parmesan shaved over, baguette to mop."],"equipment":["hob"]},"avocado-toast":{"title":"Avocado toast, properly seasoned","cuisine":"american","protein":"eggs","slot":"breakfast","kind":"recipe","prepMinutes":6,"cookMinutes":6,"serves":2,"tags":["fast","no chilli","vegetarian","uses eggs"],"short":"The whole dish is seasoning. Under-salted avocado is the reason most versions of this taste of nothing.","ingredients":[{"item":"avocado","qty":"2, ripe","product":"Le Choix du Primeur Avocat AFFINE","buy":{"amount":2,"mode":"sum","section":"Vegetables"}},{"item":"bread","qty":"4 thick slices","product":"Cuit sur place Baguette La Généreuse","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"eggs","qty":"2","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"cherry tomatoes","qty":"a handful","product":"Petit prix Tomates cerises allongées","buy":{"amount":0.3,"mode":"sum","section":"Vegetables"}},{"item":"lemon","qty":"half","product":"Le Choix du Primeur Citrons JAUNES","buy":{"amount":0.28,"mode":"once","section":"Vegetables"}},{"item":"olive oil, salt, black pepper","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Bread into the air fryer at 190°C for 4 minutes, or under a grill. You want it dry and crisp right through — soft toast collapses under the avocado.","Poach or fry the eggs while it goes. Six-minute boiled works equally well if you would rather not stand over a pan.","Halve the avocados and scoop them into a bowl. Mash roughly with a fork — keep some lumps, a smooth purée is baby food.","Now season it much harder than feels right: the lemon juice, a real pinch of salt, plenty of pepper, a slug of olive oil. Taste it. Then add a bit more salt. This is the entire recipe.","Spread thickly on the toast, halved cherry tomatoes over, egg on top, one last grind of pepper."],"equipment":["air fryer","hob"]},"pilons-airfryer-citron":{"title":"Air fryer chicken drumsticks with lemon and thyme","cuisine":"french","protein":"chicken","slot":"dinner","kind":"recipe","prepMinutes":10,"cookMinutes":25,"serves":2,"tags":["no chilli","dairy-free"],"short":"Drumsticks in the air fryer come out with skin like crackling and no oven to heat. Twenty-five minutes, one basket.","ingredients":[{"item":"chicken drumsticks","qty":"1 pack","product":"Plukon Pilons de poulet","buy":{"amount":1,"mode":"sum","section":"Proteins"}},{"item":"lemon","qty":"1","product":"Le Choix du Primeur Citrons JAUNES","buy":{"amount":0.28,"mode":"once","section":"Vegetables"}},{"item":"garlic","qty":"3 cloves, crushed","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"thyme","qty":"several sprigs","product":"Thym frais","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.9}},{"item":"potatoes","qty":"400 g, in chunks","product":"Le Choix du Primeur Pomme de terre de consommation PRINCESSE AMANDINE à chair ferme avec traitement anti germinatif","buy":{"amount":1,"mode":"once","section":"Vegetables"}},{"item":"mâche","qty":"to serve","product":"Le Choix du Primeur Salade MACHE BIO","buy":{"amount":1,"mode":"sum","section":"Vegetables"}}],"steps":["Dry the drumsticks with kitchen paper — genuinely dry, all over. Moisture is the only thing standing between you and crisp skin.","Toss with olive oil, salt, pepper, the crushed garlic, thyme leaves and the zest of the lemon.","Air fryer to 200°C. Drumsticks in a single layer, not touching. Stacked, they steam each other and the skin stays flabby.","18 minutes, turning once at 10. Add the potato chunks around them for the last 12, tossed in a little oil.","Check the thickest drumstick at the bone — the juices should run clear with no pink at all.","Squeeze the lemon over everything the moment it comes out, while it is hot enough to sizzle. Salad alongside.","Plain mâche rather than the bagged mâche-and-rocket mix, which Méré no longer lists."],"equipment":["air fryer"]},"frites-patates-douces-airfryer":{"title":"Air fryer sweet potato fries","cuisine":"american","protein":"vegetarian","slot":"lunch","kind":"recipe","prepMinutes":10,"cookMinutes":20,"serves":2,"tags":["fast","no chilli","vegetarian","dairy-free"],"short":"The cornflour is not optional — it is the only way sweet potato goes crisp instead of floppy.","ingredients":[{"item":"sweet potatoes","qty":"600 g","product":"Le Choix du Primeur Patates DOUCES","buy":{"amount":0.6,"mode":"sum","section":"Vegetables"}},{"item":"cornflour","qty":"1 tbsp","product":"Maïzena fécule de maïs","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.8}},{"item":"mayonnaise","qty":"to dip","product":"Bouton d’Or, une marque Intermarché Mayonnaise","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"garlic","qty":"1 clove, for the dip","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.05,"mode":"once","section":"Vegetables"}},{"item":"olive oil, salt","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Cut the sweet potatoes into batons about a centimetre thick. Even thickness matters more than the exact size — mixed sizes give you burnt thin ones and raw fat ones.","Soak them in cold water for 10 minutes to pull out surface starch, then dry them thoroughly. Wet chips steam.","Toss with a tablespoon of cornflour until dusty, then a tablespoon of oil. Cornflour first, oil second, or it clumps.","Air fryer 200°C, single layer, 18–20 minutes, shaking the basket twice. Cook in two batches rather than crowding it.","Salt the moment they come out, not before — salt in the basket draws water and softens them.","Stir the crushed garlic into the mayonnaise for a dip."],"equipment":["air fryer"]},"dinde-panee-airfryer":{"title":"Air fryer breaded turkey escalope","cuisine":"italian","protein":"turkey","slot":"dinner","kind":"recipe","prepMinutes":12,"cookMinutes":14,"serves":2,"tags":["fast","no chilli"],"short":"A milanese without a pan of hot oil. Parmesan in the crumb is what makes it taste of something.","ingredients":[{"item":"turkey escalopes","qty":"2 thin","product":"Volaé, une marque Intermarché Escalopes de dinde extra fines x2","buy":{"amount":0.3,"mode":"sum","section":"Proteins"}},{"item":"breadcrumbs","qty":"80 g","product":"Chapelure","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.4}},{"item":"parmesan","qty":"30 g, grated","product":"Itinéraire des Saveurs, une marque Intermarché Grana Padano AOP râpé","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}},{"item":"egg","qty":"1, beaten","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"flour","qty":"3 tbsp","product":"Top Budget Farine de blé Type 55","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"lemon","qty":"half, in wedges","product":"Le Choix du Primeur Citrons JAUNES","buy":{"amount":0.28,"mode":"once","section":"Vegetables"}},{"item":"mâche","qty":"to serve","product":"Le Choix du Primeur Salade MACHE BIO","buy":{"amount":1,"mode":"sum","section":"Vegetables"}}],"steps":["Three shallow plates: seasoned flour, beaten egg, and the breadcrumbs mixed with the parmesan.","Pat the escalopes dry, then flour, egg, crumb — pressing the crumb on firmly. Shake off the excess flour properly or the coating slides off in sheets.","Spray or brush both sides with oil. An air fryer will not brown a dry crumb; it just goes pale and dusty.","190°C, 7 minutes, flip, 5–7 minutes more until deep gold.","Lemon squeezed over, mâche alongside dressed in oil and salt.","Mâche alongside rather than rocket — Méré lists no rocket."],"equipment":["air fryer"]},"legumes-rotis-airfryer":{"title":"Air fryer roasted vegetables with brebis","cuisine":"french","protein":"vegetarian","slot":"dinner","kind":"recipe","prepMinutes":10,"cookMinutes":22,"serves":2,"tags":["fast","no chilli","vegetarian"],"short":"Courgette, pepper and aubergine charred hard, then brebis crumbled over while it is still hot enough to soften.","ingredients":[{"item":"courgette","qty":"1","product":"Le Choix du Primeur Courgettes LONGUES","buy":{"amount":0.3,"mode":"sum","section":"Vegetables"}},{"item":"red pepper","qty":"1","product":"Le Choix du Primeur Poivron ROUGE","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"aubergine","qty":"1 small","product":"Le Choix du Primeur Aubergines VIOLETTES","buy":{"amount":0.3,"mode":"sum","section":"Vegetables"}},{"item":"red onion","qty":"1","product":"Le Choix du Primeur Oignons ROUGES","buy":{"amount":0.15,"mode":"sum","section":"Vegetables"}},{"item":"brebis with herbs","qty":"1 pack, crumbled","product":"Salakis Fromage 100% brebis herbes de Provence","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"balsamic vinegar","qty":"1 tbsp","product":"Vinaigre balsamique","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":2.8}},{"item":"baguette","qty":"to serve","product":"Cuit sur place Baguette La Généreuse","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}}],"steps":["Cut everything to roughly 2 cm. Bigger than you would for the oven — an air fryer moves a lot of air and small pieces dry out.","Toss with olive oil and salt, then into the basket at 200°C.","20 minutes, shaking hard every 7. You are after blackened edges in places, not an even golden colour; the charred bits are the flavour.","Tip into a warm bowl, splash the balsamic over while it steams, and toss.","Crumble the brebis over so it half melts, and eat with the baguette."],"equipment":["air fryer"]},"muffins-oeufs-legumes":{"title":"Egg and vegetable muffins","cuisine":"american","protein":"eggs","slot":"breakfast","kind":"recipe","prepMinutes":12,"cookMinutes":20,"serves":4,"tags":["batch cook","no chilli","vegetarian","uses eggs"],"short":"Twelve at a time, good cold for three days. A breakfast for the mornings you don't want another sandwich.","ingredients":[{"item":"eggs","qty":"8","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":2,"mode":"sum","section":"Proteins"}},{"item":"red pepper","qty":"1, finely diced","product":"Le Choix du Primeur Poivron ROUGE","buy":{"amount":0.2,"mode":"sum","section":"Vegetables"}},{"item":"courgette","qty":"1, grated and squeezed","product":"Le Choix du Primeur Courgettes LONGUES","buy":{"amount":0.25,"mode":"sum","section":"Vegetables"}},{"item":"grated cheese","qty":"100 g","product":"Pâturages, une marque Intermarché 3 fromages râpés","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"onion","qty":"1, finely chopped","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.1,"mode":"sum","section":"Vegetables"}},{"item":"flat-leaf parsley","qty":"a handful","product":"Persil plat","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.1}}],"steps":["Oven to 180°C. Oil a twelve-hole muffin tin properly, including the top surface between the holes — egg welds itself to bare metal.","Grate the courgette and squeeze it dry in a clean cloth. Skip this and you get twelve wet, collapsed pucks.","Soften the onion and pepper in a pan for 5 minutes; raw onion in the mix stays crunchy and sharp.","Beat the eggs with plenty of salt and pepper, stir in the vegetables, cheese and parsley.","Fill each hole about three-quarters. They rise like soufflés and then settle, so leave the room.","20 minutes, until puffed and just set with no wobble at the centre. Cool 5 minutes in the tin before easing them out with a knife."],"equipment":["muffin tin","oven"]},"muffins-banane-chocolat":{"title":"Banana and dark chocolate muffins","cuisine":"american","protein":"vegetarian","slot":"breakfast","kind":"recipe","prepMinutes":12,"cookMinutes":22,"serves":4,"tags":["batch cook","no chilli","vegetarian","uses eggs"],"short":"The blacker the bananas the better. Dairy-free — it runs on the almond milk you already buy.","ingredients":[{"item":"bananas","qty":"3, very ripe","product":"Le Choix du Primeur Bananes","buy":{"amount":0.4,"mode":"sum","section":"Vegetables"}},{"item":"flour","qty":"250 g","product":"Top Budget Farine de blé Type 55","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"sugar","qty":"100 g","product":"Daddy Sucre en poudre","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"eggs","qty":"2","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"almond milk","qty":"100 ml","product":"Bjorg Boisson végétale Lait d'amande vanille BIO","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"dark chocolate chips","qty":"100 g","product":"Vahiné Pépites de chocolat noir","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"baking powder","qty":"2 tsp","product":"Levure chimique","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.2}},{"item":"oil and a pinch of salt","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Oven to 190°C, papers in the muffin tin. Bananas that have gone black in the fruit bowl are the ones you want — they are sweeter and mash to nothing.","Mash the bananas thoroughly, then beat in the sugar, eggs, almond milk and 80 ml of oil.","Flour, baking powder and salt sifted over the top, plus the chocolate chips.","Fold it about ten times with a spatula and stop while it still looks lumpy and undermixed. Beating a muffin batter smooth develops the gluten and gives you rubber.","Divide between twelve papers, right to the top for a good dome.","22 minutes, until a skewer comes out with a crumb or two but no wet batter. Cool in the tin 5 minutes."],"equipment":["muffin tin","oven"]},"mini-quiches-muffin":{"title":"Mini quiches lorraines","cuisine":"french","protein":"charcuterie","slot":"lunch","kind":"recipe","prepMinutes":15,"cookMinutes":25,"serves":4,"tags":["batch cook","no chilli","uses eggs"],"short":"A whole quiche's worth in twelve, cooked in a third of the time and easy to carry.","ingredients":[{"item":"shortcrust pastry","qty":"1 roll","product":"Pâte brisée prête à dérouler","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.7}},{"item":"lardons","qty":"150 g","product":"Herta Lardons nature","buy":{"amount":1,"mode":"sum","section":"Proteins"}},{"item":"eggs","qty":"4","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"emmental","qty":"100 g, grated","product":"Pâturages, une marque Intermarché Emmental français râpé","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"onion","qty":"1","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.1,"mode":"sum","section":"Vegetables"}},{"item":"salad","qty":"to serve","product":"Le Choix du Primeur Salade MACHE","buy":{"amount":1,"mode":"once","section":"Vegetables"}},{"item":"nutmeg, salt, pepper","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Oven to 190°C. Cut twelve discs from the pastry with a glass, a good centimetre wider than the muffin holes, and press them in.","Lardons into a cold pan, heat to medium, 5 minutes until crisp. Onion into the rendered fat, 4 minutes. Drain off the fat or the quiches turn greasy.","Beat the eggs with salt, pepper and a scrape of nutmeg. No cream — the cheese carries it.","Lardons, onion and most of the emmental into the cases, then egg poured in to just below the pastry rim. Overfill them and they weld to the tin.","Rest of the cheese on top. 25 minutes, until set and golden.","Cool 5 minutes before lifting out. Good hot, better at room temperature."],"equipment":["muffin tin","oven"]},"poivrons-farcis-four":{"title":"Stuffed peppers baked with rice and beef","cuisine":"spanish","protein":"beef","slot":"dinner","kind":"recipe","prepMinutes":20,"cookMinutes":45,"serves":4,"tags":["batch cook","no chilli","dairy-free"],"short":"Peppers are on the always-welcome list and this is the best thing to do with four of them. The rice goes in raw and cooks inside the pepper.","ingredients":[{"item":"red peppers","qty":"2","product":"Le Choix du Primeur Poivron ROUGE","buy":{"amount":0.4,"mode":"sum","section":"Vegetables"}},{"item":"yellow peppers","qty":"2","product":"Le Choix du Primeur Poivrons JAUNES","buy":{"amount":0.4,"mode":"sum","section":"Vegetables"}},{"item":"beef mince","qty":"400 g","product":"Jean Rozé, une marque Intermarché Viande hachée vrac pur BŒUF 15% MG","buy":{"amount":1,"mode":"sum","section":"Proteins"}},{"item":"rice","qty":"150 g, uncooked","product":"Taureau Ailé Riz Basmati","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"tomato sauce","qty":"1 jar","product":"Panzani Sauce Tomates Provençale ingrédients origine naturelle","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"onion","qty":"1","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.15,"mode":"sum","section":"Vegetables"}},{"item":"garlic","qty":"3 cloves","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"flat-leaf parsley","qty":"a handful","product":"Persil plat","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.1}}],"steps":["Oven to 180°C. Cut the tops off the peppers and keep them; pull out the seeds and the white ribs.","Brown the mince hard in a pan, 5 minutes, without stirring much. Then the onion, 4 minutes, and the garlic.","Off the heat, stir in the raw rice, half the tomato sauce, the parsley and plenty of salt. Raw rice, not cooked — it swells inside the pepper and takes the meat juices with it. Cooked rice turns to mush.","Stand the peppers in a casserole dish, fill them about three-quarters, and put their lids back on.","Pour the rest of the sauce and 150 ml water around the base, cover the dish with foil, and bake 35 minutes.","Foil off, 10 minutes more to colour the tops. Test the rice through the side of a pepper with a knife; if it is still firm, another 5 minutes covered."],"equipment":["oven","casserole dish","hob"]},"gratin-coquillettes-jambon":{"title":"Baked coquillettes with ham","cuisine":"french","protein":"charcuterie","slot":"dinner","kind":"recipe","prepMinutes":10,"cookMinutes":30,"serves":4,"tags":["batch cook","no chilli"],"short":"The French childhood pasta bake, made without a béchamel — the pasta finishes cooking in the milk it bakes in.","ingredients":[{"item":"coquillettes","qty":"400 g","product":"Fiorini, une marque Intermarché Coquillettes","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"sliced ham","qty":"200 g","product":"Jambon blanc en tranches","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":2.8}},{"item":"grated cheese","qty":"200 g","product":"Pâturages, une marque Intermarché Emmental français râpé","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"onion","qty":"1","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.1,"mode":"sum","section":"Vegetables"}},{"item":"milk","qty":"400 ml","product":"Pâturages, une marque Intermarché Lait demi-écrémé stérilisé UHT BIO - issu de l'agriculture biologique,","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"salad","qty":"to serve","product":"Le Choix du Primeur Laitue FEUILLES DE CHENES BLONDE","buy":{"amount":1,"mode":"once","section":"Vegetables"}},{"item":"nutmeg, salt, pepper","qty":"","product":"already in the cupboard","pantry":true}],"steps":["Oven to 180°C. Boil the coquillettes for 4 minutes only — half the packet time. They drink the milk in the oven and finish there; fully cooked pasta turns to paste.","Soften the onion in butter, 5 minutes.","Drain the pasta and mix in the dish with the onion, torn ham, two-thirds of the cheese, the milk, salt, pepper and a good scrape of nutmeg.","Rest of the cheese over the top.","30 minutes, until the top is brown and the edges are bubbling. If it looks wet at 25 minutes, give it another five uncovered.","Stand 5 minutes, and eat with a sharp green salad — it needs the contrast."],"equipment":["oven","casserole dish","hob"]},"tian-provencal":{"title":"Tian provençal","cuisine":"french","protein":"vegetarian","slot":"dinner","kind":"recipe","prepMinutes":20,"cookMinutes":50,"serves":4,"tags":["batch cook","no chilli","vegetarian","dairy-free"],"short":"Courgette, aubergine and tomato stood on edge in a dish and baked slowly until they shrink and sweeten. Almost no work.","ingredients":[{"item":"courgettes","qty":"2","product":"Le Choix du Primeur Courgettes LONGUES","buy":{"amount":0.4,"mode":"sum","section":"Vegetables"}},{"item":"aubergine","qty":"1","product":"Le Choix du Primeur Aubergines VIOLETTES","buy":{"amount":0.35,"mode":"sum","section":"Vegetables"}},{"item":"tomatoes","qty":"4","product":"Le Choix du Primeur Tomate RONDE en GRAPPE","buy":{"amount":0.5,"mode":"sum","section":"Vegetables"}},{"item":"onion","qty":"2, sliced","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":0.3,"mode":"sum","section":"Vegetables"}},{"item":"garlic","qty":"4 cloves","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"thyme and rosemary","qty":"several sprigs","product":"Herbes de Provence fraîches","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.9}},{"item":"olive oil","qty":"generous","product":"Bouton d’Or, une marque Intermarché Huile d'olive vierge extra BIO - issue de l'agriculture biologique","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"rice","qty":"to serve","product":"Taureau Ailé Riz Basmati","buy":{"amount":1,"mode":"once","section":"Store cupboard"}}],"steps":["Oven to 180°C. Soften the sliced onions and garlic in olive oil for 10 minutes and spread them over the base of the dish. This layer is what stops the whole thing sticking and drying out.","Slice the courgette, aubergine and tomato into rounds of the same thickness, about 5 mm. Same thickness matters — mixed thicknesses cook unevenly and some stay raw.","Stand them on edge in tight alternating rows, packed hard against each other. They shrink a lot, and a loosely packed tian collapses into a puddle.","Salt, pepper, the herbs tucked in, and a generous pour of olive oil over the whole surface.","50 minutes. It is done when the tops are browned and the vegetables have sunk to about two-thirds of their original height.","Better warm than hot, and better still the next day. Rice or bread alongside."],"equipment":["oven","casserole dish"]},"poulet-tomates-olives-four":{"title":"Roast chicken thighs with tomatoes and lemon","cuisine":"french","protein":"chicken","slot":"dinner","kind":"recipe","prepMinutes":10,"cookMinutes":45,"serves":4,"tags":["batch cook","no chilli","dairy-free"],"short":"One dish, forty-five minutes, no stirring. The tomatoes burst and turn into the sauce by themselves.","ingredients":[{"item":"chicken thighs","qty":"1 kg","product":"Volaé, une marque Intermarché Cuisse de poulet jaune x4","buy":{"amount":1,"mode":"sum","section":"Proteins"}},{"item":"cherry tomatoes","qty":"500 g","product":"Petit prix Tomates cerises allongées","buy":{"amount":2,"mode":"sum","section":"Vegetables"}},{"item":"red onion","qty":"2, in wedges","product":"Le Choix du Primeur Oignons ROUGES","buy":{"amount":0.3,"mode":"sum","section":"Vegetables"}},{"item":"garlic","qty":"1 whole head, halved","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.12,"mode":"once","section":"Vegetables"}},{"item":"lemon","qty":"1, in wedges","product":"Le Choix du Primeur Citrons JAUNES","buy":{"amount":0.28,"mode":"once","section":"Vegetables"}},{"item":"rosemary","qty":"several sprigs","product":"Romarin frais","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.9}},{"item":"potatoes","qty":"600 g","product":"Le Choix du Primeur Pomme de terre de consommation PRINCESSE AMANDINE à chair ferme avec traitement anti germinatif","buy":{"amount":1,"mode":"sum","section":"Vegetables"}}],"steps":["Oven to 200°C. Halve the potatoes and put them in the dish with the onion wedges, the halved garlic head and the rosemary, tossed in olive oil and salt.","Dry the chicken thighs, salt the skin hard, and sit them on top — skin up, and not touching each other. Anything laid on top of them steams them.","25 minutes.","Scatter the cherry tomatoes and lemon wedges around the chicken, and give it 20 minutes more.","The tomatoes should have burst and gone jammy and the skin should be crisp. If the skin is still pale, three minutes under the grill fixes it.","Squeeze the roasted garlic cloves out of their skins and mash them into the pan juices before serving."],"equipment":["oven","casserole dish"]},"pain-perdu":{"title":"Pain perdu","cuisine":"french","protein":"eggs","slot":"breakfast","kind":"recipe","prepMinutes":5,"cookMinutes":10,"serves":2,"tags":["fast","no chilli","vegetarian","uses eggs"],"short":"What yesterday's baguette is for. Made with the vanilla almond milk, so there is no cow's milk in it.","ingredients":[{"item":"stale baguette","qty":"1, in thick slices","product":"Cuit sur place Baguette La Généreuse","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"eggs","qty":"3","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"almond milk","qty":"200 ml","product":"Bjorg Boisson végétale Lait d'amande vanille BIO","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"sugar","qty":"2 tbsp","product":"Daddy Sucre en poudre","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"banana","qty":"1, sliced","product":"Le Choix du Primeur Bananes","buy":{"amount":0.15,"mode":"sum","section":"Vegetables"}},{"item":"cinnamon","qty":"a good pinch","product":"Bouton d’Or, une marque Intermarché Cannelle moulue","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"butter","qty":"for the pan","product":"already in the fridge","pantry":true}],"steps":["Beat the eggs, almond milk, one tablespoon of the sugar and the cinnamon in a wide shallow dish.","Cut the baguette into 3 cm slices, on a steep angle for more surface.","Soak them for a full minute a side. Stale bread needs it; a quick dip leaves a dry core, which is the usual failure.","Butter in a pan on medium — not high. Too hot and the outside browns while the custard inside stays raw.","3 minutes a side until deep gold and puffed.","Banana over, the last of the sugar scattered on while hot."],"equipment":["hob"]},"oeufs-tomate-four":{"title":"Eggs baked in tomato sauce","cuisine":"italian","protein":"eggs","slot":"breakfast","kind":"recipe","prepMinutes":5,"cookMinutes":15,"serves":2,"tags":["fast","no chilli","vegetarian","uses eggs"],"short":"Uova in purgatorio — normally made hot with chilli, which is exactly what we leave out. Garlic and oregano carry it instead.","ingredients":[{"item":"tomato sauce","qty":"1 jar","product":"Panzani Sauce Tomates Provençale ingrédients origine naturelle","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"eggs","qty":"4","product":"Volaé, une marque Intermarché Œufs frais de poules élevées au sol","buy":{"amount":1,"mode":"once","section":"Proteins"}},{"item":"garlic","qty":"3 cloves, sliced","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"parmesan","qty":"to finish","product":"Itinéraire des Saveurs, une marque Intermarché Grana Padano AOP râpé","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}},{"item":"baguette","qty":"to mop","product":"Cuit sur place Baguette La Généreuse","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"basil","qty":"a few leaves","product":"Basilic frais en pot","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":2.2}}],"steps":["Oven to 200°C. Soften the sliced garlic in olive oil in an ovenproof dish over a low heat, 2 minutes, without letting it colour.","Tomato sauce in with a splash of water, and simmer 5 minutes so it thickens slightly.","Make four wells with the back of a spoon and crack an egg into each. Deep wells — a shallow one lets the white spread across the whole surface.","Season the eggs, parmesan over the sauce but not the yolks, and into the oven.","8–10 minutes. Pull it when the whites are just set and the yolks still move when you shake the dish; they carry on cooking in the hot sauce.","Basil over, baguette to mop."],"equipment":["oven","casserole dish","hob"]},"soupe-oignon-gratinee":{"title":"Soupe à l'oignon gratinée","cuisine":"french","protein":"vegetarian","slot":"lunch","kind":"recipe","prepMinutes":10,"cookMinutes":50,"serves":4,"tags":["batch cook","no chilli","vegetarian"],"short":"Replaces the leek and potato soup, which Méré cannot supply. Forty minutes of browning onions and nothing else — there is no shortcut and no substitute for the time.","ingredients":[{"item":"onions","qty":"1 kg, sliced thin","product":"Le Choix du Primeur Oignons JAUNES","buy":{"amount":1,"mode":"sum","section":"Vegetables"}},{"item":"baguette","qty":"1, in thick slices","product":"Cuit sur place Baguette La Généreuse","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"grated cheese","qty":"200 g","product":"Pâturages, une marque Intermarché Emmental français râpé","buy":{"amount":1,"mode":"sum","section":"Bread and cheese"}},{"item":"garlic","qty":"2 cloves","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.1,"mode":"once","section":"Vegetables"}},{"item":"dry white wine","qty":"150 ml","product":"Vin blanc sec de cuisine","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":4.5}},{"item":"beef or vegetable stock","qty":"1.2 litres","product":"Bouillon de bœuf en cubes","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.6}},{"item":"butter","qty":"a good knob","product":"already in the fridge","pantry":true}],"steps":["Slice the onions as thinly as you can manage. A kilo looks absurd in the pan and cooks down to almost nothing.","Butter and a little oil in a wide heavy pan on medium-low. Onions in with a good pinch of salt, and now give them 40 minutes, stirring every five. This is the entire recipe. Rushed onions taste sharp and the soup never recovers.","They are ready when they are deep brown and jammy, not blond. If they catch, a splash of water lifts the fond back into them.","Garlic, 1 minute. Wine in, and scrape the base clean while it bubbles down by half.","Stock in, simmer 15 minutes, season hard.","Toast the baguette slices. Ladle the soup into ovenproof bowls, float the bread, pile the cheese on top.","Under a hot grill or in a 220°C oven until the cheese blisters and runs down the sides, about 5 minutes."],"equipment":["hob","oven","casserole dish"]},"choux-bruxelles-airfryer":{"title":"Air fryer sprouts with lardons and lemon","cuisine":"french","protein":"charcuterie","slot":"dinner","kind":"recipe","prepMinutes":10,"cookMinutes":18,"serves":2,"tags":["fast","no chilli"],"short":"Sprouts halved and charred hard in the air fryer, lardons crisped in with them, lemon and parmesan over the top while it all still steams.","ingredients":[{"item":"Brussels sprouts","qty":"500 g","product":"Choux de Bruxelles","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":3.2}},{"item":"lardons","qty":"1 pack (200 g)","product":"Herta Lardons nature","buy":{"amount":1,"mode":"sum","section":"Proteins"}},{"item":"garlic","qty":"2 cloves, sliced","product":"Le Choix du Primeur Ail BLANC","buy":{"amount":0.05,"mode":"once","section":"Vegetables"}},{"item":"lemon","qty":"1, zest and juice","product":"Le Choix du Primeur Citrons JAUNES","buy":{"amount":0.1,"mode":"sum","section":"Vegetables"}},{"item":"parmesan","qty":"a handful, grated","product":"Itinéraire des Saveurs, une marque Intermarché Parmigiano Reggiano AOP râpé","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}},{"item":"baguette","qty":"to serve","product":"Cuit sur place Baguette La Généreuse","buy":{"amount":1,"mode":"once","section":"Bread and cheese"}},{"item":"olive oil, salt, black pepper","qty":"to taste","product":"already in the cupboard","pantry":true}],"steps":["Trim the sprouts and halve them through the root, so each half holds together and gets one flat face. The flat face is where the browning happens.","Toss the halves in a little olive oil and salt. Air fryer at 190°C, cut side down, 10 minutes.","Shake, scatter the lardons and the sliced garlic in among them, and give it 8 minutes more. The lardons render into the sprouts, which is the whole point of cooking them together rather than separately.","They are ready when the outer leaves are properly black in places. Pale sprouts taste of nothing but sulphur; the charred ones taste sweet.","Tip into a warm bowl. Lemon zest and juice over while it steams, then the parmesan, then a lot of black pepper. Toss and eat with the baguette.","No chilli in this: the heat that a recipe like this usually carries comes from the lemon and the pepper instead.","Brussels sprouts have not been looked up at Méré yet, so they are priced as a guess until the next catalogue check."],"equipment":["air fryer"]},"rouleaux-printemps":{"title":"Fresh spring rolls","cuisine":"vietnamese","protein":"chicken","slot":"lunch","kind":"recipe","prepMinutes":25,"cookMinutes":8,"serves":2,"tags":["no chilli","make ahead","dairy-free"],"short":"Rice paper, poached chicken, vermicelli and a lot of herbs. The rolling is the whole skill and it takes two goes to get right.","ingredients":[{"item":"rice paper wrappers","qty":"12 sheets, 22 cm","product":"Galettes de riz","guess":true,"buy":{"amount":1,"mode":"sum","section":"Best guesses","price":2.5}},{"item":"chicken aiguillettes","qty":"250 g","product":"Fermiers de Loué Aiguillettes de poulet jaune","buy":{"amount":0.25,"mode":"sum","section":"Proteins"}},{"item":"rice vermicelli","qty":"100 g","product":"Suzi Wan Vermicelles de riz","buy":{"amount":1,"mode":"sum","section":"Store cupboard"}},{"item":"cucumber","qty":"half, in batons","product":"Le Choix du Primeur Concombre","buy":{"amount":1,"mode":"sum","section":"Vegetables"}},{"item":"carrot","qty":"1, shredded","product":"Le Choix du Primeur Carottes","buy":{"amount":0.1,"mode":"sum","section":"Vegetables"}},{"item":"coriander","qty":"half a bunch","product":"Le Choix du Primeur Coriandre","buy":{"amount":1,"mode":"once","section":"Vegetables"}},{"item":"mint","qty":"half a bunch","product":"Menthe fraîche","guess":true,"buy":{"amount":1,"mode":"once","section":"Best guesses","price":1.5}},{"item":"roasted peanuts","qty":"a handful, crushed","product":"Menguy's Cacahuètes grillées et salées","buy":{"amount":1,"mode":"once","section":"Store cupboard"}},{"item":"sweet soy, to dip","qty":"4 tbsp","product":"Itinéraire des Saveurs, une marque Intermarché Saveur d'Asie - Sauce soja sucrée","buy":{"amount":1,"mode":"once","section":"Store cupboard"}}],"steps":["Poach the aiguillettes in barely-simmering salted water for 8 minutes, then leave them in the water off the heat while you do everything else. They finish cooking as it cools and stay soft; boiled hard, they go stringy.","Soak the vermicelli in just-boiled water for 3 minutes, drain, and rinse under cold water until it stops clumping.","Shred the chicken along the grain. Cut the cucumber into batons, shred the carrot, pick the herb leaves off their stalks in whole sprigs rather than chopping them.","Set everything out in a row before you start rolling, with a wide shallow bowl of warm water at the end of it. Once a wrapper is wet you have about thirty seconds.","Dip one wrapper in the water for 2 seconds only — it will still feel stiff, and that is right. It keeps softening on the board. A wrapper soaked until it is floppy will tear.","Lay it down, put herbs first in a line a third of the way up, then vermicelli, carrot, cucumber and chicken on top. Herbs against the wrapper is what makes them show through.","Fold the bottom edge over the filling, pull it back tight to compact the roll, fold in both sides, then roll up. Tight is the difference between a spring roll and a bundle.","Crush the peanuts over the dipping soy. No chilli in the dip — the sweet soy and the mint carry it, which is the point of this version.","They keep a few hours under a damp cloth, not in the fridge uncovered or the wrappers go hard. Rice paper has not been looked up at Méré yet, so it is priced as a guess until the next catalogue check."],"equipment":["hob"]}},"plans":[{"weekOf":"2026-09-06","label":"Week of 6 September","store":"Intermarché Drive Méré","notes":["Saturday's Drive run already brought the proteins and the starch — aiguillettes de poulet, viande hachée, côtes de porc, chipolatas, riz basmati, deux pâtes à pizza, pesto, mozzarella, gouda, cheddar. The week is built around them.","The vegetables failed to go through on the Intermarché site, so this order is almost entirely produce. That is the gap, not a new week's shop.","Chinese,
